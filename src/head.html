<title>うちのこ日和</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one phone-width column — a sunlit pet room is the hero, soft stat pills under it, a toy-block action dock at the thumb */
:root{
  --ground:#EDF3F0;
  --surface:#FFFFFF;
  --surface-2:#F3F7F5;
  --ink:#3A3147;
  --ink-soft:#776E86;
  --line:#DCE4E1;
  --berry:#EC6C8A;
  --mint:#4FAE9A;
  --honey:#EFB443;
  --sky:#6FABE3;
  --lilac:#9F8BD6;
  --scrim:rgba(34,28,46,.42);
  --lift:0 6px 0 rgba(58,49,71,.07);
  --f-display:"Mochiy Pop One","Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Rounded Mplus 1c","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1B1922;--surface:#27242F;--surface-2:#211E29;--ink:#EFEBF6;--ink-soft:#A9A1B9;--line:#3A3546;
    --berry:#FF8BA6;--mint:#6CCBB6;--honey:#F5C562;--sky:#8EC1F2;--lilac:#B8A6EC;--scrim:rgba(8,6,14,.6);--lift:0 6px 0 rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#1B1922;--surface:#27242F;--surface-2:#211E29;--ink:#EFEBF6;--ink-soft:#A9A1B9;--line:#3A3546;
  --berry:#FF8BA6;--mint:#6CCBB6;--honey:#F5C562;--sky:#8EC1F2;--lilac:#B8A6EC;--scrim:rgba(8,6,14,.6);--lift:0 6px 0 rgba(0,0,0,.28);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

.app{box-sizing:border-box;max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:12px 16px}

/* header */
.top{display:flex;align-items:center;gap:10px}
.who{flex:1;min-width:0}
.who h1{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.25;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who p{margin:0;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvchip{display:flex;align-items:center;gap:5px;background:var(--surface);border-radius:999px;padding:6px 12px 6px 9px;font-weight:900;font-size:13px;box-shadow:var(--lift);font-variant-numeric:tabular-nums;white-space:nowrap}
.lvchip svg{width:18px;height:18px}
.iconbtn{flex:none;width:42px;height:42px;border-radius:14px;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:var(--lift);cursor:pointer}
.iconbtn{position:relative}
.iconbtn svg{width:22px;height:22px}
.badge{position:absolute;right:-4px;top:-4px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:var(--berry);color:#FFFFFF;font-size:11px;font-weight:900;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--ground);font-variant-numeric:tabular-nums}
.badge.done{background:var(--mint)}
.lvpill{margin-left:6px;background:color-mix(in srgb,var(--berry) 16%,var(--surface));color:var(--berry);border-radius:999px;padding:1px 8px;font-size:12px;font-variant-numeric:tabular-nums}

/* stage */
.stage{position:relative;flex:1 1 auto;min-height:340px;max-height:560px;border-radius:28px;overflow:hidden;isolation:isolate;user-select:none;-webkit-user-select:none;
  --wall:#E1EFE9;--dot:rgba(255,255,255,.6);--sky1:#9ED2F4;--sky2:#DDF2FF;--floor1:#EACFA6;--floor2:#DDB98C}
.stage[data-tod="morning"]{--sky1:#FFC4A3;--sky2:#CFE9FF}
.stage[data-tod="evening"]{--sky1:#F3906A;--sky2:#F9D29C}
.stage[data-tod="night"]{--sky1:#141A3A;--sky2:#323A74}
.tint{position:absolute;inset:0 0 40% 0;pointer-events:none;transition:background-color 1s}
.stage[data-tod="morning"] .tint{background:rgba(255,190,150,.16)}
.stage[data-tod="evening"] .tint{background:rgba(255,140,80,.18)}
.stage[data-tod="night"] .tint{background:rgba(40,44,100,.42)}
.stage[data-walldark="1"][data-tod="night"] .tint{background:rgba(20,22,60,.25)}
.view{position:absolute;inset:0;width:100%;height:100%;z-index:1;--vw1:#8FA8C6;--vw2:#A9C2DA;--vwin:#FFF3C4;--vsea:#5FA8D8;transition:filter 1s}
.stage[data-tod="night"] .view{filter:brightness(.5) saturate(.8)}
.stage:not([data-tod="night"]) .view{--vwin:rgba(255,255,255,.55)}
.weather{position:absolute;inset:-20% 0 0 0;z-index:1;pointer-events:none}
.weather.w-snow{background:radial-gradient(#FFFFFF 1.6px,transparent 2.2px) 0 0/18px 22px,radial-gradient(#FFFFFF 1.2px,transparent 1.8px) 9px 11px/24px 26px;animation:fall 6s linear infinite}
.weather.w-petals{background:radial-gradient(ellipse 3px 2px,#F9C6D3 90%,transparent) 0 0/26px 30px,radial-gradient(ellipse 2.4px 1.6px,#F4B4C6 90%,transparent) 13px 15px/34px 36px;animation:fall 9s linear infinite}
.weather.w-rain{background:repeating-linear-gradient(105deg,transparent 0 9px,rgba(255,255,255,.55) 9px 10px,transparent 10px 22px);background-size:100% 40px;animation:rain .5s linear infinite;opacity:.8}
@keyframes fall{to{background-position:0 120px,9px 131px}}
@keyframes rain{to{background-position:0 40px}}
.evdeco{position:absolute;inset:0;pointer-events:none;z-index:1}
.evdeco .gl{position:absolute;left:1%;right:1%;top:1.5%;height:7%}
.evdeco .garland{width:100%;height:100%;display:block;overflow:visible}
.evdeco .evitem{position:absolute;left:63%;top:61.5%;width:16%;transform:translateY(-100%)}
.evdeco .evitem svg,.evhang svg{display:block;width:100%;height:auto}
.evhang{position:absolute;left:30%;top:8%;width:7%;z-index:2;pointer-events:none;animation:sway 3s ease-in-out infinite;transform-origin:50% 0}
@keyframes sway{50%{transform:rotate(6deg)}}
.wall{position:absolute;inset:0 0 40% 0;background:radial-gradient(var(--dot) 2px,transparent 2.6px) 0 0/22px 22px,var(--wall);transition:background-color 1s}
.floor{position:absolute;inset:60% 0 0 0;background:repeating-linear-gradient(90deg,rgba(120,80,40,.10) 0 2px,transparent 2px 64px),linear-gradient(var(--floor1),var(--floor2))}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:#FFFFFF;opacity:.75}
.rug{position:absolute;left:50%;top:80%;width:76%;aspect-ratio:3/1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(ellipse closest-side,#CFDDF5 0 58%,#FFFFFF 58% 63%,#B9CBEF 63% 100%)}
.stage[data-tod="night"] .rug{filter:brightness(.72)}
.win{position:absolute;z-index:1;left:7%;top:8%;width:31%;aspect-ratio:4/5;box-sizing:border-box;border:7px solid #FFFFFF;border-radius:18px 18px 8px 8px;background:linear-gradient(var(--sky1),var(--sky2));overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.win::before,.win::after{content:"";position:absolute;background:#FFFFFF;z-index:2}
.win::before{left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%)}
.win::after{top:50%;left:0;right:0;height:6px}
.orb{position:absolute;right:12%;top:12%;width:28%;aspect-ratio:1;border-radius:50%;background:#FFE6A1;box-shadow:0 0 0 6px rgba(255,230,161,.35)}
.stage[data-tod="night"] .orb{background:transparent;box-shadow:inset 7px -3px 0 0 #F6F0C8}
.cloud{position:absolute;left:-30%;top:58%;width:44%;height:14%;border-radius:99px;background:#FFFFFF;opacity:.9;animation:drift 38s linear infinite}
.cloud::before{content:"";position:absolute;left:22%;top:-70%;width:46%;height:150%;border-radius:50%;background:inherit}
.stars{position:absolute;inset:0;opacity:0;background:radial-gradient(#FFF 1px,transparent 1.6px) 4px 6px/26px 22px,radial-gradient(#FFF 1px,transparent 1.6px) 15px 14px/31px 27px}
.stage[data-tod="night"] .stars{opacity:.8}
.stage[data-tod="night"] .cloud{opacity:.15}
@keyframes drift{to{transform:translateX(330%)}}
.clock{position:absolute;left:47%;top:11%;width:13%;aspect-ratio:1;border-radius:50%;background:#FFFFFF;box-shadow:inset 0 0 0 4px #F2B8C6,0 3px 0 rgba(0,0,0,.06)}
.clock i{position:absolute;left:50%;bottom:50%;width:3px;border-radius:3px;background:#3A3147;transform-origin:50% 100%;margin-left:-1.5px}
.clock .h{height:24%}.clock .m{height:34%;width:2px;margin-left:-1px}
.clock::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#EC6C8A}
.frame{position:absolute;right:8%;top:9%;width:22%;aspect-ratio:1;box-sizing:border-box;padding:5px;background:#FFFFFF;border-radius:6px;transform:rotate(4deg);box-shadow:0 4px 0 rgba(0,0,0,.07)}
.frame img{display:block;width:100%;height:100%;object-fit:cover;border-radius:3px}
.frame::before{content:"";position:absolute;left:50%;top:-12px;width:2px;height:12px;background:#B9A79A;transform:translateX(-50%)}
.plant{position:absolute;left:2%;top:60%;width:15%;transform:translateY(-92%);z-index:2}
.lamp{position:absolute;right:3%;top:60%;width:12%;transform:translateY(-94%);z-index:2}
.lamp .glow{opacity:0;transition:opacity 1s}
.stage[data-tod="night"] .lamp .glow{opacity:1}
.shade{position:absolute;inset:0;z-index:300;pointer-events:none;opacity:0;transition:opacity 1.2s;background:radial-gradient(circle at 92% 46%,rgba(255,206,130,.32),transparent 38%),rgba(22,24,64,.26)}
.stage[data-tod="night"] .shade{opacity:1}
.bowl{position:absolute;left:24%;top:93%;width:21%;transform:translate(-50%,-100%);z-index:200}
.bowl .food{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.bowl.filled .food{opacity:1;transform:none}
.cushion{position:absolute;left:76%;top:84%;width:40%;transform:translate(-50%,-62%);z-index:3}

/* pet */
.pet{position:absolute;left:50%;top:78%;width:46%;max-width:250px;aspect-ratio:1;--s:1;transform:translate(-50%,-93%) scale(var(--s));transform-origin:50% 93%;touch-action:none;cursor:grab;transition:transform .4s ease}
.pet .pet-svg{display:block;width:100%;height:100%;overflow:visible}
.pet-svg .pv-all{transform-box:view-box;transform-origin:120px 224px;animation:breathe 3.4s ease-in-out infinite}
.pet-svg .pv-tail{transform-box:view-box;transform-origin:152px 198px;animation:wag 1.8s ease-in-out infinite}
.pet-svg .pv-head{transform-box:view-box;transform-origin:120px 146px;transition:transform .5s ease}
.pet-svg .pv-body{transform-box:view-box;transform-origin:120px 222px;transition:transform .5s ease}
.pet-svg .pv-legs{transition:opacity .4s}
.pet-svg .pv-neck{transform-box:view-box;transform-origin:120px 146px;transition:transform .5s ease}
.pet-svg .pv-eyes-open{animation:blink 5.4s infinite;transform-box:view-box;transform-origin:120px 98px}
.pet-svg .pv-eyes-happy,.pet-svg .pv-eyes-closed,.pet-svg .pv-brow-sad,.pet-svg .pv-mouth-o{display:none}
.pet-svg .pv-cheek{opacity:.45;transition:opacity .3s}
.ex-happy .pv-eyes-open,.ex-eat .pv-eyes-open,.ex-sleep .pv-eyes-open{display:none}
.ex-happy .pv-eyes-happy,.ex-eat .pv-eyes-happy{display:inline}
.ex-sleep .pv-eyes-closed{display:inline}
.ex-happy .pv-mouth-w,.ex-eat .pv-mouth-w{display:none}
.ex-happy .pv-mouth-o,.ex-eat .pv-mouth-o{display:inline}
.ex-happy .pv-cheek{opacity:.8}
.ex-sad .pv-brow-sad{display:inline}
.ex-eat .pv-head{animation:chomp .32s ease-in-out infinite alternate}
.wag-fast .pv-tail{animation-duration:.38s}
.tilt .pv-head{animation:tilt 1s ease-in-out}
.pose-sleep .pv-legs{opacity:0}
.pose-sleep .pv-body{transform:scaleY(.8)}
.pose-sleep .pv-head{transform:translate(0,22px) rotate(-7deg)}
.pose-sleep .pv-neck{transform:translate(0,21px) rotate(-7deg)}
.ex-eat .pv-neck{animation:chomp .32s ease-in-out infinite alternate}
.pose-sleep .pv-tail{animation:none;transform:translate(-8px,12px) rotate(30deg)}
.pose-sleep .pv-all{animation-duration:4.6s}
.pet.walking .pv-all{animation:hop .34s ease-in-out infinite}
.pet.walking .pet-svg{transform:rotate(4deg)}
.pet.walking.dir-l .pet-svg{transform:rotate(-4deg)}
.pet.jump .pv-all{animation:jump .5s ease-out}
@keyframes breathe{50%{transform:scaleY(1.018)}}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes chomp{to{transform:translateY(5px) rotate(1deg)}}
@keyframes tilt{35%,65%{transform:rotate(-10deg)}}
@keyframes hop{50%{transform:translateY(-9px)}}
@keyframes jump{40%{transform:translateY(-34px) scaleY(1.04)}70%{transform:translateY(0) scaleY(.94)}}
.pet-svg .pv-legL,.pet-svg .pv-legR{transform-box:view-box}
.pet-svg .pv-legL{transform-origin:108px 182px}
.pet-svg .pv-legR{transform-origin:131px 182px}
.tr-sit .pv-all{animation:trSit 1.1s ease}
@keyframes trSit{30%,70%{transform:scaleY(.9) translateY(4px)}}
.tr-paw .pv-legR{animation:trPaw 1.6s ease}
@keyframes trPaw{20%,75%{transform:translate(4px,-30px) rotate(-38deg)}}
.tr-high .pv-legR{animation:trHigh 1.6s ease}
@keyframes trHigh{25%,70%{transform:translate(8px,-50px) rotate(-75deg)}}
.tr-high .pv-all{animation:jump .5s ease-out .25s}
.tr-down .pv-legs{opacity:0}
.tr-down .pv-body{transform:scaleY(.8)}
.tr-down .pv-head,.tr-down .pv-neck{transform:translate(0,22px)}
.tr-spin .pet-svg{animation:trSpin 1s ease-in-out}
@keyframes trSpin{25%{transform:scaleX(0) translateY(-8px)}50%{transform:scaleX(-1) translateY(-12px)}75%{transform:scaleX(0) translateY(-8px)}}
.tr-bigjump .pv-all{animation:trBig .9s ease-out}
@keyframes trBig{35%{transform:translateY(-70px) rotate(-6deg)}60%{transform:translateY(-66px) rotate(6deg)}85%{transform:translateY(0) scaleY(.9)}}
.tr-roll .pv-all{transform-origin:120px 150px;animation:trRoll 1.3s ease-in-out}
@keyframes trRoll{50%{transform:translateX(30px) rotate(180deg)}100%{transform:translateX(0) rotate(360deg)}}
.tr-bow .pv-head,.tr-bow .pv-neck{animation:trBow 1.4s ease}
@keyframes trBow{30%,65%{transform:translate(0,16px) rotate(4deg)}}
.tr-dance .pv-all{animation:trDance 1.8s ease-in-out}
@keyframes trDance{10%,50%{transform:rotate(-10deg) translateY(-8px)}30%,70%{transform:rotate(10deg) translateY(-8px)}90%{transform:none}}
.tr-dance .pv-legR{animation:trPaw .9s ease 2}
.tr-bang .pv-all{animation:trBang 2.2s ease}
@keyframes trBang{15%{transform:rotate(-8deg)}35%,75%{transform:rotate(80deg) translate(10px,0)}100%{transform:none}}
.tr-stretch .pv-all{animation:trStretch 1.6s ease}
@keyframes trStretch{30%,70%{transform:scaleX(1.14) scaleY(.86)}}
.tr-punch .pv-legR{animation:trPunch .35s ease 4 alternate}
@keyframes trPunch{to{transform:translate(8px,-24px) rotate(-55deg)}}

.bubble{position:absolute;left:50%;bottom:92%;z-index:2;transform:translateX(-50%) scale(.6);transform-origin:50% 100%;opacity:0;pointer-events:none;background:#FFFFFF;color:#3A3147;font-weight:700;font-size:14px;line-height:1.4;padding:7px 13px;border-radius:16px;white-space:nowrap;box-shadow:0 3px 0 rgba(58,49,71,.12);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.bubble::after{content:"";position:absolute;left:50%;top:100%;border:7px solid transparent;border-top-color:#FFFFFF;transform:translateX(-50%)}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}

/* fx */
.fx{position:absolute;pointer-events:none;z-index:400}
.fx.heart{width:24px;height:24px;margin:-12px 0 0 -12px;animation:rise 1.2s ease-out forwards}
.fx.z{font-family:var(--f-display);color:#FFFFFF;font-size:18px;text-shadow:0 2px 0 rgba(40,40,90,.35);animation:zz 2.4s ease-out forwards}
.fx.crumb{width:7px;height:7px;border-radius:50%;background:#C98A48;animation:crumb .7s ease-out forwards}
.fx.spark{width:10px;height:10px;margin:-5px;border-radius:2px;animation:spark 1.1s ease-out forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1;transform:translate(0,-8px) scale(1.1)}100%{transform:translate(var(--dx,0px),-70px) scale(.9);opacity:0}}
@keyframes zz{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(26px,-60px) scale(1.2);opacity:0}}
@keyframes crumb{to{transform:translate(var(--dx,0px),22px);opacity:0}}
@keyframes spark{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.toy{position:absolute;width:9%;aspect-ratio:1;transform:translate(-50%,-100%);pointer-events:none}
.toy svg{display:block;width:100%;height:100%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.treatpop{position:absolute;width:13%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:420;pointer-events:none;animation:bob .7s ease-in-out infinite alternate;transition:top .45s ease-in,left .45s ease-in,opacity .3s}
.treatpop svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
@keyframes bob{to{margin-top:-6px}}
.toast{position:absolute;left:50%;top:12px;z-index:500;opacity:0;max-width:86%;transform:translate(-50%,-160%);background:#FFFFFF;color:#3A3147;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;box-shadow:0 4px 0 rgba(58,49,71,.12);transition:transform .35s cubic-bezier(.3,1.4,.5,1);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.hint{position:absolute;left:50%;bottom:10px;z-index:450;transform:translateX(-50%);background:rgba(255,255,255,.88);color:#3A3147;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .5s}

.levelup{position:fixed;inset:0;z-index:70;display:grid;place-items:center;overflow:auto;background:var(--scrim);padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));animation:fadein .25s ease}
.levelup.closing{opacity:0;transition:opacity .2s}
.levelup .fx{position:fixed;z-index:0}
@keyframes fadein{from{opacity:0}}
.levelup .card{position:relative;z-index:1;box-sizing:border-box;background:var(--surface);color:var(--ink);border-radius:28px;padding:22px 20px 18px;text-align:center;max-width:320px;width:100%;box-shadow:0 8px 0 rgba(0,0,0,.08);animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.levelup h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:4px 0 6px;color:var(--berry);text-wrap:balance}
.levelup p{margin:0 0 12px;font-size:14px;color:var(--ink-soft)}
.levelup ul{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.levelup li{background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.levelup .mpet{width:120px;margin:0 auto}
.levelup .mpet .pet-svg{display:block;width:100%;height:auto}
.levelup .quote{color:var(--ink);font-weight:700}
.levelup .btnrow{justify-content:center;flex-wrap:nowrap}
.levelup .btnrow .btn{flex:1 1 0;min-width:0}
.levelup .giftline{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.levelup .gainline{color:var(--berry);font-weight:900;font-size:16px;margin-top:-4px}
.mini{width:24px;height:24px;flex:none;display:block}
.mini.dim{opacity:.35;filter:grayscale(1)}
.souvwrap{position:relative;width:170px;margin:0 auto}
.souvwrap .mpet{width:120px;margin:0}
.souvitem{position:absolute;right:0;bottom:6px;width:64px;height:64px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 3px var(--surface-2),0 4px 0 rgba(0,0,0,.06);display:grid;place-items:center;animation:pop .5s .2s both cubic-bezier(.3,1.6,.5,1)}
.souvitem svg{width:46px;height:46px}
.newpill,.evpill,.okpill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:900;line-height:1.5}
.newpill{position:absolute;top:-6px;right:-6px;background:var(--berry);color:#FFFFFF}
.evpill{background:color-mix(in srgb,var(--honey) 30%,var(--surface));color:var(--ink)}
.okpill{background:color-mix(in srgb,var(--mint) 22%,var(--surface));color:color-mix(in srgb,var(--mint) 70%,var(--ink))}
