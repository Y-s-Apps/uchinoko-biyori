<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src '__SCRIPT_HASH__' https://static.line-scdn.net; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.line-scdn.net; connect-src 'self' https://*.line.me https://*.line-scdn.net https://ftakgswltcavwixqxpzi.supabase.co; frame-src https://*.line.me; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="写真の犬や猫をそっくりなペットにして、ごはん・おやつ・なでなででのんびり育てるアプリ">
<meta name="theme-color" content="#EDF3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1922" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<!-- favicon は いちばん上のもの（同じページを 審査用 /review/・開発用 /dev/ にも置くため）。
     LIFF SDK は js_line.js が読みこむ（読みこめたか・失敗したかを取りこぼさないため）。CSP で static.line-scdn.net を許可。
     サーバー（本人確認とセーブ）は Supabase の Edge Function：connect-src の ftakgswltcavwixqxpzi.supabase.co は js_line.js の LINE_CFG.api とそろえる -->
<style>
/* Android版LINEは edge-to-edge 表示：下のナビゲーションバーの分を、LINEの変数と safe-area の大きいほうであける
   （変数がどの要素に置かれても届くよう、使う場所ごとに書く） */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:max(env(safe-area-inset-bottom,0px),var(--android-safe-area-inset-bottom,0px))}
html{box-sizing:border-box;-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
.stage,.pet,.frame img,.profile img{-webkit-touch-callout:none}
button,.act,.tile,.chip,.sw,label{touch-action:manipulation}
html .sheet{padding-bottom:calc(22px + max(env(safe-area-inset-bottom,0px),var(--android-safe-area-inset-bottom,0px)))}
html .levelup{padding-bottom:calc(16px + max(env(safe-area-inset-bottom,0px),var(--android-safe-area-inset-bottom,0px)))}
html .onboard{padding-bottom:calc(24px + max(env(safe-area-inset-bottom,0px),var(--android-safe-area-inset-bottom,0px)))}
/* AIの読みとりの前の確認（LINE版だけ） */
.aiask{align-items:center;text-align:center;padding-top:8px}
.aiask .aiphoto{width:156px;height:156px;max-width:46vw;max-height:46vw;border-radius:50%;overflow:hidden;box-shadow:0 0 0 6px var(--surface),0 8px 0 6px rgba(0,0,0,.05)}
.aiask .aiphoto img{width:100%;height:100%;object-fit:cover;display:block}
.aiask .brand{font-size:24px;margin:4px 0 0}
.aiask .btn{max-width:360px}
.aiask .note{margin:-8px 0 0;max-width:360px}
/* 写真立ての イラスト（写真の控えがない子。LINE版だけ）。写真と同じ大きさで、上半身を大きめに */
.frame.art img{display:none}
.frame .frame-art{position:relative;width:100%;height:100%;border-radius:3px;overflow:hidden;background:linear-gradient(#FDF6EA,#F3E6D3)}
.frame-art .pet-svg{position:absolute;left:-14%;top:-2%;width:128%;height:128%}
.frame-art .pet-svg g{animation:none!important}
.frame-art .pv-shadow{display:none}
/* うちのこカードの見本（LINE版だけ）。絵は この端末で作った PNG（data:）を出す */
.cardprev .cardimg{width:min(184px,50vw);aspect-ratio:3/4;margin:0 auto 10px;border-radius:14px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.08);background:var(--surface-2)}
.cardprev .cardimg img{display:block;width:100%;height:100%}
.cardprev .cardleft{font-size:12px;margin:-4px 0 12px}
.cardprev .cardleft small{font-size:11px}
.cardprev .cardnote{font-size:11px;margin:12px 0 0;text-align:left}
/* プライバシーポリシー・利用規約へのリンク（LINE版だけ） */
.line-docs{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0}
.line-docs .linkbtn{font-size:13px;font-weight:500}
.linkbtn.inline{display:inline;padding:0 0 0 4px;font-size:inherit;font-weight:700;vertical-align:baseline}
</style>
