<div class="app" id="app">
  <header class="top">
    <div class="who"><h1 id="petName">うちのこ</h1><p id="petBreed">&nbsp;</p></div>
    <button class="iconbtn" id="reqBtn" type="button" aria-label="きょうのおねがい">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M9 4.5h6v2.5H9z" fill="currentColor"/><path d="M12 17.2s-3.4-2-4-3.8c-.5-1.3.3-2.6 1.6-2.6 1 0 1.8.6 2.4 1.3.6-.7 1.4-1.3 2.4-1.3 1.3 0 2.1 1.3 1.6 2.6-.6 1.8-4 3.8-4 3.8z" fill="var(--berry)"/></svg>
      <span class="badge" id="reqBadge">3</span>
    </button>
    <button class="iconbtn" id="albumBtn" type="button" aria-label="おもいでアルバム">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h11.5A2.5 2.5 0 0 1 19 7v12.5H7.5A2.5 2.5 0 0 1 5 17z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M5 17a2.5 2.5 0 0 1 2.5-2.5H19" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="9.5" r="2.4" fill="var(--honey)"/></svg>
    </button>
    <button class="iconbtn" id="menuBtn" type="button" aria-label="メニュー">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </header>

  <section class="stage" id="stage" data-tod="day" aria-label="おへや">
    <div class="wall"></div>
    <div class="tint"></div>
    <div class="evdeco" id="evDeco" aria-hidden="true"></div>
    <div class="win" aria-hidden="true"><div class="stars"></div><div class="orb"></div><div class="cloud"></div><svg class="view" id="viewArt" viewBox="0 0 100 128" preserveAspectRatio="xMidYMax slice"></svg><div class="weather" id="weather"></div></div>
    <div class="evhang" id="evHang" aria-hidden="true"></div>
    <div class="clock" aria-hidden="true"><i class="h" id="clockH"></i><i class="m" id="clockM"></i></div>
    <div class="frame" id="frame" hidden><img id="frameImg" alt="モデルになった写真"></div>
    <div class="floor"></div>
    <div class="rug"></div>
    <svg class="plant" viewBox="0 0 60 100" aria-hidden="true">
      <path d="M30 62C18 52 8 40 10 24c10 6 16 18 20 38zM30 62c4-22 12-38 24-44 2 18-8 34-24 44zM30 62c-2-20 0-36 4-50 8 14 6 32-4 50z" fill="#7CC28F" stroke="#3F8A57" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M14 60h32l-4 34a5 5 0 0 1-5 4H23a5 5 0 0 1-5-4z" fill="#F1A889" stroke="#B46B50" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M12 60h36" stroke="#B46B50" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <svg class="lamp" viewBox="0 0 50 120" aria-hidden="true">
      <circle class="glow" cx="25" cy="30" r="24" fill="#FFE2A0" opacity=".5"/>
      <path d="M25 40v70M14 112h22" stroke="#8C7A86" stroke-width="4" stroke-linecap="round"/>
      <path d="M12 40L18 14h14l6 26z" fill="#FFF3D6" stroke="#C9A97A" stroke-width="2.4" stroke-linejoin="round"/>
    </svg>
    <svg class="cushion" viewBox="0 0 200 90" aria-hidden="true">
      <ellipse cx="100" cy="52" rx="95" ry="34" style="fill:var(--bed,#F3B9C6);stroke:var(--bedL,#C77E91)" stroke-width="3"/>
      <ellipse cx="100" cy="47" rx="70" ry="22" style="fill:var(--bedI,#F9D6DE)"/>
    </svg>
    <svg class="bowl" id="bowl" viewBox="0 0 100 56" aria-hidden="true">
      <g class="food"><circle cx="30" cy="22" r="7" fill="#C98A48"/><circle cx="42" cy="17" r="7.5" fill="#B57638"/><circle cx="55" cy="18" r="7" fill="#C98A48"/><circle cx="67" cy="22" r="7" fill="#B57638"/><circle cx="48" cy="25" r="7" fill="#D39A5A"/></g>
      <path d="M8 26h84l-7 22a8 8 0 0 1-8 6H23a8 8 0 0 1-8-6z" fill="#6FC3AE" stroke="#3C8C7A" stroke-width="3" stroke-linejoin="round"/>
      <path d="M5 26h90" stroke="#3C8C7A" stroke-width="5" stroke-linecap="round"/>
      <path d="M8 26h84" stroke="#A6E0D2" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M44 40c-2-3 2-6 6-3 4-3 8 0 6 3l-6 5z" fill="#FFFFFF" opacity=".85"/>
    </svg>
    <div class="pet" id="pet" role="button" tabindex="0" aria-label="なでる"><div id="petArt"></div><div class="bubble" id="bubble"></div></div>
    <div class="shade"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="hint" id="hint" hidden>なでなでしてみてね</div>
  </section>

  <section class="stats" aria-label="ようす">
    <div class="meter" id="mFull" style="--c:var(--honey)">
      <div class="row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18l-2 6a3 3 0 0 1-3 2H8a3 3 0 0 1-3-2z" fill="var(--honey)"/><circle cx="9" cy="10" r="2.2" fill="#B97A3C"/><circle cx="13" cy="9" r="2.4" fill="#C98A48"/><circle cx="16.5" cy="10.5" r="2" fill="#B97A3C"/></svg>おなか<span class="state" id="sFull"></span></div>
      <div class="bar"><i id="bFull"></i></div>
    </div>
    <div class="meter" id="mMood" style="--c:var(--mint)">
      <div class="row"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="var(--mint)"/><path d="M8 10.5h.01M16 10.5h.01" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/><path d="M8.5 14.5q3.5 3 7 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/></svg>ごきげん<span class="state" id="sMood"></span></div>
      <div class="bar"><i id="bMood"></i></div>
    </div>
    <div class="meter love" style="--c:var(--berry)">
      <div class="row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.6 6.6 4.6c2.2 0 3.6 1.2 4.4 2.5.8-1.3 2.2-2.5 4.4-2.5 3.6 0 5.7 3.8 4.2 7.2C19.5 16.4 12 21 12 21z" fill="var(--berry)"/></svg>なかよし<span class="lvpill" id="lvNum">Lv1</span><span class="state" id="sLove"></span></div>
      <div class="bar"><i id="bLove"></i></div>
    </div>
  </section>

  <nav class="dock" aria-label="おせわ">
    <button class="act" id="actFeed" type="button" style="--c:var(--honey)">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="17" cy="22" r="4.2" fill="#C98A48"/><circle cx="24" cy="19" r="4.6" fill="#B57638"/><circle cx="31" cy="22" r="4.2" fill="#C98A48"/><path d="M8 25h32l-3 11a5 5 0 0 1-5 4H16a5 5 0 0 1-5-4z" fill="var(--honey)" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M6 25h36" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      ごはん
    </button>
    <button class="act" id="actTreat" type="button" style="--c:var(--berry)">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 40s-13-8-15.5-16C6.7 18 10 12 16 12c3.6 0 6 2 8 4.6 2-2.6 4.4-4.6 8-4.6 6 0 9.3 6 7.5 12C37 32 24 40 24 40z" fill="#E9B872" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M17 20h.01M28 19h.01M22 27h.01M31 26h.01M18 29h.01" stroke="var(--berry)" stroke-width="3.4" stroke-linecap="round"/></svg>
      おやつ
    </button>
    <button class="act" id="actPlay" type="button" style="--c:var(--sky)">
      <svg viewBox="0 0 48 48" aria-hidden="true"><defs><clipPath id="sbIcon"><circle cx="24" cy="25" r="14"/></clipPath></defs><circle cx="24" cy="25" r="14" fill="#FFFFFF"/><g clip-path="url(#sbIcon)"><polygon points="30.5,16.1 29.1,11.8 32.7,9.2 36.3,11.8 34.9,16.1" fill="#2E2A33"/><polygon points="34.5,28.4 38.1,25.8 41.7,28.4 40.3,32.6 35.9,32.6" fill="#2E2A33"/><polygon points="24.0,36.0 27.6,38.7 26.2,42.9 21.8,42.9 20.4,38.7" fill="#2E2A33"/><polygon points="13.5,28.4 12.1,32.6 7.7,32.6 6.3,28.4 9.9,25.8" fill="#2E2A33"/><polygon points="17.5,16.1 13.1,16.1 11.7,11.8 15.3,9.2 18.9,11.8" fill="#2E2A33"/></g><polygon points="24.0,20.1 28.7,23.5 26.9,29.0 21.1,29.0 19.3,23.5" fill="#2E2A33"/><path d="M24.0 20.1L24.0 15.9M28.7 23.5L32.6 22.2M26.9 29.0L29.3 32.3M21.1 29.0L18.7 32.3M19.3 23.5L15.4 22.2" stroke="#2E2A33" stroke-width="1.15" stroke-linecap="round"/><circle cx="24" cy="25" r="14" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
      あそぶ
    </button>
    <button class="act" id="actTrick" type="button" style="--c:var(--mint)">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 7l4.8 10.4 11.4 1.2-8.5 7.7 2.4 11.2L24 31.8l-10.1 5.7 2.4-11.2-8.5-7.7 11.4-1.2z" fill="var(--honey)" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M38 8l1 2.2 2.2 1-2.2 1L38 14.4l-1-2.2-2.2-1 2.2-1zM9 34l.8 1.6 1.6.8-1.6.8L9 38.8l-.8-1.6-1.6-.8 1.6-.8z" fill="currentColor"/></svg>
      げい
    </button>
    <button class="act" id="actDress" type="button" style="--c:var(--lilac)">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 24L9 14q-4 10 0 20zM24 24l15-10q4 10 0 20z" fill="var(--lilac)" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M22 26l-5 12M26 26l5 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="24" cy="24" r="5" fill="#FFFFFF" stroke="currentColor" stroke-width="2.2"/></svg>
      きせかえ
    </button>
  </nav>
</div>

<div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="onboard" id="onboard" hidden><div class="ob" id="ob"></div></div>
