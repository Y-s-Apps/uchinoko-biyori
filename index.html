const Persist = {
  ref:null, mode:'local', timer:null, writing:false, again:false,
  restored:null, bkDay:null, failNoticed:false,
  checking:false,   /* Claude版：クラウドの セーブを たしかめている あいだ（はじめての画面に「たしかめています」。診断 3-7） */
  base:null,   /* `updated` of the save this device opened with: opening the app bumps S.updated, this does not */
  readSave(t){
    try { const v = t ? JSON.parse(t) : null; return v && typeof v === 'object' && v.pet && typeof v.pet === 'object' ? v : null; }
    catch(e){ return null; }
  },
  /* the save on this device; if it cannot be read, it is kept aside and the backup is used instead */
  loadLocal(){
    let raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch(e){ return null; }
    const v = this.readSave(raw);
    if (v){ this.base = Number(v.updated) || 0; return v; }
    if (raw != null){ try { localStorage.setItem(BROKEN_KEY, raw); } catch(e){} }
    let b = null;
    try { b = this.readSave(localStorage.getItem(BACKUP_KEY)); } catch(e){}
    if (b) this.restored = this.base = Number(b.updated) || 0;
    return b;
  },
  /* once a day, before the first save, the last good save is copied aside */
  backup(){
    const day = dayKey();
    if (this.bkDay === day) return;
    try {
      if (localStorage.getItem(BACKUP_DAY_KEY) !== day){
        const prev = localStorage.getItem(STORE_KEY);
        if (this.readSave(prev)){ localStorage.setItem(BACKUP_KEY, prev); localStorage.setItem(BACKUP_DAY_KEY, day); }
      }
      this.bkDay = day;
    } catch(e){}
  },
  saveLocal(){
    if (!S) return;
    this.backup();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
    catch(e){ if (HOME) this.failNotice(); }
  },
  failNotice(){
    if (this.failNoticed || !S) return;
    this.failNoticed = true;
    Modal.show({
      label:'ほぞんできませんでした',
      html:() => `${petCard('', 'ex-sad')}<h3>この端末に<br>ほぞんできませんでした</h3>
        <p>端末の空きが すくないのかも しれません。${esc(S.pet.name)}を なくさないように、「引っこし・バックアップ」で コードを コピーするか、ファイルで 保存しておいてね。</p>
        <div class="btnrow"><button class="btn" type="button" data-close>とじる</button><button class="btn primary" type="button" data-close="move">バックアップ</button></div>`,
    }).then(v => { if (v === 'move') openMove(); });
  },
  restoredNotice(){
    if (this.restored == null || !S) return;
    const when = this.restored ? fmtMD(this.restored) + 'の' : '';
    this.restored = null;
    Modal.show({
      label:'ひかえから もどしました',
      html:() => `${petCard()}<h3>ひかえから<br>もどしたよ</h3>
        <p>この端末の セーブが 読めなかったので、${when}ひかえから ${esc(S.pet.name)}を もどしました。</p>
        <button class="btn primary" type="button" data-close>OK</button>`,
    });
  },
  /* a home-screen app asks the browser not to clear its storage when the device runs low on space */
  keep(){
    try {
      const st = navigator.storage;
      if (HOME && st && st.persist && st.persisted) st.persisted().then(p => p || st.persist()).catch(() => {});
    } catch(e){}
  },
  schedule(){
    if (!S) return;
    S.updated = now();
    this.saveLocal();
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 1200);
  },
  async flush(){
    if (!this.ref || !S) return;
    if (this.writing){ this.again = true; return; }
    this.writing = true;
    try { await this.ref.set(JSON.parse(JSON.stringify(S))); this.mode = 'cloud'; }
    catch(e){
      const code = e && e.code;
      if (code === 'unavailable'){ setTimeout(() => this.flush(), 1500 + Math.random() * 1500); }
      else { this.ref = null; this.mode = 'local'; }
    }
    this.writing = false;
    if (this.again){ this.again = false; this.flush(); }
  },
  async connect(){
    if (!CL) return;
    this.checking = true;
    Onboard.checkLine();
    try { await this.connectCloud(); }
    finally { this.checking = false; Onboard.checkLine(); }
  },
  /* はじめての画面で「この子とくらす」「受け取る」を押したとき、クラウドを たしかめている あいだは 8秒まで まつ */
  async settle(ms = 8000){
    const t0 = Date.now();
    while (this.checking && Date.now() - t0 < ms) await new Promise(r => setTimeout(r, 200));
  },
  async connectCloud(){
    const [db, user] = await Promise.all([useCap('db'), useCap('user')]);
    if (!db || !user) return;
    let uid = null;
    try { uid = await user.id(); } catch(e){}
    if (!uid) return;
    try {
      const ref = db.doc('data/users/' + uid + '/pet');
      const snap = await ref.get();
      this.ref = ref; this.mode = 'cloud';
      /* the cloud copy goes through the same checks as a save on this device (ensureState runs in Game.start) */
      const raw = snap.exists ? snap.data() : null;
      const remote = raw && typeof raw === 'object' && raw.pet && typeof raw.pet === 'object' ? raw : null;
      /* compare with the save this device opened with, not with S.updated (already bumped by opening the app),
         so an older copy on this device never overwrites newer play from another device */
      const remoteT = remote ? Number(remote.updated) || 0 : 0;
      const localT = this.base != null ? this.base : (S ? Number(S.updated) || 0 : 0);
      /* この端末に セーブが なかった（はじめての端末）ときは、クラウドの子が 先。クラウドが 答える前に はじめての画面で
         新しい子を 作っても、クラウドの子を 上書きしない（診断 3-7） */
      const fresh = this.base == null;
      if (remote && (!S || fresh || remoteT > localT)){
        const met = fresh && (Onboard.busy || Game.started);
        S = JSON.parse(JSON.stringify(remote));
        this.base = remoteT;
        this.saveLocal();
        if (met){ Onboard.close(); Game.start('ただいま！'); toast(`クラウドに いた ${S.pet.name}と あえたよ`); }
        else Game.onStateReplaced();
      } else if (S && (!remote || (Number(S.updated) || 0) > remoteT)){
        this.flush();
      }
    } catch(e){ this.ref = null; this.mode = 'local'; }
  },
};

  /* 体勢の 部品（pvx-down・pvx-beg）を ふわっと けす（display:none に すると いっしゅんで きえて、前あしが ない コマが 出る） */
  leave(part){
    const c = 'leave-' + part, k = 'leaveT_' + part;
    this.el.classList.remove(c); void this.el.offsetWidth; this.el.classList.add(c);
    clearTimeout(this[k]); this[k] = setTimeout(() => this.el.classList.remove(c), 360);
  },
  /* しばらく その 体勢で、ms たったら すわる（とちゅうで ほかの 体勢に なったら なにも しない） */
  poseFor(p, ms){
    this.setPose(p, true);
    const tok = this.ptok;
    return sleep(ms).then(() => { if (tok === this.ptok && !this.busy) this.setPose('sit', true); });
  },
  setView(v, turn){
    if (v === this.view) return;
    this.view = v;
    this.draw(v);   /* くるっの まんなかで 入れかえる 前に かいておく */
    if (turn) this.turn(); else this.snap();
  },
  /* 左右の むき（left で 左）。よこむきの ときは くるっと まわる */
  face(left, turn){
    const d = left ? 'l' : 'r';
    if (d === this.dir) return;
    this.dir = d;
    if (turn && this.view === 'side') this.turn(); else this.applyView();
  },
  applyView(){
    this.draw(this.view);
    this.el.classList.toggle('view-side', this.view === 'side');
    this.el.classList.toggle('view-back', this.view === 'back');
    this.el.classList.toggle('dir-l', this.dir === 'l');
  },
  snap(){ this.ttok++; this.el.classList.remove('turning'); this.applyView(); },
  /* くるっ：入れもの（.pet-turn）を 0.32秒で scaleX 1→0.08→1。まんなか（0.16秒）で 絵と むきを 入れかえる。うごきを へらす 設定では すぐ */
  turn(){
    if (calmMotion()) return this.snap();
    const tok = ++this.ttok;
    this.el.classList.remove('turning'); void this.el.offsetWidth; this.el.classList.add('turning');
    setTimeout(() => this.applyView(), 160);
    setTimeout(() => { if (tok === this.ttok) this.el.classList.remove('turning'); }, 330);
  },
  /* しぐさ（GESTURE の id）が いま できるか。おせわ・げいの とちゅう・ほかの しぐさの とちゅう・合わない 体勢や 種類・ねている（calm で ない もの）・
     パズルや ランの ページを ひらいている（うしろでは 見えない）・うごきを へらす 設定 の ときは できない */
  canGesture(id){
    const g = hasId(GESTURE, id) ? GESTURE[id] : null;
    if (!g || !S || this.busy || this.gest) return false;
    if (g.sp && g.sp !== 'both' && g.sp !== (S.pet.species === 'cat' ? 'cat' : 'dog')) return false;
    if (this.sleeping && !g.calm) return false;
    if (g.poses && g.poses.indexOf(this.pose) < 0) return false;
    if (PuzzleUI.page || document.documentElement.classList.contains('run-open')) return false;
    if (calmMotion()) return false;
    return true;
  },
  /* しぐさを 1つ。おわったら true（しなかった・とちゅうで とめたら false）の Promise */
  gesture(id){
    if (!this.canGesture(id)) return Promise.resolve(false);
    const cls = 'g-' + id, tok = ++this.gtok;
    this.gest = id;
    void this.el.offsetWidth;   /* とめた すぐ あとに 同じ しぐさでも はじめから */
    this.el.classList.add(cls);
    return sleep(GESTURE[id].ms).then(() => {
      if (tok !== this.gtok) return false;
      this.el.classList.remove(cls); this.gest = null;
      return true;
    });
  },
  /* いまの しぐさを すぐ やめる（おせわ・げい・タップの 前） */
  stopGesture(){
    if (!this.gest) return;
    this.el.classList.remove('g-' + this.gest);
    this.gest = null; this.gtok++;
  },
  /* なでている あいだ、目（±4px）と 頭（±5px・±4°）を 指の ほうへ（x は 画面の x。null で もどす）。すわっていて、ねていない・おせわの とちゅうで ない とき */
  lean(x){
    let head = '', eye = '';
    if (x != null && !this.sleeping && !this.busy && this.pose === 'sit'){
      const r = this.el.getBoundingClientRect();
      const k = r.width ? clamp((x - (r.left + r.width / 2)) / (r.width * .5), -1, 1) : 0;
      head = `translate(${(k * 5).toFixed(1)}px,0) rotate(${(k * 4).toFixed(1)}deg)`;
      eye = `translateX(${(k * 4).toFixed(1)}px)`;
    }
    this.el.querySelectorAll('.pv-head-g,.pv-neck-g').forEach(n => { n.style.transform = head; });
    this.el.querySelectorAll('.pv-eye').forEach(n => { n.style.transform = eye; });
  },
  baseExpr(){
    if (this.sleeping) return 'sleep';
    if (S && (S.stats.full < 25 || S.stats.mood < 28)) return 'sad';
    return null;
  },
  setExpr(e){
    this.expr = e;
    const cur = e || this.baseExpr();
    this.el.classList.remove('ex-happy', 'ex-eat', 'ex-sleep', 'ex-sad');
    if (cur) this.el.classList.add('ex-' + cur);
  },
  flash(e, ms){ this.setExpr(e); clearTimeout(this.flashT); this.flashT = setTimeout(() => this.setExpr(null), ms); },
  say(text, ms = 2400){
    const b = $('#bubble');
    b.textContent = text; b.style.removeProperty('--bx'); b.style.removeProperty('--bt'); b.classList.add('show');
    /* ふきだしは 頭の 上（よこむきは 頭が 前に ある）。おへやの はしで 切れないように、ふきだしだけ 内がわへ ずらす
       （しっぽ〈--bt〉は 頭を さしたまま。うちのこは --s で 大きさが かわる） */
    try {
      const sc = Number(getComputedStyle(this.el).getPropertyValue('--s')) || 1;
      const pr = this.el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      const half = b.offsetWidth * sc / 2, cx = pr.left + pr.width * this.poseX(), pad = 6;
      const dx = cx - half < sr.left + pad ? sr.left + pad - (cx - half) : cx + half > sr.right - pad ? sr.right - pad - (cx + half) : 0;
      const base = cx - (pr.left + pr.width / 2);
      if (dx || base){ b.style.setProperty('--bx', ((base + dx) / sc).toFixed(1) + 'px'); b.style.setProperty('--bt', (dx / sc).toFixed(1) + 'px'); }
    } catch(e){}
    clearTimeout(this.sayT); this.sayT = setTimeout(() => b.classList.remove('show'), ms);
  },
  /* あるく（2026-11-27 だんかい 2）：よこむきに なって 行く ほうを むき（くるっ）、4本足で あるく（奥へは うしろすがた＝だんかい 4）。着いたら end の 体勢
     （end なし：おせわの とちゅうは すわる＝正面で たべる・げい、ひまな ときは たつ）。かかる 時間は 前と 同じ（くるっは あるきながら）。
     ちいさな うごき（2.5 より 近い）は むきを かえない（end が あれば その 体勢に） */
  moveTo(x, y, speed = 1, end){
    const d = Math.hypot(x - this.x, (y - this.y) * 1.6);
    const ms = Math.max(260, d * 36 / speed);
    const tok = ++this.tok;
    const walk = d >= 2.5;
    this.el.style.transition = `left ${ms}ms linear, top ${ms}ms linear, transform ${ms}ms linear`;
    if (walk){
      this.stopGesture(); this.lean(null); this.rub = null;
      const step = clamp(.56 / Math.sqrt(speed), .3, .75);
      this.el.style.setProperty('--step', step.toFixed(2) + 's');
      this.el.style.setProperty('--half', (step / 2).toFixed(2) + 's');
      this.el.style.setProperty('--lag', (-step / 2).toFixed(2) + 's');
      /* 奥（かべの ほう）へ むかう ときは うしろすがたで あるく（上へ うごく ぶんが よこより 大きい とき。だんかい 4）。むきは おぼえる だけ */
      if ((this.y - y) * 1.6 > Math.abs(x - this.x)){ this.dir = x < this.x ? 'l' : 'r'; this.setPose('bwalk', true); }
      else { this.face(x < this.x, true); this.setPose('walk', true); }
    }
    this.x = x; this.y = y; this.apply();
    return sleep(ms).then(() => {
      if (tok !== this.tok) return;
      if (end || walk) this.setPose(end || (this.busy ? 'sit' : 'stand'), true);
    });
  },
  jump(){ this.el.classList.remove('jump'); void this.el.offsetWidth; this.el.classList.add('jump'); setTimeout(() => this.el.classList.remove('jump'), 520); },
  /* クラスを ms だけ（おせわ・げいの とちゅうの 動き。Pet.gesture と ちがって busy でも する） */
  cls(c, ms){
    this.el.classList.remove(c); void this.el.offsetWidth; this.el.classList.add(c);
    const k = 'clsT_' + c;
    clearTimeout(this[k]); this[k] = setTimeout(() => this.el.classList.remove(c), ms);
  },
  /* くるっと 1回転（げい「くるっとターン」・きせかえを 見せる。だんかい 3）：正面 → よこ → 反対の よこ → 正面。からだは 小さく はねる（tr-spin2）。
     1秒。とちゅうで ほかの むき・体勢に なったら やめる */
  spin(){
    this.stopGesture(); this.lean(null); this.rub = null;
    if (this.pose !== 'sit') this.setPose('sit');
    this.cls('tr-spin2', 1000);
    if (calmMotion()) return sleep(1000);
    const tok = ++this.stok, pt = this.ptok, live = () => tok === this.stok && pt === this.ptok;
    this.dir = 'r'; this.setView('side', true);
    return sleep(330).then(() => { if (live()) this.face(true, true); return sleep(330); })
      .then(() => { if (live()) this.setView('front', true); return sleep(340); })
      .then(() => { if (live()){ this.dir = 'r'; this.applyView(); } });
  },
  tilt(){ this.el.classList.remove('tilt'); void this.el.offsetWidth; this.el.classList.add('tilt'); setTimeout(() => this.el.classList.remove('tilt'), 1000); },
  wag(ms = 1500){ this.el.classList.add('wag-fast'); clearTimeout(this.wagT); this.wagT = setTimeout(() => this.el.classList.remove('wag-fast'), ms); },
  zz:null,
  sleep(){
    this.sleeping = true; this.rub = null;
    this.setPose('sleep', true);
    this.setExpr(null);
    clearInterval(this.zz);
    this.zz = setInterval(() => { const h = this.headPoint(); fx('z', h.x + 20, h.y - 10, 'z'); }, 1700);
  },
  wake(stay = 25000){
    this.wakeUntil = now() + stay;
    if (!this.sleeping) return false;
    this.sleeping = false;
    clearInterval(this.zz);
    this.setPose('sit');
    this.setExpr(null);
    return true;
  },
};

/* ----- idle life ----- */
let idleT = null, lastChat = 0, dragging = false, idleLast = [];
function idleTick(delay){
  clearTimeout(idleT);
  idleT = setTimeout(idleStep, delay != null ? delay : 3200 + Math.random() * 5200);
}
/* ひまな ときの 行動（docs/MOTION_DESIGN.md 4-6・12章。2026-11-26 だんかい 1、2026-11-27 だんかい 2）：重みの 表。w(c) が 0 なら えらばない、さっきの 2つも えらばない。
   g は しぐさ（Pet.canGesture で できる ときだけ）。c：tod（morning・day・evening・night）・full・mood・ate／played（たべた・あそんだ あと 1分）・chat（ひとことを いえる）・
   pose（いまの 体勢）・cat。見た目だけ（Math.random で よい。ルール・セーブに さわらない）。
   うごく 多さは「おちつき」（2026-11-26 オーナー）：あるく（行き先も）・しぐさ は それぞれ 3回に 1回 くらい。体勢が かわるのは 15〜20秒に 1回 くらい。
   行き先：ベッドで ふせる、ごはん皿の 前で すわる、まどの 下で たつ、ラグの まんなかで ごろん（ねこは 多め）、ゆかの においを かぐ */
const SIT_POSES = ['sit','stand'];
const IDLE = [
  { id:'walk',  w:() => 20, run:() => Pet.moveTo(22 + Math.random() * 56, 70 + Math.random() * 18, .7 + Math.random() * .4, Math.random() < .5 ? 'sit' : 'stand') },
  { id:'sit',   w:c => c.pose === 'stand' ? 24 : c.pose === 'sit' ? 0 : POSE[c.pose] && POSE[c.pose].back ? 14 : 30, run:() => Pet.setPose('sit', true) },
  { id:'tilt',  w:c => ['sit','stand','down','bsit','bup'].indexOf(c.pose) >= 0 ? 8 : 0, run:() => Pet.tilt() },
  { id:'hop',   w:c => c.mood > 60 && SIT_POSES.indexOf(c.pose) >= 0 ? 6 : 0, run:() => { Pet.jump(); Pet.flash('happy', 1000); Pet.wag(1200); } },
  { id:'chat',  w:c => c.chat ? 14 : 0, run:() => { lastChat = now(); Pet.say(ambientLine()); } },
  /* おなかが すいたら ごはん皿の 前へ 行って すわって まわりを 見る */
  { id:'bowl',  w:c => c.full < 25 && Math.hypot(Pet.x - BOWL.x - 12, Pet.y - BOWL.y + 4) > 6 ? 14 : 0,
    run:async () => { await Pet.moveTo(BOWL.x + 12, BOWL.y - 4, .8, 'sit'); if (!Pet.busy) await Pet.gesture('look'); } },
  /* ベッドで ふせる（夕方・夜・おなか いっぱいは 多め） */
  { id:'bed',   w:c => c.pose === 'down' ? 0 : (c.tod === 'evening' || c.tod === 'night' || c.full > 85) ? 8 : 4,
    run:() => Pet.moveTo(BED.x, BED.y - 1, .8, 'down') },
  /* その場で ふせる・おねだり（すわっている とき） */
  { id:'lie',   w:c => c.pose === 'sit' ? 3 : 0, run:() => Pet.setPose('down', true) },
  { id:'beg',   w:c => c.pose === 'sit' ? 3 : 0, run:() => Pet.poseFor('beg', 2400) },
  /* まどの 下で 外を 見る（だんかい 4）：うしろを むいて すわり、見あげて 耳ぴく・きょろきょろ。ときどき ふりかえって「なあに？」 */
  { id:'win',   w:c => c.tod === 'night' ? 2 : 5, run:async () => {
      const at = p => !Pet.busy && !Pet.sleeping && Pet.pose === p;
      await Pet.moveTo(WIN.x, WIN.y, .8, 'bsit');
      if (!at('bsit')) return; await sleep(600);
      if (!at('bsit')) return; Pet.setPose('bup');
      await sleep(500); if (!at('bup')) return; await Pet.gesture('ear');
      await sleep(400); if (!at('bup')) return; await Pet.gesture('look');
      if (at('bup') && Math.random() < .5) await lookBack('なあに？');
    } },
  /* ラグの まんなかで ごろん（おなかを 見せる） */
  { id:'rug',   w:c => c.pose === 'side' ? 0 : c.cat ? 5 : 2, run:() => Pet.moveTo(50, 84, .8, 'side') },
  /* ゆかの においを かぐ（よこむきで 鼻を 床へ） */
  { id:'sniffwalk', w:() => 5, run:async () => { await Pet.moveTo(28 + Math.random() * 44, 74 + Math.random() * 14, .7, 'stand'); if (!Pet.busy) await Pet.gesture('sniff'); } },
  { g:'sniff',   w:() => 8 },
  { g:'stretch', w:() => 5 },
  { g:'ear',     w:() => 8 },
  { g:'look',    w:() => 7 },
  { g:'yawn',    w:c => c.tod === 'morning' || c.tod === 'night' ? 10 : 3 },
  { g:'scratch', w:() => 5 },
  { g:'shake',   w:() => 4 },
  { g:'groom',   w:() => 9 },
  { g:'sway',    w:() => 7 },
  { g:'tailup',  w:c => c.mood > 50 ? 4 : 2 },
  { g:'pant',    w:c => c.played ? 30 : 0 },
  { g:'lick',    w:c => c.ate ? 30 : 0 },
  /* 季節（だんかい 3。もようがえの 季節の かざりつけが「あり」の とき）：雪・花びらの 日は 上を 見あげて ぴょん（つかまえる）、
     つゆの 雨の 日は まどの 下で ふせて 外を 気に する */
  /* だんかい 4：雪・花びら・おちば（もみじがり）は まどの 下へ 行って うしろを むいて 見あげて ぴょん、雨は うしろを むいて ふせて ながめる（雪・雨は まどの 中に ふる） */
  { id:'catch', w:c => (c.weather === 'snow' || c.weather === 'petals' || c.weather === 'leaves') && !calmMotion() ? 8 : 0,
    run:async () => {
      const at = p => !Pet.busy && !Pet.sleeping && Pet.pose === p;
      await Pet.moveTo(WIN.x, WIN.y, .9, 'bsit');
      if (!at('bsit')) return; await sleep(400);
      if (!at('bsit')) return; Pet.setPose('bup'); await sleep(900);
      if (!at('bup')) return;
      Pet.jump(); Pet.wag(1600);
      if (now() - lastChat > 30000){ lastChat = now(); const w = weatherOf(); Pet.say(w === 'petals' ? 'はなびらだ！' : w === 'leaves' ? 'はっぱだ！' : 'ゆきだ！', 1600); }
      await sleep(700); if (at('bup')) Pet.jump();
    } },
  { id:'rainwin', w:c => c.weather === 'rain' && c.pose !== 'bdown' ? 7 : 0,
    run:async () => {
      const at = () => !Pet.busy && !Pet.sleeping && Pet.pose === 'bdown';
      await Pet.moveTo(WIN.x + 2, WIN.y + 2, .8, 'bdown');
      if (at()) await Pet.gesture('ear');
      if (at()) await Pet.gesture('look');
      if (at() && now() - lastChat > 30000){ lastChat = now(); Pet.say('あめ、やまないね', 1800); }
    } },
];
/* あるいて どこかへ 行く 行動。うごきを へらす 設定では 重みを 1/4 に（しぐさが とまる ぶん あるくのが 目立ち、
   transition も ほぼ 0秒なので ぱっと うつる。診断 C5-2） */
const IDLE_WALKS = ['walk','bowl','bed','win','rug','sniffwalk','rainwin'];
function idlePick(){
  const t = now();
  const c = { tod:stage.dataset.tod, full:S.stats.full, mood:S.stats.mood, chat:t - lastChat > 30000, ate:t - Pet.ateAt < 60000, played:t - Pet.playedAt < 60000,
              pose:Pet.pose, cat:S.pet.species === 'cat', weather:S.room && S.room.season ? weatherOf() : null };
  const list = IDLE.filter(a => idleLast.indexOf(a.g || a.id) < 0 && (!a.g || Pet.canGesture(a.g)));
  const calm = calmMotion();
  const ws = list.map(a => Math.max(0, a.w(c) || 0) * (calm && IDLE_WALKS.indexOf(a.id) >= 0 ? .25 : 1));
  let r = Math.random() * ws.reduce((x, y) => x + y, 0);
  for (let i = 0; i < list.length; i++){ if (ws[i] > 0 && (r -= ws[i]) < 0) return list[i]; }
  return null;
}
async function idleStep(){
  if (!S || Pet.busy || dragging || document.hidden || Pet.rub) return idleTick();
  /* パズル・ランの ページの うしろでは なにも しない（見えない。電池の ため） */
  if (PuzzleUI.page || document.documentElement.classList.contains('run-open')) return idleTick();
  const night = stage.dataset.tod === 'night';
  if (Pet.sleeping){
    if (!night && Math.random() < .35){ Pet.wake(); Pet.say(pick(['ふぁ〜あ','よくねた〜'])); }
    else if (Math.random() < .3) Pet.gesture(S.pet.species === 'cat' && Math.random() < .5 ? 'sway' : 'ear');   /* ねたまま 耳ぴく・しっぽ ゆらり */
    return idleTick();
  }
  if (now() > Pet.wakeUntil && (night ? Math.random() < .55 : Math.random() < .05)){
    /* ベッドへ 行って ふせて から ねる（あごを 前あしに のせる） */
    await Pet.moveTo(BED.x, BED.y - 1, .8, 'down');
    if (!Pet.busy && Pet.pose === 'down') await sleep(900);
    if (!Pet.busy && Pet.pose === 'down') Pet.sleep();
    return idleTick(night ? 20000 : 14000 + Math.random() * 10000);
  }
  const a = idlePick();
  if (a){
    idleLast = [a.g || a.id].concat(idleLast).slice(0, 2);
    await (a.g ? Pet.gesture(a.g) : a.run());
  }
  idleTick();
}
function ambientLine(){
  const s = S.stats, cat = S.pet.species === 'cat', t = stage.dataset.tod;
  if (s.full < 25) return pick(['おなかすいたな…','ごはん、まだかな','ぐぅ〜']);
  if (s.mood < 30) return pick(['かまってほしいな','なでてほしいな…','あそぼ？']);
  const h = Features.hint(); if (h) return h;
  if (t === 'morning') return pick(['おはよう！','いい朝だね', cat ? 'にゃ〜ん' : 'わん！']);
  if (t === 'night') return pick(['ねむねむ…','そろそろ寝よっか','おやすみの時間？']);
  if (t === 'evening') return pick(['ゆうやけ、きれいだね','おかえり！','おつかれさま']);
  return pick(cat ? ['にゃ〜','ゴロゴロ…','ひなたぼっこしたいな','♪'] : ['わん！','しっぽぶんぶん','おさんぽ行きたいな','♪']);
}

/* ----- stats ui ----- */
function renderStats(){
  if (!S) return;
  const s = S.stats;
  const full = Math.round(s.full), mood = Math.round(s.mood);
  $('#bFull').style.width = full + '%';
  $('#bMood').style.width = mood + '%';
  $('#sFull').textContent = full >= 80 ? 'まんぷく' : full >= 45 ? 'ちょうどいい' : full >= 20 ? 'こばら' : 'ぺこぺこ';
  $('#sMood').textContent = mood >= 80 ? 'るんるん' : mood >= 50 ? 'ごきげん' : mood >= 25 ? 'まあまあ' : 'さみしい';
  $('#mFull').classList.toggle('low', full < 20);
  $('#mMood').classList.toggle('low', mood < 25);
  const L = levelInfo(s.love);
  $('#lvNum').textContent = 'Lv' + L.lv;
  $('#bLove').style.width = Math.round(L.into / L.need * 100) + '%';
  $('#sLove').textContent = L.max ? 'なかよしMAX' : 'つぎのLvまで あと' + Math.ceil(L.need - L.into);
  if (!Pet.busy) Pet.setExpr(Pet.expr);
}
function renderHeader(){
  $('#petName').textContent = S.pet.name;

function lockDock(on){ document.querySelectorAll('.act').forEach(b => b.setAttribute('aria-disabled', on ? 'true' : 'false')); }

/* ----- care actions -----
   Each action asks the rules (Act.run) as soon as it starts: here on this device, or on the LINE server.
   The pet's movements play meanwhile; what happened (level up, requests, …) is shown when the movement ends. */
function commit(){ Persist.schedule(); renderStats(); }
const Act = {
  remote:null,   /* js_line.js: (type, params) => Promise<result>, while this child lives on the LINE server */
  gate:null,     /* js_line.js: settles once it is known whether the LINE server is used */
  lock:null,     /* js_line.js: () => a reason, while this child can only change through the server and it is not reached */
  onWait:null,   /* js_line.js: shows that reason */
  budget:{ left:STROKE_MAX, t:now() },   /* なでなで on this device (the LINE server keeps its own) */
  opening:null,
  blocked(){ return this.lock ? this.lock() : null; },
  /* true (and a notice) when nothing can change right now */
  waiting(quiet){
    const why = this.blocked();
    if (!why) return false;
    if (this.onWait) this.onWait(why, quiet);
    return true;
  },
  run(type, p, ctx){
    if (this.remote) return this.remote(type, p || {});
    return Promise.resolve(Rules.act(S, type, p, Object.assign({ budget:this.budget }, ctx)));
  },
  /* opening or coming back: milestones, the season's event, a souvenir, the streak notices */
  open(away){
    if (this.opening) return this.opening;
    const job = (async () => {
      await null;                       /* js_line.js comes later in the same script and may set the gate */
      if (this.gate) await this.gate;
      if (!S || this.blocked()) return;
      const r = await this.run('open', {}, { away });
      if (!r || !r.ok) return;
      playEvents(r.ev);
      commit();
    })();
    this.opening = job.finally(() => { this.opening = null; });
    return this.opening;
  },
};
/* the pet says why an action could not happen */
function careRefused(r){
  const cat = S && S.pet.species === 'cat';
  switch (r && r.why){
    case 'offline': Act.waiting(); break;
    case 'limit': toast('おやつは 少し 時間を あけてね'); break;
    case 'full': Pet.wake(); Pet.tilt(); Pet.say(cat ? 'おなかいっぱいにゃ…' : 'おなかいっぱい！'); break;
    case 'hungry': Pet.wake(); Pet.flash('sad', 2000); Pet.say('おなかがすいて できないよ…'); break;
    case 'locked': toast('まだ えらべないよ'); break;
    /* LINE版：前の おせわから 2.5秒 たたないうちに サーバーへ 届いた（動きだけ出て なにも ふえない。診断 3-9） */
    case 'busy': toast('いまのは かぞえられなかったよ。\nすこし まってね'); break;
  }
}
/* what the rules said happened, as popups and words (the same order and timing as always) */
function playEvents(ev){
  for (const e of ev || []){
    switch (e.k){
      case 'lv': setTimeout(() => celebrate(e.lv, e.before), 900); break;
      case 'req':
        toast('おねがいを かなえた！ ♥+4');
        setTimeout(() => { if (!Pet.sleeping){ Pet.say('ありがとう！ うれしい！'); Pet.wag(1500); } hearts(3); }, 300);
        break;
      case 'all': allDoneModal(e); break;
      case 'rescue':
        if (e.bridged) rescueModal();
        else {
          toast('おたすけのおねがいを かなえた！ ♥+5');
          setTimeout(() => { if (!Pet.sleeping) Pet.say('あとは きょうのおねがいを ぜんぶ かなえよう！', 2600); }, 300);
        }
        break;
      case 'days': toast(`${S.pet.name}が うちにきて ${e.n}日！`); break;
      case 'anniv': annivModal(e); break;
      case 'event': eventModal(e); break;
      case 'souv': souvenirModal(e); break;
      case 'broke': brokeModal(e); break;
      case 'pinch': pinchModal(e); break;
    }
  }
  renderReqBadge();
}
function begin(){
  if (!S || Pet.busy) return false;

}
function finish(){
  Pet.busy = false; lockDock(false);

async function play(){
  if (Pet.busy || !S || Act.waiting()) return;

  if (S.stats.full < 12){ Pet.wake(); Pet.flash('sad', 2200); Pet.say('おなかがすいて動けない…'); return; }

    await sleep(420);
  }

/* ----- stroking & tapping ----- */
let drag = null, strokeT = null, strokeN = 0;
function onStroke(e){
  if (!S) return;
  const p = stageXY(e.clientX, e.clientY);
  heartAt(p.x, p.y - 10);
  $('#hint').hidden = true;
  if (Act.waiting(true)) return;   /* hearts only: nothing changes until the LINE server is reached */
  if (Act.remote){
    /* the gauge moves now; the server counts the strokes when the hand stops */
    decay();
    S.stats.mood = clamp(S.stats.mood + 1.5, 0, 100);
    strokeN++;
  } else {
    decay();
    playEvents(Rules.act(S, 'pet', { n:1, end:false }, { budget:Act.budget }).ev);
  }
  if (!Pet.sleeping && !Pet.busy){ Pet.setExpr('happy'); Pet.wag(1600); }
  rubbed();
  renderStats();
  clearTimeout(strokeT);
  strokeT = setTimeout(() => {
    if (!Pet.busy && !Pet.sleeping){
      Pet.setExpr(null);
      Pet.say(pick(S.pet.species === 'cat' ? ['ゴロゴロ…','きもちいい〜','もっとなでて'] : ['うれしい！','きもちいい〜','もっとなでて！']));
    }
    if (Act.remote){
      const n = strokeN; strokeN = 0;
      if (n) Act.run('pet', { n }).then(r => { if (r.ok) playEvents(r.ev); else careRefused(r); renderStats(); });
    } else Rules.strokeEnd(S);
    commit();
  }, 700);
}
/* たくさん なでたら（1回の なでなでで 8回）：ねこは ごろん（おなかを 見せる）、いぬは ふせて しっぽ ぶんぶん。なでている あいだは そのまま、
   手を とめて 3秒で すわる。回数は 見た目の ためだけ（セーブしない）。おせわ・タップ・あるく と ねている ときは しない（4-5。2026-11-27 だんかい 2） */
let rubN = 0, rubT = null, rubEndT = null;
function rubbed(){
  if (!S || Pet.busy || Pet.sleeping){ rubN = 0; return; }
  clearTimeout(rubT); rubT = setTimeout(() => { rubN = 0; }, 1500);
  if (!Pet.rub){
    if (++rubN < 8) return;
    rubN = 0;
    Pet.stopGesture(); Pet.lean(null);
    Pet.rub = S.pet.species === 'cat' ? 'side' : 'down';
    Pet.setPose(Pet.rub, true);
  }
  if (Pet.rub === 'down') Pet.wag(3600);
  clearTimeout(rubEndT);
  rubEndT = setTimeout(() => {
    const p = Pet.rub; Pet.rub = null;
    if (p && Pet.pose === p && !Pet.busy && !Pet.sleeping) Pet.setPose('sit', true);
    idleTick(4000);
  }, 3000);
}
/* うしろすがたの とき ふりかえる（だんかい 4）：くるっと 正面で すわって へんじ、すこし して もとの うしろの 体勢へ（とちゅうで ほかの 体勢に なったら もどらない） */
async function lookBack(text){
  const back = Pet.pose;
  Pet.setPose('sit', true);
  const pt = Pet.ptok;
  await sleep(170);
  if (pt !== Pet.ptok || Pet.busy) return;
  Pet.tilt(); Pet.wag(1200); Pet.say(text, 1500);
  await sleep(1700);
  if (pt === Pet.ptok && !Pet.busy && !Pet.sleeping && !Pet.rub) Pet.setPose(back, true);
}
function onTap(){
  if (!S) return;
  if (Pet.sleeping){
    Pet.wake(); Pet.say('ふぁ〜あ…おはよう'); Pet.tilt();
    idleTick(5000);
    return;
  }
  if (Pet.busy) return;
  /* へんじ（4-5。2026-11-26 だんかい 1、2026-11-27 だんかい 2）：はねて かしげる・はねて 耳ぴく・しっぽ ぴんで かしげる・おねだり を まぜる
     （同じ へんじは つづけない）。すわって いなければ まず すわる（くるっ）。おねだりは すわっていた ときだけ */
  Pet.stopGesture(); Pet.rub = null;
  const sat = Pet.pose === 'sit';
  /* うしろを むいて すわる・見あげる・ふせる ときは ふりかえって へんじ、すこし して また 外を 見る（だんかい 4） */
  const backWas = ['bsit','bup','bdown'].indexOf(Pet.pose) >= 0 ? Pet.pose : null;
  if (!sat) Pet.setPose('sit', true);
  const r = pick(TAP_REPLY.filter(x => x !== tapLast && (sat || x !== 'beg')));
  tapLast = r;
  if (r === 'ear'){ Pet.jump(); Pet.gesture('ear'); Pet.wag(1200); }
  else if (r === 'tailup'){ Pet.gesture('tailup'); Pet.tilt(); }
  else if (r === 'beg'){ Pet.poseFor('beg', 1700); Pet.wag(1600); }
  else { Pet.jump(); Pet.tilt(); Pet.wag(1200); }
  Pet.say(pick(S.pet.species === 'cat' ? ['にゃ？','にゃーん','なあに？'] : ['ワン！','わふっ','なあに？']), 1600);
  if (backWas){
    const pt = Pet.ptok;
    setTimeout(() => { if (pt === Pet.ptok && !Pet.busy && !Pet.sleeping && !Pet.rub) Pet.setPose(backWas, true); }, 2200);
  }
  idleTick(4000);
}
const TAP_REPLY = ['hop', 'ear', 'tailup', 'beg'];
let tapLast = '';
Pet.el.addEventListener('pointerdown', e => {
  if (!S) return;
  drag = { x:e.clientX, y:e.clientY, dist:0, acc:0 };
  dragging = true;
  try { Pet.el.setPointerCapture(e.pointerId); } catch(_){}
});
Pet.el.addEventListener('pointermove', e => {
  if (!drag) return;
  const d = Math.hypot(e.clientX - drag.x, e.clientY - drag.y);
  drag.x = e.clientX; drag.y = e.clientY; drag.dist += d; drag.acc += d;
  if (drag.dist >= 12) Pet.lean(e.clientX);   /* なでている あいだ 目と 頭が 指の ほうへ */
  if (drag.acc > 55){ drag.acc = 0; onStroke(e); }
});
let leanT = null;
const endDrag = () => {
  if (!drag) return;
  const tap = drag.dist < 12;
  drag = null; dragging = false;
  clearTimeout(leanT); leanT = setTimeout(() => { if (!drag) Pet.lean(null); }, 500);   /* 手を とめたら もどす */
  if (tap) onTap();
};
/* LINE の 中で うちのこを 下に こすると、はじめの 1回だけ ページごと 引っぱられた（ミニアプリの 最小化）。
   パズルの 盤と 同じに、さわった ところで ブラウザの 動きを とめる（なでる・タップは ポインターの イベントで うけとるので そのまま。P5-1） */
const petStill = e => { if (e.cancelable) e.preventDefault(); };
Pet.el.addEventListener('touchstart', petStill, { passive:false });
Pet.el.addEventListener('touchmove', petStill, { passive:false });
Pet.el.addEventListener('pointerup', endDrag);
Pet.el.addEventListener('pointercancel', () => { drag = null; dragging = false; Pet.lean(null); });
Pet.el.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    const r = Pet.el.getBoundingClientRect();
    onStroke({ clientX:r.left + r.width / 2, clientY:r.top + r.height * .35 });
  }
});

/* ----- level up ----- */
function unlocksBetween(from, to){
  const list = [];
  (TREATS[S.pet.species] || []).forEach(t => { if (t.lv > from && t.lv <= to) list.push('おやつ「' + t.ja + '」'); });
  WEAR.forEach(w => { if (w.lv > from && w.lv <= to) list.push('きせかえ「' + w.ja + '」'); });

/* ----- move code: carry a pet to another place ----- */
const MOVE_PREFIX = 'UCHINOKO2:';
const MOVE_MAX = 2e6; /* a real code is well under 1MB (the photo is capped at 400k) */
function encodeMoveCode(){
  const bytes = new TextEncoder().encode(JSON.stringify(S));
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  const b64 = btoa(bin);
  return MOVE_PREFIX + b64.length + ':' + b64;
}
/* returns { st } on success, or { reason:'empty'|'noprefix'|'short'|'broken', got, need } */
function readMoveCode(text){
  const raw = String(text || '');
  if (raw.length > MOVE_MAX) return { reason:'big', got:raw.length };
  const t = raw.replace(/[\s​-‍﻿]+/g, '');
  if (!t) return { reason:'empty', got:0 };
  const m = t.match(/UCHINOKO([12]):(?:(\d+):)?([A-Za-z0-9+/=]*)/);
  if (!m) return { reason:'noprefix', got:t.length };
  let b64 = m[3];
  const need = m[2] ? Number(m[2]) : 0;
  if (need && b64.length < need) return { reason:'short', got:b64.length, need };
  if (need) b64 = b64.slice(0, need);
  const st = decodeMovePayload(b64);
  return st ? { st } : { reason:'broken', got:b64.length, need };
}
function decodeMoveCode(text){ return readMoveCode(text).st || null; }
function moveErrorText(r){
  const n = v => Number(v || 0).toLocaleString('ja-JP');
  if (r.reason === 'empty') return 'コードが 空っぽです。コピーした コードを 貼りつけてから 押してね。';
  if (r.reason === 'noprefix') return `「UCHINOKO」で はじまる コードが 見つかりませんでした（貼りつけた 文字数：${n(r.got)}）。コピーが うまく いっていないかも しれません。「ファイルで保存」の 方法も ためしてみてね。`;
  if (r.reason === 'big') return `コードが 大きすぎて 読めませんでした（${n(r.got)}文字）。うちのこ日和の 引っこしコードか、たしかめてね。`;
  if (r.reason === 'short') return `コードが 途中で 切れています（${n(r.need)}文字のうち ${n(r.got)}文字）。もう一度 まるごと コピーするか、「ファイルで保存」の 方法を ためしてみてね。`;
  return `コードを 読みとれませんでした（${n(r.got)}文字）。もう一度 コピーし直してみてね。`;
}
function decodeMovePayload(b64){
  try {
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
    const o = JSON.parse(new TextDecoder().decode(bytes));
    if (!o || typeof o !== 'object' || !o.pet || !o.stats) return null;
    const num = (v, d, lo, hi) => { v = Number(v); return Number.isFinite(v) ? clamp(v, lo, hi) : d; };
    const p = o.pet, look = normalizeLook(p.look || p);
    const photo = safePhoto(p.photo, 400000);
    const wear = wearFrom(p);
    for (const k of ['head','face','neck']){ const v = wear[k]; if (hasId(WEAR_RENAMED, v)) wear[k] = WEAR_RENAMED[v]; else if (!hasId(WEAR_BY_ID, v)) wear[k] = null; }
    const c = o.counts || {};
    const t0 = now();
    const st = {
      v:1,
      pet:{ name:cleanText(p.name || 'うちのこ', 10) || 'うちのこ', species:look.species, breedId:look.breedId, look, photo,
            colorName:typeof p.colorName === 'string' ? cleanText(p.colorName, 14) : '', wear },
      stats:{ full:num(o.stats.full, 70, 0, 100), mood:num(o.stats.mood, 70, 0, 100), love:num(o.stats.love, 0, 0, 1e7) },
      counts:{ meals:num(c.meals, 0, 0, 1e9), treats:num(c.treats, 0, 0, 1e9), pets:num(c.pets, 0, 0, 1e9), plays:num(c.plays, 0, 0, 1e9) },
      recentTreats:[], last:t0, created:num(o.created, t0, 0, t0), updated:t0,
    };
    return carryExtras(o, st);
  } catch(e){ return null; }
}
const MOVE_FILE = 'uchinoko-hikkoshi.txt';
/* copy: async clipboard, then the older copy command, then leave the text selected */
async function copyText(el){
  try { if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(el.value); return 'copied'; } } catch(e){}
  try {
    el.removeAttribute('readonly'); el.focus(); el.setSelectionRange(0, el.value.length);
    if (document.execCommand && document.execCommand('copy')) return 'copied';
  } catch(e){}
  try { el.focus(); el.setSelectionRange(0, el.value.length); } catch(e){}
  return 'selected';
}
/* save the code as a small text file: Claude's download prompt, the share sheet, or a plain download */
async function saveMoveFile(code){
  if (!HOME){
    const dl = await useCap('downloads');
    if (!dl) return 'unavailable';
    try { await dl.save({ filename:MOVE_FILE, data:code }); return 'saved'; }
    catch(e){ return e && e.code === 'declined' ? 'declined' : 'unavailable'; }
  }
  try {
    const file = new File([code], MOVE_FILE, { type:'text/plain' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:'うちのこ日和 引っこしコード' }); return 'saved'; }
  } catch(e){ if (e && e.name === 'AbortError') return 'declined'; }
  try {
    const url = URL.createObjectURL(new Blob([code], { type:'text/plain' }));
    const a = document.createElement('a'); a.href = url; a.download = MOVE_FILE; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return 'saved';
  } catch(e){ return 'unavailable'; }
}
function readTextFile(file){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result || '')); r.onerror = rej; r.readAsText(file); });
}
const CODE_ATTRS = 'autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"';

        : r === 'declined' ? '保存を とりやめました。' : 'ここでは ファイルの 保存が できませんでした。コードの コピーを ためしてね。';

          if (away > 30 * 60e3 && !Pet.busy){ Pet.wake(); Pet.jump(); Pet.say('おかえり！'); }
          Features.resume(away);
          idleTick();
        } else if (document.hidden && S){
          decay(); Persist.saveLocal(); Persist.flush();
        }
      });
    }
    Features.start(away || 0);
    this.drawn = this.keys();
    if (S.counts.pets === 0) $('#hint').hidden = false;
    if (greet){ setTimeout(() => { Pet.jump(); Pet.wag(2000); Pet.say(greet); }, 500); }
    idleTick(2500);
  },
  onStateReplaced(){
    if (Onboard.busy) return;
    this.start('ただいま！');
  },
  /* the same child, newer numbers (a reply from the LINE server): redraw only what changed */
  keys(){
    return { hk:JSON.stringify([S.pet.name, S.pet.colorName, S.pet.breedId, S.pet.species, S.pet.photo]),
             wk:JSON.stringify([S.pet.look, petWear()]), rk:JSON.stringify(S.room) };
  },
  refresh(){
    if (!S || Onboard.busy || !this.started) return;
    ensureState(S);
    const k = this.keys(), o = this.drawn || {};
    if (k.hk !== o.hk){ renderHeader(); setPlayIcon(); }
    if (k.wk !== o.wk) Pet.mount();
    if (k.rk !== o.rk) applyRoom();
    this.drawn = k;
    renderStats();
    renderReqBadge();
  },
};

const fmtMD = t => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate(); };
const findDecor = (cat, id) => DECOR[cat].find(d => d.id === id) || DECOR[cat][0];

const isCat = () => S && S.pet.species === 'cat';

/* 名前などの みじかい文字：文字（コードポイント）で max まで。制御文字と、かたわれの絵文字（サロゲートの片方）は取りのぞく。
   slice(0, n) だと 絵文字の まんなかで切れて かたわれが のこり、サーバーの DB（jsonb）が ことわるため（\u0000 も ことわる）。
   正規表現の うしろ読みは 古い iPhone で 動かないので、1文字ずつ見る */
function cleanText(v, max){
  const out = [];
  for (const ch of String(v == null ? '' : v)){
    const c = ch.codePointAt(0);
    if (c < 0x20 || (c >= 0x7f && c < 0xa0) || c === 0x2028 || c === 0x2029 || (c >= 0xd800 && c <= 0xdfff)) continue;
    if (out.push(ch) >= max) break;
  }
  return out.join('');
}

/* ===== state upgrade (old saves gain the new fields) ===== */
function ensureState(st){
  if (!st) return st;
  const obj = v => v && typeof v === 'object' && !Array.isArray(v);
  /* numbers and text that reach the screen are coerced here, whatever the source (this browser, the cloud copy, a move code) */
  const num = (v, d, lo, hi) => { v = Number(v); return Number.isFinite(v) ? clamp(v, lo, hi) : d; };
  if (obj(st.pet)){
    const p = st.pet;
    /* 種類（dog・cat）・品種・みため・きせかえも そろえる。端末の セーブが こわれて 種類が 犬・猫で なくなると、
       ルールが 止まって アプリが ひらけなかったため（JSON としては 読めるので ひかえからも もどらない。診断 2-1） */
    const lk = obj(p.look) ? p.look : p;
    const sp = p.species === 'dog' || p.species === 'cat' ? p.species
      : lk.species === 'dog' || lk.species === 'cat' ? lk.species
      : hasId(BREED_BY_ID, p.breedId) ? BREED_BY_ID[p.breedId].sp : 'dog';
    /* みための ほかの値は 絵を かくとき（renderPet）に かならず normalizeLook を 通るので、こわれているときだけ 作りなおす */
    if (!obj(p.look) || p.look.species !== sp) p.look = normalizeLook(Object.assign({}, lk, { species:sp }));
    p.species = sp;
    if (!hasId(BREED_BY_ID, p.breedId)) p.breedId = p.look.breedId;
    const w = wearFrom(p);
    delete p.acc;
    for (const k of ['head','face','neck']){
      const v = hasId(WEAR_RENAMED, w[k]) ? WEAR_RENAMED[w[k]] : w[k];
      w[k] = hasId(WEAR_BY_ID, v) && WEAR_BY_ID[v].slot === k ? v : null;
    }
    p.wear = w;
    p.name = cleanText(typeof p.name === 'string' ? p.name : (p.name || 'うちのこ'), 10) || 'うちのこ';
    p.colorName = typeof p.colorName === 'string' ? cleanText(p.colorName, 14) : '';
    p.photo = safePhoto(p.photo);
  }
  st.stats = obj(st.stats) ? st.stats : {};
  st.stats.full = num(st.stats.full, 70, 0, 100);
  st.stats.mood = num(st.stats.mood, 70, 0, 100);
  st.stats.love = num(st.stats.love, 0, 0, 1e7);
  st.counts = obj(st.counts) ? st.counts : {};
  for (const k of ['meals','treats','pets','plays']) st.counts[k] = num(st.counts[k], 0, 0, 1e9);
  st.recentTreats = Array.isArray(st.recentTreats) ? st.recentTreats.filter(Number.isFinite).slice(-20) : [];
  for (const k of ['last','created','updated']) st[k] = num(st[k], now(), 0, 8.64e15);
  st.room = Object.assign({}, ROOM_DEFAULT, obj(st.room) ? st.room : {});
  for (const [cat] of DECOR_CATS) if (!DECOR[cat].some(d => d.id === st.room[cat])) st.room[cat] = ROOM_DEFAULT[cat];
  st.room.season = st.room.season !== false;
  st.tricks = obj(st.tricks) ? st.tricks : {};
  for (const [k, v] of Object.entries(st.tricks)){
    if (obj(v)){ v.p = num(v.p, 0, 0, 99); v.ok = !!v.ok; } else delete st.tricks[k];
  }
  st.daily = obj(st.daily) && Array.isArray(st.daily.list) ? st.daily : null;
  if (st.daily){
    const req = r => { r.n = num(r.n, 1, 1, 999); r.got = num(r.got, 0, 0, 1e6); r.done = !!r.done; return r; };
    st.daily.list = st.daily.list.filter(obj).map(req);
    if (st.daily.rescue != null) st.daily.rescue = obj(st.daily.rescue) ? req(st.daily.rescue) : null;
  }
  /* one stamp a day: keep about 100 years, so the "ぜんぶ" count never stops growing */
  st.stamps = Array.isArray(st.stamps) ? st.stamps.filter(x => typeof x === 'string').slice(-40000) : [];
  st.streak = obj(st.streak) ? st.streak : { last:null, n:0, best:0 };
  st.streak.n = num(st.streak.n, 0, 0, 1e5);
  st.streak.best = num(st.streak.best, 0, 0, 1e5);
  if (st.streak.saved && !(obj(st.streak.saved) && st.streak.saved.day === dayKey())) delete st.streak.saved;
  if (st.streak.saved) st.streak.saved.n = num(st.streak.saved.n, 0, 0, 1e5);
  st.rescued = Array.isArray(st.rescued) ? st.rescued.filter(x => typeof x === 'string').slice(-6000) : [];
  st.souv = obj(st.souv) ? st.souv : {};
  st.souv.have = obj(st.souv.have) ? st.souv.have : {};
  for (const k of Object.keys(st.souv.have)) st.souv.have[k] = num(st.souv.have[k], 0, 0, 1e6);
  st.souv.n = num(st.souv.n, 0, 0, 99);
  st.events = obj(st.events) ? st.events : {};
  st.events.got = Array.isArray(st.events.got) ? st.events.got.filter(id => hasId(WEAR_BY_ID, id)) : [];
  st.events.seen = obj(st.events.seen) ? st.events.seen : {};
  st.album = Array.isArray(st.album) ? st.album.filter(a => a && Number.isFinite(a.t) && typeof a.ti === 'string').slice(0, 300) : [];
  st.album.forEach(a => { if (a.k === 'trick' || /^芸/.test(a.ti)) a.ti = a.ti.replace(/芸/g, 'げい'); });
  st.milestones = obj(st.milestones) ? st.milestones : {};
  st.trickDay = obj(st.trickDay) ? st.trickDay : { day:null, love:0 };
  st.trickDay.love = num(st.trickDay.love, 0, 0, 10);
  if (!obj(st.firsts) || !st.firsts._init){
    const c = st.counts || {};
    st.firsts = { _init:true, meal:c.meals > 0, treat:c.treats > 0, play:c.plays > 0, pet:c.pets > 0, room:false, wear:{} };
    const w = st.pet && st.pet.wear;
    if (w) for (const k of ['head','face','neck']) if (w[k]) st.firsts.wear[w[k]] = true;
  }
  st.firsts.wear = obj(st.firsts.wear) ? st.firsts.wear : {};
  /* ほんとうに ある 日だけ（2026-13-99 の ような 形だけ あう 日は すてる。きょうと ちがうので 前も 害は なかった＝レビュー R1-2。2026-11-28） */
  const realDayKey = k => isDayKey(k) && keyShift(k, 0) === k;
  /* パズル（2026-11-15）：あそんだ回数（つぎの たね）・クリアの回数・さいこう点・きょうの ほうびの回数 */
  const z = st.puzzle = obj(st.puzzle) ? st.puzzle : {};
  for (const k of ['games','clears']) z[k] = Math.floor(num(z[k], 0, 0, 1e9));
  z.best = Math.floor(num(z.best, 0, 0, PUZZLE.bestMax));
  z.n = Math.floor(num(z.n, 0, 0, PUZZLE.perDay));
  z.day = realDayKey(z.day) ? z.day : null;
  /* うちのこラン（2026-11-22 P3）：ゴールした回数・ノーミスで ゴールした回数・きょうの ほうびの回数と その日・コースごとの さいこう記録（ミリ秒）。
     知らない コースの 記録は すてる。記録は そのコースの いちばん はやい タイム（RUN.courses[c].min）から RUN.maxMs まで */
  const rn = st.run = obj(st.run) ? st.run : {};
  for (const k of ['games','clears']) rn[k] = Math.floor(num(rn[k], 0, 0, 1e9));
  rn.n = Math.floor(num(rn.n, 0, 0, RUN.perDay));
  rn.day = realDayKey(rn.day) ? rn.day : null;
  const rb = obj(rn.best) ? rn.best : {};
  rn.best = {};
  for (const c of Object.keys(RUN.courses)){
    const v = hasId(rb, c) ? Number(rb[c]) : NaN;
    if (Number.isFinite(v) && v > 0) rn.best[c] = Math.round(clamp(v, RUN.courses[c].min, RUN.maxMs));
  }
  return st;
}
/* the subset of a move code that is safe to carry over */
function carryExtras(o, st){
  const src = ensureState(JSON.parse(JSON.stringify({
    room:o.room, tricks:o.tricks, daily:null, stamps:o.stamps, streak:o.streak, souv:o.souv, events:o.events, rescued:o.rescued,
    album:o.album, milestones:o.milestones, firsts:o.firsts, counts:st.counts, pet:st.pet, puzzle:o.puzzle, run:o.run,
  })));
  const tricks = {}, trickIds = new Set(Object.values(TRICKS).flat().map(t => t.id));
  for (const [k, v] of Object.entries(src.tricks)) if (trickIds.has(k) && v && typeof v === 'object') tricks[k] = { p:clamp(Number(v.p) || 0, 0, 99), ok:!!v.ok };
  const firsts = { _init:true, wear:{} };
  for (const k of ['meal','treat','play','pet','room','daily','puzzle','run']) firsts[k] = !!src.firsts[k];
  for (const k of Object.keys(src.firsts.wear)) if (hasId(WEAR_BY_ID, k) || hasId(WEAR_RENAMED, k)) firsts.wear[k] = true;
  const have = {};
  for (const [k, v] of Object.entries(src.souv.have)) if (hasId(SOUV_BY_ID, k)) have[k] = clamp(Number(v) || 0, 0, 1e6);
  st.room = src.room;
  st.tricks = tricks;
  st.stamps = src.stamps.filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x));
  st.rescued = src.rescued.filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x));
  st.streak = { last:/^\d{4}-\d{2}-\d{2}$/.test(src.streak.last) ? src.streak.last : null, n:clamp(Number(src.streak.n) || 0, 0, 1e5), best:clamp(Number(src.streak.best) || 0, 0, 1e5) };
  /* ピンチ（おたすけ まち）の日の まっている れんぞくも 運ぶ（ensureState が きょうの分だけ のこす。診断 3-6） */
  if (src.streak.saved && /^\d{4}-\d{2}-\d{2}$/.test(src.streak.saved.day)) st.streak.saved = { n:src.streak.saved.n, day:src.streak.saved.day };
  st.souv = { have, day:null, n:0 };
  st.events = { got:src.events.got, seen:Object.fromEntries(Object.entries(src.events.seen).filter(([k]) => /^[a-z]+:\d{4}$/.test(k)).map(([k, v]) => [k, Number(v) || 1])) };
  st.album = src.album.map(a => ({ t:a.t, k:cleanText(a.k || '', 20), ti:cleanText(a.ti, 40), su:cleanText(a.su || '', 80), ic:cleanText(a.ic || '', 40) }));
  st.milestones = Object.fromEntries(Object.entries(src.milestones).filter(([k]) => /^[a-z0-9:_-]{1,30}$/.test(k)).map(([k, v]) => [k, !!v]));
  st.firsts = firsts;
  /* パズル：さいこう点・回数と、きょうの ほうびの回数（日が ちがえば ルールが 0から 数えなおす） */
  st.puzzle = { games:src.puzzle.games, clears:src.puzzle.clears, best:src.puzzle.best, n:src.puzzle.n, day:src.puzzle.day };
  /* うちのこラン：回数・コースごとの さいこう記録と、きょうの ほうびの回数（2026-11-22 P3） */
  st.run = { games:src.run.games, clears:src.run.clears, n:src.run.n, day:src.run.day, best:Object.assign({}, src.run.best) };
  return ensureState(st);
}

/* ===== popups, one at a time ===== */
const Modal = {
  q:[], busy:false,
  show(spec){ return new Promise(res => { this.q.push({ spec, res }); this.next(); }); },
  next(){
    if (this.busy || !this.q.length) return;
    const { spec, res } = this.q.shift();
    this.busy = true;
    const back = document.activeElement;
    const box = document.createElement('div');
    box.className = 'levelup';
    box.innerHTML = `<div class="card ${spec.cls || ''}" role="dialog" aria-modal="true" aria-label="${esc(spec.label || 'おしらせ')}">${typeof spec.html === 'function' ? spec.html() : spec.html}</div>`;
    document.body.appendChild(box);
    let done = false;
    const onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); close(null); } };
    const close = val => {
      if (done) return; done = true;
      document.removeEventListener('keydown', onKey, true);
      box.classList.add('closing');
      setTimeout(() => { box.remove(); this.busy = false; res(val); this.next(); }, 200);
      if (back && back.focus) try { back.focus(); } catch(e){}
    };
    box.addEventListener('click', e => { if (e.target === box) close(null); });
    document.addEventListener('keydown', onKey, true);
    box.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => close(b.dataset.close || true)));
    if (spec.ready) spec.ready(box, close);
    if (spec.confetti) confettiIn(box);
    const f = box.querySelector('.btn.primary') || box.querySelector('button');
    if (f) f.focus();
  },
};
function confettiIn(box){
  const cols = ['#F0728E','#F5C562','#6FABE3','#7CC28F','#B8A6EC'];
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  for (let i = 0; i < 30; i++){
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 140;
    const el = document.createElement('div');
    el.className = 'fx spark';
    el.style.left = cx + 'px'; el.style.top = cy + 'px'; el.style.background = cols[i % cols.length];
    el.style.setProperty('--dx', (Math.cos(a) * d).toFixed(0) + 'px');
    el.style.setProperty('--dy', (Math.sin(a) * d).toFixed(0) + 'px');
    box.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }
}

function garland(shape, cols){
  const W = 100, pts = 11;
  let s = `<path d="M0 3Q50 14 100 3" stroke="#B9A79A" stroke-width=".6" fill="none"/>`;
  for (let i = 1; i < pts; i++){
    const x = i * W / pts, t = x / W, y = 3 + 11 * 4 * t * (1 - t) * .5 + 1;
    const c = cols[i % cols.length];
    if (shape === 'flag') s += `<path d="M${(x - 3).toFixed(1)} ${y.toFixed(1)}h6l-3 6z" fill="${c}"/>`;
    else if (shape === 'heart') s += `<path d="M${x.toFixed(1)} ${(y + 6).toFixed(1)}c-4-2.4-4.6-4.6-3.4-5.8.9-.9 2.6-.6 3.4.5.8-1.1 2.5-1.4 3.4-.5 1.2 1.2.6 3.4-3.4 5.8z" fill="${c}"/>`;
    else if (shape === 'star') s += `<path d="M${x.toFixed(1)} ${(y).toFixed(1)}l1.2 2.6 2.8.3-2.1 1.9.6 2.8-2.5-1.4-2.5 1.4.6-2.8-2.1-1.9 2.8-.3z" fill="${c}"/>`;
    else if (shape === 'ball') s += `<circle cx="${x.toFixed(1)}" cy="${(y + 2.5).toFixed(1)}" r="2.4" fill="${c}"/>`;
    else if (shape === 'flower') s += `<circle cx="${x.toFixed(1)}" cy="${(y + 2.5).toFixed(1)}" r="2.6" fill="${c}"/><circle cx="${x.toFixed(1)}" cy="${(y + 2.5).toFixed(1)}" r="1" fill="#F5C04A"/>`;
    /* もみじの はっぱ（もみじがり。2026-11-27） */
    else if (shape === 'leaf') s += `<path transform="translate(${x.toFixed(1)} ${(y + 3).toFixed(1)}) scale(.16)" d="M0-17l3.2 7.4 6.4-3.4-1.8 7.6 7.6.6-5.4 5.2 4.6 4.4-8-.2-.8 8.4L0 7.6-5.8 13-6.6 4.6l-8 .2 4.6-4.4-5.4-5.2 7.6-.6-1.8-7.6 6.4 3.4z" fill="${c}"/>`;
  }
  return `<svg class="garland" viewBox="0 0 100 18" preserveAspectRatio="none" aria-hidden="true">${s}</svg>`;
}

function applyRoom(){
  if (!S) return;
  const R = S.room;
  const W = findDecor('wall', R.wall), F = findDecor('floor', R.floor), G = findDecor('rug', R.rug), B = findDecor('bed', R.bed), V = findDecor('view', R.view);
  $('.wall').style.background = wallBg(W);
  $('.floor').style.background = floorBg(F);
  const rug = $('.rug');
  rug.hidden = !!G.none;
  rug.style.background = rugBg(G);
  stage.style.setProperty('--bed', B.c); stage.style.setProperty('--bedI', B.i); stage.style.setProperty('--bedL', B.l);
  $('#viewArt').innerHTML = viewSvg(V.id);
  stage.dataset.walldark = W.id === 'starry' ? '1' : '';
  renderSeason();
}
function renderSeason(){
  const box = $('#evDeco'), hang = $('#evHang'), weather = $('#weather');
  const ev = S && S.room.season ? activeEvent() : null;
  const sd = ev ? SEASON_DECOR[ev.decor] : null;
  box.innerHTML = sd ? `${sd.g ? `<div class="gl">${garland(sd.g[0], sd.g[1])}</div>` : ''}<div class="evitem">${sd.item}</div>` : '';
  hang.innerHTML = sd && sd.hang ? sd.hang : (ev && ev.decor === 'tsuyu' ? SEASON_DECOR.tsuyu.item : '');
  if (ev && ev.decor === 'tsuyu'){ box.querySelector('.evitem') && box.querySelector('.evitem').remove(); }
  const w = S && S.room.season ? weatherOf() : null;
  weather.className = 'weather' + (w ? ' w-' + w : '');
  stage.dataset.event = ev ? ev.id : '';
}

/* ===== room tab inside きせかえ ===== */
let roomCat = 'wall';
function roomSwatch(cat, d){
  if (cat === 'wall') return `<span class="rsw" style="background:${wallBg(d)}"></span>`;
  if (cat === 'floor') return `<span class="rsw" style="background:${floorBg(d)}"></span>`;
  if (cat === 'rug') return `<span class="rsw rsw-floor"><i class="rsw-rug" style="background:${d.none ? 'transparent' : rugBg(d)};${d.none ? 'box-shadow:inset 0 0 0 2px rgba(0,0,0,.15);' : ''}"></i></span>`;
  if (cat === 'bed') return `<span class="rsw rsw-floor"><svg viewBox="0 0 200 90" class="rsw-bed"><ellipse cx="100" cy="52" rx="95" ry="34" style="fill:${d.c};stroke:${d.l}" stroke-width="5"/><ellipse cx="100" cy="47" rx="70" ry="22" style="fill:${d.i}"/></svg></span>`;
  return `<span class="rsw rsw-win"><svg viewBox="0 0 100 128" preserveAspectRatio="xMidYMax slice">${viewSvg(d.id)}</svg></span>`;
}
function roomTabHtml(){
  const lv = lvNow();
  const chips = DECOR_CATS.map(([k, ja]) => `<button class="chip" type="button" data-rc="${k}" aria-pressed="${k === roomCat}">${ja}</button>`).join('');
  const tiles = DECOR[roomCat].map(d => {
    const locked = lv < d.lv;
    return `<button class="tile rtile" type="button" data-rd="${d.id}" aria-pressed="${S.room[roomCat] === d.id}" ${locked ? 'aria-disabled="true"' : ''}>${roomSwatch(roomCat, d)}<span class="tname">${softName(d.ja)}</span>${locked ? `<span class="lockpill">Lv${d.lv}で解放</span>` : ''}</button>`;
  }).join('');
  const ev = activeEvent();
  return `<div class="chips rchips">${chips}</div><div class="tiles">${tiles}</div>
    <div class="seasonrow"><span>${ev ? `いまは<b>${esc(ev.ja)}</b>。` : ''}季節のかざりつけ</span><div class="seg mini-seg"><button type="button" data-season="1" aria-pressed="${S.room.season}">あり</button><button type="button" data-season="0" aria-pressed="${!S.room.season}">なし</button></div></div>`;
}
function wireRoomTab(root, rerender){
  root.querySelectorAll('[data-rc]').forEach(b => b.addEventListener('click', () => { roomCat = b.dataset.rc; rerender(); }));
  root.querySelectorAll('[data-rd]').forEach(b => b.addEventListener('click', async () => {
    if (b.getAttribute('aria-disabled') === 'true') return;
    const d = findDecor(roomCat, b.dataset.rd);
    if (S.room[roomCat] === d.id || Act.waiting()) return;
    const r = await Act.run('room', { cat:roomCat, id:d.id });
    if (!r.ok){ careRefused(r); return; }
    applyRoom();
    playEvents(r.ev);
    if (!Pet.busy && !Pet.sleeping){ Pet.flash('happy', 1400); Pet.say(pick(['すてき！','いいかんじ！','わくわくする！'])); }
    commit();
    rerender();
  }));
  root.querySelectorAll('[data-season]').forEach(b => b.addEventListener('click', async () => {
    if (Act.waiting()) return;
    const r = await Act.run('season', { on:b.dataset.season === '1' });
    if (!r.ok) return;
    applyRoom(); commit(); rerender();
  }));
}

/* ===== tricks ===== */
const TRICK_MS = { sit:1100, paw:1600, down:1500, spin:1000, bigjump:900, high:1600, roll:1300, bow:1400, dance:1800, bang:2200, stretch:1600, punch:1500 };
/* げいの 前に まんなかで まつ 体勢（だんかい 3。ない げいは すわる）：「おすわり」は たって まって すわる、「のびー」は よこむきで のび */
const TRICK_WAIT = { sit:'stand', stretch:'stand' };
function trickState(id){ return S.tricks[id] || (S.tricks[id] = { p:0, ok:false }); }
function openTricks(){
  if (Pet.busy || !S) return;
  const lv = lvNow(), list = TRICKS[S.pet.species] || TRICKS.dog;
  const learned = list.filter(t => S.tricks[t.id] && S.tricks[t.id].ok).length;
  const tiles = list.map(t => {
    const st = S.tricks[t.id] || { p:0, ok:false }, locked = lv < t.lv;
    const dots = Array.from({ length:t.need }, (_, i) => `<i class="${i < st.p ? 'on' : ''}"></i>`).join('');
    return `<button class="tile trick ${st.ok ? 'learned' : ''}" type="button" data-tk="${t.id}" ${locked ? 'aria-disabled="true"' : ''}>
      <span class="tk-star">${mini('trick', st.ok ? '' : 'dim')}</span><span class="tname">${softName(t.ja)}</span>
      ${locked ? `<span class="lockpill">Lv${t.lv}で解放</span>` : st.ok ? '<span class="okpill">できる！</span>' : `<span class="tk-dots" aria-label="れんしゅう ${st.p}/${t.need}">${dots}</span>`}</button>`;
  }).join('');
  openSheet('げい', `<p class="sheet-sub">おぼえた げい ${learned} / ${list.length}　れんしゅうして、できるように なったら いつでも 見せてくれます。</p><div class="tiles">${tiles}</div><p class="note">ごきげんが いいと、れんしゅうが うまく いきやすいよ。</p>`, sh => {
    sh.querySelectorAll('[data-tk]').forEach(b => b.addEventListener('click', () => {
      if (b.getAttribute('aria-disabled') === 'true') return;
      doTrick(list.find(t => t.id === b.dataset.tk));
    }));
  });
}
async function doTrick(tk){
  closeSheet();
  if (Pet.busy || !S || Act.waiting()) return;
  const why = Rules.trickCheck(S, tk.id);
  if (why){ careRefused({ why }); return; }
  begin();
  const job = Act.run('trick', { id:tk.id });   /* the rules decide whether it works (on the LINE server: the server) */
  await Pet.moveTo(50, 80, 1.2, TRICK_WAIT[tk.anim]);
  Pet.say(tk.cue, 1100);
  await sleep(800);
  const r = await job;
  if (!r.ok){ careRefused(r); await sleep(600); Pet.setExpr(null); if (Pet.pose !== 'sit') Pet.setPose('sit', true); finish(); return; }
  if (r.success){
    const cls = 'tr-' + tk.anim;
    if (tk.anim === 'bang') Pet.setExpr('sleep'); else Pet.setExpr('happy');
    /* だんかい 3：「おすわり」は たって いた ところから くるっと すわる（ぽすん）、「くるっとターン」は よこむきの 絵で ほんとうに まわる、
       「のびー」は よこむきの まま のび（head.html の .view-side.tr-stretch）してから すわる */
    if (tk.anim === 'sit') Pet.setPose('sit', true);
    if (tk.anim === 'spin') Pet.spin(); else Pet.el.classList.add(cls);
    await sleep(TRICK_MS[tk.anim] || 1200);
    Pet.el.classList.remove(cls);
    if (tk.anim === 'down') Pet.leave('down');   /* 前に のばした 前あしを ふわっと けす */
    if (Pet.pose !== 'sit') Pet.setPose('sit', true);
    Pet.setExpr('happy'); Pet.wag(1500); hearts(3);
    playEvents(r.ev);
    if (r.learned){
      Pet.say('できるように なったよ！');
      Modal.show({ label:'げいをおぼえた', confetti:true,
        html:`${petCard('', MPET.joy)}<h3>げい「${esc(tk.ja)}」を<br>おぼえた！</h3><p>これからは いつでも 見せてくれます。<br>♥+5</p><button class="btn primary" type="button" data-close>すごいね！</button>` });
    } else if (!r.known) Pet.say(`できた！（${r.p}/${r.need}）`);
    else Pet.say(pick(['どう？','じょうずでしょ！','えへへ','もっと見る？']));
  } else {
    Pet.tilt(); Pet.say(pick(['？？？','えっと…','むずかしいな…']), 1400);
    await sleep(1200);
    if (Pet.pose !== 'sit') Pet.setPose('sit', true);
    Pet.say('もういっかい やってみる！', 1600);
  }
  playEvents(r.after);
  await sleep(1000);
  Pet.setExpr(null);
  finish();
}

/* ===== album sheet ===== */
let albumTab = 'diary', stampMonth = null;
const SEASON_JA = { spring:'はる', summer:'なつ', autumn:'あき', winter:'ふゆ', all:'いつでも' };
function albumHtml(){
  const tabs = [['diary','にっき'],['souv','おみやげ'],['stamp','スタンプ']].map(([k, ja]) => `<button type="button" data-at="${k}" aria-pressed="${k === albumTab}">${ja}</button>`).join('');
  let body = '';
  if (albumTab === 'diary'){
    body = S.album.length ? `<ol class="diary">${S.album.map(a => `<li><span class="d-date">${fmtMD(a.t)}<small>${new Date(a.t).getFullYear()}</small></span><span class="d-ic">${iconFor(a.ic)}</span><span class="d-txt"><b>${esc(a.ti)}</b>${a.su ? `<small>${esc(a.su)}</small>` : ''}</span></li>`).join('')}</ol>`
      : '<p class="empty">まだ 記録が ありません。いっしょに すごすと、ここに 思い出が たまっていきます。</p>';
  } else if (albumTab === 'souv'){
    const got = SOUVENIRS.filter(s => S.souv.have[s.id]).length;
    body = `<p class="sheet-sub">あつめた おみやげ ${got} / ${SOUVENIRS.length}　しばらく あけてから ひらくと、おみやげを もってきてくれます。</p><div class="tiles svtiles">${SOUVENIRS.slice().sort((a, b) => (S.souv.have[b.id] ? 1 : 0) - (S.souv.have[a.id] ? 1 : 0)).map(s => {
      const n = S.souv.have[s.id];
      return n ? `<div class="tile sv"><svg viewBox="0 0 48 48" aria-hidden="true">${souvenirIcon(s.icon)}</svg><span class="tname">${softName(s.ja)}</span><small>×${n}</small></div>`
        : `<div class="tile sv unknown"><svg viewBox="0 0 48 48" aria-hidden="true">${souvenirIcon(s.icon)}</svg><span class="tname">？？？</span><small>${s.seasons.split(' ').map(x => SEASON_JA[x]).join('・')}</small></div>`;
    }).join('')}</div>`;
  } else {
    const base = stampMonth || clockDate();
    const y = base.getFullYear(), m = base.getMonth();
    const firstDow = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), today = dayKey();
    const set = new Set(S.stamps), saved = new Set(S.rescued);
    let cells = '';
    for (let i = 0; i < firstDow; i++) cells += '<span></span>';
    for (let d = 1; d <= days; d++){
      const k = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const cls = set.has(k) ? 'st' : saved.has(k) ? 'st rs' : '';
      cells += `<span class="${cls} ${k === today ? 'today' : ''}">${set.has(k) ? mini('stamp') : saved.has(k) ? mini('rescue') : ''}<i>${d}</i></span>`;
    }
    const si = streakInfo(), cur = si.n;
    body = `<div class="cal-head"><button class="closebtn" type="button" data-mon="-1" aria-label="前の月">‹</button><b>${y}年${m + 1}月</b><button class="closebtn" type="button" data-mon="1" aria-label="次の月">›</button></div>
      <div class="cal"><b>日</b><b>月</b><b>火</b><b>水</b><b>木</b><b>金</b><b>土</b>${cells}</div>
      <div class="counts cal-stats"><div><b>${cur}</b>れんぞく${si.pinch ? '<span class="pinchpill">ピンチ</span>' : ''}</div><div><b>${S.streak.best || 0}</b>さいこう</div><div><b>${S.stamps.length}</b>ぜんぶ</div><div><b>${S.stamps.filter(k => k.startsWith(`${y}-${String(m + 1).padStart(2, '0')}`)).length}</b>${m + 1}月</div></div>
      <p class="note">きょうの おねがいを ぜんぶ かなえた日に、スタンプが つきます。1日だけ おやすみした日は、つぎの日に おたすけの おねがいを かなえると <span class="rs-legend">${mini('rescue')}</span>おたすけスタンプで つながります（${RESCUE_EVERY}日に 1回まで。2日いじょう あくと つなげません）。${!rescueReady() ? `つぎに おたすけが つかえるのは <b>${mdOfKey(nextRescueDay())}</b>から。` : ''}</p>`;
  }
  return `<div class="seg" role="tablist">${tabs}</div>${body}`;
}
function openAlbum(tab){
  if (!S) return;

  stampMonth = null;

/* ===== よるの ひとこと（通知の「画面の中の お知らせ」。3つの版。2026-11-14 オーナー決定 案A） =====
   NUDGE_HOUR（21時）から 0時までに ひらいているとき・ひらいたとき・もどってきたとき、きょうの おねがいが のこっていたら、
   うちのこが ふきだしで「もうすぐ きょうが おわるよ」→「おねがい、あと◯つ！」（ピンチの日は「れんぞく ◯日が ピンチ！」も）と言い、
   おねがいの バッジが はねる。1日1回（見せた日は 端末の NUDGE_KEY。書けない端末では ひらいている あいだ 1回）。
   ポップアップ・シート・はじめての画面・おせわの とちゅうは まつ。時刻は ルールの時計（LINE版で つながっているときは サーバーの 日本時間）。
   セーブ（S）は かえない。
   LINE版で サーバーを まつ あいだは、知らせを 出さない Act.blocked() で 見る（Act.waiting() は ポップアップや トーストも 出す。
   よるに つながれないと「サーバーに つながっていません」が かってに くりかえし 出ていた。さいごのチェック F3-1）。
   つないでいる とちゅうは 4秒ごと、つながれない（offline・LINEの外）あいだは 30秒ごとの 時計に まかせる */
const NUDGE_HOUR = 21;
const NUDGE_KEY = 'uchinoko-biyori:nudge-day';
const Nudge = {
  shown:'', t:null,
  hour(){ return typeof Clock.hour === 'function' ? Clock.hour() : new Date(now()).getHours(); },
  later(ms = 3500){ clearTimeout(this.t); this.t = setTimeout(() => this.check(), ms); },
  busy(){
    const ob = document.getElementById('onboard');
    return Pet.busy || dragging || Onboard.busy || Modal.busy || Modal.q.length > 0 || (ob && !ob.hidden)
      || $('#sheetWrap').classList.contains('open') || !!PuzzleUI.page;
  },
  check(){
    clearTimeout(this.t);
    if (!S || !Game.started || document.hidden || this.hour() < NUDGE_HOUR) return;
    const day = dayKey();
    if (this.shown === day) return;
    let seen = '';
    try { seen = localStorage.getItem(NUDGE_KEY) || ''; } catch(e){}
    if (seen === day){ this.shown = day; return; }
    const why = Act.blocked();
    if (why){ if (why === 'connecting') this.later(4000); return; }
    if (this.busy()){ this.later(4000); return; }
    const n = reqLeft();
    if (!n) return;
    this.shown = day;
    try { localStorage.setItem(NUDGE_KEY, day); } catch(e){}
    const si = streakInfo();
    const lines = ['もうすぐ きょうが おわるよ', `おねがい、あと${n}つ！`];
    if (si.pinch && si.n > 0) lines.push(`れんぞく ${si.n}日が ピンチ！`);
    Pet.wake(); Pet.setExpr(null);
    lastChat = now();   /* ふだんの ひとりごとで うわがき しない */
    lines.forEach((l, i) => setTimeout(() => { if (!Modal.busy && !Pet.busy){ Pet.say(l, 3000); lastChat = now(); } }, 400 + i * 3100));
    const b = $('#reqBadge');
    if (b){ b.classList.remove('nudge'); void b.offsetWidth; b.classList.add('nudge'); setTimeout(() => b.classList.remove('nudge'), 3600); }
  },
};

/* ===== パズル「おやつならべ」の画面（2026-11-15。ルールと 盤は js_rules.js の Puzzle） =====
   「あそぶ」の シートで えらぶと、ページごと パズルの 画面に うつる（2026-11-16 に 作りなおした。前は シートの中）。
   - 上の まんなかに うちのこ（応援の ふきだし）、その下に のこりの手・けした数・点数、下に 盤。あそびかたは「？」と えらぶ シートに。
   - 盤の 大きさは 画面の 高さから 決めて（fit）、スクロールなしで ぜんぶ 見える。画面は うごかさない（LINE は ページを 下に
     引っぱると ミニアプリを 小さくする ので、touchmove を とめる）。おわりの 知らせは 盤の 上に かさねる（高さが かわらない）。
   - おわったら たね（seed）と 手順（moves）だけを Act.run('puzzle') に わたし、クリアしたか・点数・ほうびは ルール（LINE版は サーバー）が
     再生して 決める。LINE に ほぞんしている子は、サーバーに つながっていない あいだは きろく しない（端末だけで 数えない）。
     とちゅうで やめたら なにも おくらない */
/* ページごと うつる 画面（パズル・ラン）の うしろの #app を さわれなく する。inert を しらない 古い Safari（iOS 15.4 より 前）では、
   キーボードの フォーカスが #app に 入ったら ページの さいしょの ボタンへ もどす（診断 C2-4。2026-11-28） */
function appInert(on, page){
  const app = $('#app');
  if (!app) return;
  if (on){ app.setAttribute('aria-hidden', 'true'); app.inert = true; }
  else { app.removeAttribute('aria-hidden'); app.inert = false; }
  if ('inert' in HTMLElement.prototype) return;
  document.removeEventListener('focusin', appInert.trap, true);
  appInert.page = on ? page : null;
  if (on) document.addEventListener('focusin', appInert.trap, true);
}
appInert.page = null;
appInert.trap = e => {
  const app = $('#app'), pg = appInert.page;
  if (!pg || !pg.isConnected || !app || !app.contains(e.target)) return;
  const f = pg.querySelector('button:not([disabled]),[href],[tabindex]:not([tabindex="-1"])') || pg;
  try { f.focus({ preventScroll:true }); } catch(err){ if (e.target.blur) e.target.blur(); }
};
const PZ_TREATS = { dog:['bolo','apple','blueberry','milkgum','jerky'], cat:['kibble','paste','niboshi','maguro','catmilk'] };

const PuzzleUI = {

  idleT:null, idleN:0, hurrayT:null,
  kinds(){ const sp = isCat() ? 'cat' : 'dog'; return PZ_TREATS[sp].map(id => TREATS[sp].find(t => t.id === id)); },
  q(sel){ return this.page ? this.page.querySelector(sel) : null; },
  open(){
    if (!S || Pet.busy || this.page || Act.waiting()) return;
    closeSheet();
    this.back = document.activeElement;
    const page = document.createElement('div');
    page.className = 'pz-page'; page.id = 'pzPage'; page.tabIndex = -1;

          <button class="closebtn pz-q" type="button" id="pzHelp" aria-label="あそびかた">？</button>
        </div>
        <div class="pz-hero">
          <div class="pz-wall" aria-hidden="true"></div><div class="pz-floor" aria-hidden="true"></div>
          <p class="pz-say" id="pzSay" role="status"></p>
          <div class="pz-pet" id="pzPet"><div class="pet-floor" aria-hidden="true"><i></i></div><div class="pz-art" id="pzArt">${renderPet(S.pet.look, { wear:petWear() })}</div></div>

          <div class="pz-n"><small>てんすう</small><span><b id="pzScore">0</b>点</span></div>
        </div>
        <div class="pz-wrap">
          <div class="pz-board" id="pzBoard" role="group" aria-label="おやつの ばん"></div>
          <div class="pz-end" id="pzEnd" hidden></div>
        </div>
      </div>`;
    /* うしろの かべと ゆかは、いまの おへやの もようがえ と 同じ */
    if (wall) page.querySelector('.pz-wall').style.background = wall.style.background;
    if (floor) page.querySelector('.pz-floor').style.background = floor.style.background;
    document.body.appendChild(page);
    this.page = page; this.box = page.querySelector('#pzBoard');
    document.documentElement.classList.add('pz-open');
    appInert(true, page);
    this.bind();
    this.fit();
    this.start();
    this.refocus(page);
  },
  /* 盤の 一辺を 画面の 高さと はばから 決める（うちのこの ところは のこり ぜんぶ。入りきらない ほど ひくい 画面だけ スクロール） */
  fit(){
    const p = this.page;
    if (!p) return;
    p.style.height = '';
    const vv = window.visualViewport;
    /* 見えている 高さ（visualViewport）が ページより ひくい ときは そちらに あわせる（ひろげて 見ている〈scale が 1 で ない〉ときは さわらない） */
    if (vv && Math.abs((vv.scale || 1) - 1) < .01 && vv.height > 200 && vv.height < p.clientHeight - 1) p.style.height = Math.floor(vv.height) + 'px';
    const cs = getComputedStyle(p), col = p.firstElementChild;
    const H = p.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom), W = col.clientWidth;
    const gap = parseFloat(getComputedStyle(col).rowGap) || 0;
    const rest = this.q('.pz-bar').offsetHeight + this.q('.pz-nums').offsetHeight + gap * 3;
    const heroMin = 92;
    const side = Math.floor(Math.min(W, 440, H - rest - heroMin));
    const tight = side < PZ_MIN;
    p.classList.toggle('tight', tight);

    /* うちのこの 大きさ（--pz-pet）。うちのこの ところが ひくい ときは、ふきだしを うちのこの 右に */

    hero.classList.toggle('low', low);
    hero.style.setProperty('--pz-pet', Math.round(low ? hh * .9 : Math.min(hh - 66, 200)) + 'px');
  },
  start(){

    this.moves = []; this.sel = -1; this.busy = false; this.cleared = false; this.shown = null; this.tok++;

    this.say(!S.firsts.puzzle ? 'となりと 入れかえて、3つ そろえてね' : isCat() ? 'いっしょに がんばるにゃ！' : 'いっしょに がんばろ！');

  tile(i, k, fromRow){

  place(el, i, row){

    el.style.top = (row == null ? Math.floor(i / W) : row) * 100 / W + '%';
  },
  say(text){ const b = this.q('#pzSay'); if (b) b.textContent = text; },
  /* うちのこが はねる（joy は 3回）。体ごと うごかすのは 絵の 外がわの わく（#pzArt）に つける */
  cheer(kind){
    const p = this.q('#pzPet');
    if (!p) return;

    if (kind !== 'joy') this.cheerT = setTimeout(() => { const x = this.q('#pzPet'); if (x) x.classList.remove('ex-happy', 'wag-fast'); }, 1400);
  },
  /* うちのこの 体勢（だんかい 3。head.html の pose-cheer・pose-lean）：sit・cheer（ばんざい）・lean（前のめり）。ばんざい から かわる ときは
     前あしを ふわっと けす（leave-cheer） */
  pose(p){
    const el = this.q('#pzPet');
    if (!el) return;
    const was = el.classList.contains('pose-cheer');
    el.classList.toggle('pose-cheer', p === 'cheer');

    if (was && p !== 'cheer') this.flash('leave-cheer', 360);
  },
  /* ふだんの 体勢：のこり 3手から 前のめり（盤を じっと 見る） */
  basePose(){ return this.g && !this.g.end && this.g.left > 0 && this.g.left <= 3 ? 'lean' : 'sit'; },
  /* れんさ：ばんざい（ms あとに ふだんの 体勢へ） */
  hurray(ms){
    this.pose('cheer');
    clearTimeout(this.hurrayT);
    this.hurrayT = setTimeout(() => { this.hurrayT = null; if (this.page && !this.g.end) this.pose(this.basePose()); }, ms);
  },
  /* クラスを ms だけ（しぐさ・かしげる など） */
  flash(c, ms){
    const p = this.q('#pzPet');
    if (!p) return;
    p.classList.remove(c); void p.offsetWidth; p.classList.add(c);
    const k = 'flashT_' + c;
    clearTimeout(this[k]); this[k] = setTimeout(() => { const x = this.q('#pzPet'); if (x) x.classList.remove(c); }, ms);
  },
  /* まつ あいだ（7秒 さわらない）：きょろきょろ・耳ぴく・しっぽ（ねこは ゆらり、いぬは ぴん）を じゅんばんに。乱数は つかわない。
     うごきを へらす 設定では しない */
  idleArm(){
    clearTimeout(this.idleT);
    if (!this.page || calmMotion()) return;
    this.idleT = setTimeout(() => {
      if (!this.page) return;
      if (this.ready()){
        const list = isCat() ? [['look', 1800], ['ear', 750], ['sway', 2400]] : [['look', 1800], ['ear', 750], ['tailup', 1400]];
        const [g, ms] = list[this.idleN++ % list.length];

      }

    }, 7000);
  },
  /* 数字：のこりの手・けした数（と バー）・点数。got・score を わたすと その数で（れんさの だんかいごとに ふやす とき） */
  nums(got = this.g.got, score = this.g.score){
    if (!this.page) return;
    got = Math.min(got, PUZZLE.goal);
    this.shown = { got, score };
    this.q('#pzGot').textContent = got;
