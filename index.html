  },
  /* いま 盤を さわれるか（うごいている あいだ・おわったあと・知らせが 出ている あいだは さわれない） */
  ready(){ return !!this.page && !this.busy && !this.g.end && this.q('#pzEnd').hidden; },
  bind(){
    const page = this.page, box = this.box;
    let down = null;
    const tileAt = t => { const el = t && t.closest ? t.closest('.pz-t') : null; return el && this.ready() ? +el.dataset.i : -1; };
    const begin = (i, x, y) => { down = i >= 0 ? { i, x, y } : null; this.viaKey = false; };
    const move = (x, y) => {
      if (!down) return;
      const dx = x - down.x, dy = y - down.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 14) return;
      const W = PUZZLE.w, i = down.i, cx = i % W, cy = Math.floor(i / W);
      down = null; this.tapAt = Date.now();
      const j = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? (cx < W - 1 ? i + 1 : -1) : (cx > 0 ? i - 1 : -1))
        : (dy > 0 ? (cy < W - 1 ? i + W : -1) : (cy > 0 ? i - W : -1));
      this.pick(-1);
      if (j >= 0) this.tryMove(i, j);
    };
    const end = () => { if (!down) return; const i = down.i; down = null; this.tapAt = Date.now(); this.tap(i); };
    /* ページを うごかさない：LINE は ページを 下に 引っぱると ミニアプリを 小さくする（最小化）ので、指の うごきを ブラウザに わたさない
       （ボタンの ほかは さわった ときから、ボタンの 上は うごかした ときだけ＝タップは そのまま）。ひくい 画面（tight）は 盤だけ */
    const still = e => { if (e.cancelable && (!page.classList.contains('tight') || e.target.closest('.pz-wrap'))) e.preventDefault(); };
    page.addEventListener('touchstart', e => { if (!e.target.closest('button') || e.target.closest('.pz-t')) still(e); }, { passive:false });
    page.addEventListener('touchmove', still, { passive:false });
    /* 指：タッチの イベントで（さわった ときに とめるので click は 来ない）。1本めの 指だけ */
    box.addEventListener('touchstart', e => { const t = e.changedTouches[0]; if (e.touches.length === 1) begin(tileAt(e.target), t.clientX, t.clientY); else down = null; }, { passive:true });
    box.addEventListener('touchmove', e => { const t = e.changedTouches[0]; move(t.clientX, t.clientY); }, { passive:true });
    box.addEventListener('touchend', end);
    box.addEventListener('touchcancel', () => { down = null; });
    /* マウス・ペン：ポインターの イベントで（指の ぶんは 上で すんでいる） */
    box.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch') return;
      begin(tileAt(e.target), e.clientX, e.clientY);
      if (down) try { box.setPointerCapture(e.pointerId); } catch(_){}
    });
    box.addEventListener('pointermove', e => { if (e.pointerType !== 'touch') move(e.clientX, e.clientY); });
    box.addEventListener('pointerup', e => { if (e.pointerType !== 'touch') end(); });
    box.addEventListener('pointercancel', e => { if (e.pointerType !== 'touch') down = null; });
    /* キーボード（Enter・スペース）と、上の どちらも ない ブラウザ：click。さっき 指や マウスで さわった ぶんは 数えない */
    box.addEventListener('click', e => {
      if (Date.now() - this.tapAt < 700) return;
      const el = e.target.closest('.pz-t');
      if (el){ this.viaKey = true; this.tap(+el.dataset.i); }
    });
    /* やじるしキーで となりの おやつへ */
    box.addEventListener('keydown', e => {
      const d = { ArrowLeft:-1, ArrowRight:1, ArrowUp:-PUZZLE.w, ArrowDown:PUZZLE.w }[e.key];
      const el = e.target.closest('.pz-t');
      if (!d || !el) return;
      const W = PUZZLE.w, i = +el.dataset.i, j = i + d;
      e.preventDefault();
      if (j < 0 || j >= W * W || (Math.abs(d) === 1 && Math.floor(j / W) !== Math.floor(i / W)) || !this.els[j]) return;
      this.els[j].focus();
    });
    page.querySelector('#pzQuit').addEventListener('click', () => this.quit());
    page.querySelector('#pzHelp').addEventListener('click', () => this.help());
    /* Esc：とじる（フォーカスが 画面の 外に 出ていても きくように document で。ポップアップが 出ている あいだは ポップアップが 先に うけとり、
       上に シートが 出ている あいだは シートだけ とじる） */
    this.onKey = e => { if (e.key === 'Escape' && this.page && !Modal.busy && !$('#sheetWrap').classList.contains('open')) this.quit(); };
    document.addEventListener('keydown', this.onKey, true);   /* capture：シートを とじる 処理（js_app.js）より 先に 見る */
    this.onFit = () => this.fit();
    addEventListener('resize', this.onFit);
    if (window.visualViewport) visualViewport.addEventListener('resize', this.onFit);
  },
  refocus(el){ el = el || this.page; if (el) try { el.focus({ preventScroll:true }); } catch(e){ try { el.focus(); } catch(_){} } },
  /* タップ：1つ えらんで、となりを えらぶと 入れかえ */
  tap(i){
    if (!this.ready() || !this.els[i]) return;
    if (this.sel < 0 || this.sel === i) this.pick(this.sel === i ? -1 : i);
    else if (Puzzle.code(this.sel, i) >= 0){ const a = this.sel; this.pick(-1); this.tryMove(a, i); }
    else this.pick(i);
  },
  pick(i){
    if (this.sel >= 0 && this.els[this.sel]){ this.els[this.sel].classList.remove('sel'); this.els[this.sel].removeAttribute('aria-pressed'); }
    this.sel = i;
    if (i >= 0 && this.els[i]){ this.els[i].classList.add('sel'); this.els[i].setAttribute('aria-pressed', 'true'); }
  },
  async tryMove(i, j){
    const code = Puzzle.code(i, j), tok = this.tok;
    if (code < 0 || !this.page || this.busy || this.g.end) return;
    const live = () => this.page && this.tok === tok;   /* とちゅうで とじた・はじめなおした あとは つづけない */
    this.busy = true;
    this.idleArm();
    const a = this.els[i], b = this.els[j];
    this.place(a, j); this.place(b, i);
    await sleep(190);
    if (!live()) return;
    const steps = Puzzle.move(this.g, code);
    if (!steps){
      this.place(a, i); this.place(b, j);
      await sleep(190);
      if (!live()) return;
      this.say(pick(['そろわないみたい', 'ほかの ところは どうかな？']));
      this.busy = false;
      return;
    }
    this.els[i] = b; this.els[j] = a;
    this.moves.push(code);
    const from = this.shown || { got:0, score:0 };
    this.nums(from.got, from.score);
    for (const st of steps){ await this.animate(st); if (!live()) return; }
    this.nums();
    if (!this.g.end && !this.hurrayT) this.pose(this.basePose());
    this.busy = false;
    /* キーボードで うごかした おやつが きえると フォーカスが 画面の 外へ 出るので、うごかした 先の マスに もどす（指・マウスの ときは さわらない） */
    if (this.viaKey && !this.page.contains(document.activeElement)) this.refocus(this.els[j]);
    if (this.g.end) this.finish();
  },
  async animate(st){
    const tok = this.tok, live = () => this.page && this.tok === tok;
    if (st.shuffle){
      this.say('うごかせないから、ならべなおすね');
      this.els.forEach(el => el && el.classList.add('pop'));
      await sleep(260);
      if (!live()) return;
      this.box.innerHTML = '';
      this.els = this.g.b.map((k, i) => this.tile(i, k));
      return;
    }
    for (const i of st.hit) this.els[i].classList.add('pop');
    this.nums(this.shown.got + st.hit.length, this.shown.score + st.pts);
    if (st.chain >= 2){ this.say(st.chain >= 3 ? 'すごい すごい！' : 'れんさだ！'); this.cheer(); this.hurray(1300); }
    else if (st.hit.length >= 4){ this.say(pick(['たくさん けせたね！', 'じょうず！'])); this.cheer(); }
    else if (Math.random() < .35) this.say(pick(isCat() ? ['いいかんじにゃ', 'その ちょうし！', 'おいしそう…'] : ['いいね！', 'その ちょうし！', 'おいしそう…']));
    await sleep(240);
    if (!live()) return;
    for (const i of st.hit){ this.els[i].remove(); this.els[i] = null; }
    for (const [from, to] of st.fall){ const el = this.els[from]; this.els[from] = null; this.els[to] = el; this.place(el, to); }
    const W = PUZZLE.w, born = st.add.map(([i, k, n]) => { const el = this.tile(i, k, Math.floor(i / W) - n); this.els[i] = el; return [el, i]; });
    void this.box.offsetWidth;
    born.forEach(([el, i]) => this.place(el, i));
    await sleep(260);
  },
  /* LINE に ほぞんしている子が サーバーに つながっていない あいだは true。つないでいる とちゅうは ふきだしで 知らせる
     （Act.waiting() の トーストは おへやの 中に 出るので、この 画面の 下に かくれる）。つながらない ときは いつもの ポップアップ */
  held(){
    const why = Act.blocked();
    if (!why) return false;
    if (why === 'connecting') this.say('LINEに つないでいるよ。すこし まってね'); else Act.waiting();
    return true;
  },
  /* 盤の 上に かさねる 知らせ（おわり・とちゅうで やめる）。html が null なら けす */
  card(html){
    const end = this.q('#pzEnd');
    if (!end) return null;
    end.hidden = html == null;
    end.innerHTML = html == null ? '' : `<div class="pz-card">${html}</div>`;
    return end;
  },
  finish(){
    const g = this.g;
    this.cleared = g.clear;
    this.pick(-1);
    clearTimeout(this.idleT); clearTimeout(this.hurrayT); this.hurrayT = null;
    /* クリア：ばんざい＋はねる 3回。おしかった：かなしまずに かしげて しっぽ（ねこは ゆらり、いぬは ぴん。だんかい 3） */
    if (g.clear){ this.cheer('joy'); this.pose('cheer'); }
    else { this.pose('sit'); this.flash('tilt', 1000); this.flash(isCat() ? 'g-sway' : 'g-tailup', isCat() ? 2400 : 1400); }
    this.say(g.clear ? (isCat() ? 'クリア！ やったにゃ！' : 'クリア！ やったね！') : 'おしかったね！ また あそぼ');
    return this.send();
  },
  /* きろく：LINE に ほぞんしている子は サーバーに つながっていないと きろく できない（Act.run は つながっていないと この端末の ルールで
     数えてしまうので、先に Act.blocked() を 見る）。同じ回は 同じ番号（rid）で おくるので、とどいていたら 前の答えが かえる */
  async send(){
    const tok = this.tok;
    this.card('<p class="pz-res" role="status">きろく しているよ…</p>');
    const r = Act.blocked() ? { ok:false, why:'offline' } : await Act.run('puzzle', Object.assign({ seed:this.seed, moves:this.moves.slice() }, this.rid ? { rid:this.rid } : {}));
    if (r && r.ok){ playEvents(r.ev); commit(); }
    if (!this.page || this.tok !== tok) return r;   /* とじた あとに とどいた 返事：きろくは 上で すんでいる */
    this.result(r);
    return r;
  },
  result(r){
    const n = v => Math.max(0, Math.floor(Number(v) || 0));   /* サーバーの 返事の 数字は 数に してから 出す */
    let head, sub, again = true;
    if (r && r.ok){
      const left = n(r.left);
      head = r.clear ? `クリア！ ${n(r.score)}点` : `${n(r.got)}こ けしたよ・${n(r.score)}点`;
      sub = (r.best ? '<b class="pz-best">さいこう点！</b><br>' : '')
        + (r.reward ? `ごきげん+${PUZZLE.mood}・♥+${PUZZLE.love}<br>${left ? `きょうの ほうび あと${left}回` : 'きょうの ほうびは ここまで'}`
          : r.clear ? 'きょうの ほうびは おわり。<br>あしたまた もらえるよ' : 'クリアまで あと すこし！');
    } else if (r && (r.why === 'offline' || r.why === 'busy')){
      /* とどかなかった・サーバーが いそがしい（busy）：あそんだ 手順は そのまま、もういちど おくれる */
      again = false;
      head = 'きろく できなかったよ';
      sub = r.why === 'busy' ? 'すこし まってから、<br>「もういちど おくる」を おしてね' : 'サーバーに つながらなかったみたい。<br>「もういちど おくる」で ためしてね';
    } else {
      head = 'これは きろく されなかったよ';
      sub = r && r.why === 'stale' ? 'ほかの 端末で あそんだか、<br>もう きろく されていたみたい' : 'もういちど あそんでね';
    }
    const end = this.card(`<p class="pz-res">${head}</p><p class="pz-sub">${sub}</p>
      <div class="btnrow">${again ? '<button class="btn" type="button" data-pz="again">もういちど</button>' : '<button class="btn" type="button" data-pz="resend">もういちど おくる</button>'}<button class="btn primary" type="button" data-pz="close">おわる</button></div>`);
    end.querySelector('[data-pz="close"]').addEventListener('click', () => this.close());
    const b = end.querySelector('[data-pz="again"]');
    if (b) b.addEventListener('click', () => { if (!this.held()) this.start(); });
    const s = end.querySelector('[data-pz="resend"]');
    if (s) s.addEventListener('click', () => { if (!this.held()) this.send(); });
    end.querySelector('[data-pz="close"]').focus();
  },
  /* とじる（×・Esc）：あそんでいる とちゅうなら 1回 たしかめる（とじたら その回は きろく されない） */
  quit(){
    if (!this.page) return;
    if (!this.g || this.g.end || !this.moves.length){ this.close(); return; }
    if (!this.q('#pzEnd').hidden) return;
    const end = this.card(`<p class="pz-res">とちゅうで やめる？</p><p class="pz-sub">いまの 回は きろく されないよ。<br>つぎも 同じ ならびから あそべるよ</p>
      <div class="btnrow"><button class="btn" type="button" data-pz="quit">やめる</button><button class="btn primary" type="button" data-pz="stay">つづける</button></div>`);
    end.querySelector('[data-pz="quit"]').addEventListener('click', () => this.close());
    end.querySelector('[data-pz="stay"]').addEventListener('click', () => { if (this.g.end) return; this.card(null); this.refocus(); });
    end.querySelector('[data-pz="stay"]').focus();
  },
  help(){
    Modal.show({
      label:'あそびかた',
      html:() => `<div class="pz-how" aria-hidden="true">${this.kinds().slice(0, 3).map(t => `<svg viewBox="0 0 48 48">${treatIcon(t)}</svg>`).join('')}</div>
        <h3>あそびかた</h3>
        <p>となりの おやつと 入れかえて、<br>たて・よこに 3つ いじょう そろえよう。<br>タップで えらんでも、<br>スワイプで うごかしても いいよ。</p>
        <p><b class="quote">${PUZZLE.moves}手で ${PUZZLE.goal}こ けしたら クリア！</b><br>クリアの ほうび（ごきげん+${PUZZLE.mood}・♥+${PUZZLE.love}）は<br>1日${PUZZLE.perDay}回まで。あそぶのは 何回でも。</p>
        <button class="btn primary" type="button" data-close>わかった</button>`,
    });
  },
  close(){
    const page = this.page;
    if (!page) return;
    this.page = null; this.box = null; this.els = []; this.tok++; this.busy = false;
    clearTimeout(this.cheerT); clearTimeout(this.idleT); clearTimeout(this.hurrayT); this.hurrayT = null;
    removeEventListener('resize', this.onFit);
    if (window.visualViewport) visualViewport.removeEventListener('resize', this.onFit);
    document.removeEventListener('keydown', this.onKey, true);
    page.remove();
    document.documentElement.classList.remove('pz-open');
    appInert(false);
    const back = this.back && this.back.isConnected ? this.back : $('#actPlay');
    if (back && back.focus) try { back.focus({ preventScroll:true }); } catch(e){}
    if (this.cleared && S && !Pet.busy){
      Pet.wake(); Pet.wag(1600); hearts(3);
      Pet.say(isCat() ? 'パズル たのしかったにゃ！' : 'パズル たのしかった！');
    }
    this.cleared = false;
  },
};
/* ===== うちのこラン：3つの 版（ホーム画面版 2026-11-21 P2〜P4・Claude版 P5・LINE版 P6。docs/RUN_DESIGN.md） =====
 * build.sh の RUN_HOME=1・RUN_CLAUDE=1・RUN_LINE=1 のとき js_features.js の すぐあとに 入る。LINE版だけの ことは js_line.js の LineRun が 包む。
 * 3D の ゲーム（Three.js と src/run/）は 1つの ファイル RUN_SRC（run-<ハッシュ>.js。中身は src/run_bundle.js）に まとめてあり、
 * ランを ひらいた ときだけ 読みこむ。integrity は RUN_SRI、CSP は その ファイルの URL だけ（build.sh が 入れる。Claude版は アーティファクトの 2つめの ファイル）。
 * ホーム画面版は Service Worker も とっておく。読みこみが RUN_WAIT_MS より かかったら「よみこめませんでした」（とどけば そのまま えらぶ 画面へ）。
 * - 「あそぶ」の シートに 3つめ「ラン」（openPlay を 包む）。WebGL 2 が ない 端末は「この端末では あそべません」で ひらかない。
 * - ページごと うつる #runPage（パズルと 同じ 重なり 45。うしろの #app は inert）。とじたら ゲームを ぜんぶ 片づける（dispose）。
 * - ひらくと コースを えらぶ 画面（題「うちのこラン」・「レース／アジリティ」の 切りかえ・コースの カード・ベスト・きょうの ほうび）
 *   → レース（こうえん・うみべ・もり。src/run/race.js）か アジリティ（はじめての ひろば・ジグザグ・バランス・おかの ひろば。src/run/agility.js。P4）。
 * - ゴールで Act.run('run')：ほうび（ごきげん・なかよし。レースと アジリティ あわせて 1日 RUN.perDay 回・パズルとは べつ）と コースごとの ベスト・アルバム
 *   （ルールは js_rules.js。アジリティの タイムは 合計＝走った タイム＋ミス×5秒）。
 *   ゴールの カードに ほうびと ベストとの 差を 出す。LINE に ほぞんしている子が つながっていない ときは きろく しない（Act.blocked）。
 * - 子が 入れかわったら（Game.start）とじる。よるの ひとこと（Nudge）は ランの あいだ まつ。 */
const RUN_WAIT_MS = 20000;   /* ゲームの ファイル（約 630KB）を まつ ながさ。こえたら「よみこめませんでした」 */
const RunUI = {
  page:null, ctl:null, back:null, tok:0, gl:null, loading:null, ran:false, onKey:null, R:null, course:null, helpOn:false, mode:'race',
  /* WebGL 2（Three.js r170 が つかう）が あるか。あると わかったら おぼえる（なかった ときは つぎに また 見る＝たまたま つくれなかった だけかも。レビュー R4-3）。
     ためしの 3D は すぐ 手ばなす */
  canPlay(){
    if (this.gl !== true){
      try {
        const g = document.createElement('canvas').getContext('webgl2');
        this.gl = !!g;
        const x = g && g.getExtension('WEBGL_lose_context');
        if (x) x.loseContext();
      } catch(e){ this.gl = false; }
    }
    return this.gl;
  },
  /* ゲームの ファイルを 読む（1回だけ。しっぱいしたら つぎに また ためす） */
  load(){
    if (window.UchinokoRun) return Promise.resolve(window.UchinokoRun);
    if (this.loading) return this.loading;
    this.loading = new Promise((ok, ng) => {
      const s = document.createElement('script');
      s.src = RUN_SRC; s.integrity = RUN_SRI;
      s.onload = () => window.UchinokoRun ? ok(window.UchinokoRun) : ng(new Error('run'));
      s.onerror = () => { s.remove(); ng(new Error('load')); };   /* integrity が あわない・とどかない（つぎに ひらいたら また 読む） */
      document.head.appendChild(s);
    }).catch(e => { this.loading = null; throw e; });
    return this.loading;
  },
  /* 「なにで あそぶ？」の シートに ラン を 足す（openPlay の あとに よぶ） */
  addTile(){
    const sh = $('#sheet'), tiles = $('#sheetWrap').classList.contains('open') && sh ? sh.querySelector('.playpick') : null;
    if (!tiles || tiles.querySelector('[data-play="run"]')) return;
    const ok = this.canPlay(), left = Rules.runLeft(S);
    tiles.classList.add('run3');
    tiles.insertAdjacentHTML('beforeend', `<button class="tile" type="button" data-play="run"${ok ? '' : ' aria-disabled="true"'}><svg viewBox="0 0 24 24" aria-hidden="true">${MINI.run}</svg><span class="tname">ラン<small>3Dで はしる</small></span><span class="gain">${!ok ? 'この端末では<br>あそべません' : left ? `ほうび あと${left}回` : 'ほうびは<br>また あした'}</span></button>`);
    const note = sh.querySelectorAll('.note');
    if (note.length) note[note.length - 1].insertAdjacentHTML('afterend', `<p class="note">${ok ? 'ランは、うちのこが 3Dで はしる ゲーム。おともだちと きそう レース（3コース）と、しょうがいぶつの アジリティ（4コース）！' : 'ランは 3Dの がめんを つかうので、この端末では あそべません。'}</p>`);
    tiles.querySelector('[data-play="run"]').addEventListener('click', () => { if (this.canPlay()) this.open(); });
  },
  /* おともだち 4ひき：うちのこと 同じ 種類の、ちがう 品種（毎回 ランダム。見た目だけ） */
  rivals(){
    const sp = isCat() ? 'cat' : 'dog';
    const pool = BREEDS.filter(b => b.sp === sp && b.id !== S.pet.breedId).map(b => [Math.random(), b]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    return pool.slice(0, 4).map(b => ({ look:normalizeLook(Object.assign({ species:b.sp, breedId:b.id }, b.look)), label:`おともだち<small>（${softName(b.ja)}）</small>` }));
  },
  open(){
    if (!S || Pet.busy || this.page || PuzzleUI.page) return;
    closeSheet();
    this.back = document.activeElement;
    this.ran = false;

/* photos are dimmer and greyer than the illustrations: lift and warm up real fur colours */
function cutify(hex){
  let [r, g, b] = hexToRgb(hex).map(v => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, dd = mx - mn;
  let h = 0, sat = 0;
  if (dd){
    sat = dd / (1 - Math.abs(2 * l - 1));
    h = mx === r ? ((g - b) / dd) % 6 : mx === g ? (b - r) / dd + 2 : (r - g) / dd + 4;
    h *= 60; if (h < 0) h += 360;
  }
  const L2 = Math.min(.95, l + (1 - l) * .25);
  const S2 = sat > .12 ? Math.min(.85, sat * 1.45) : sat;
  const C = (1 - Math.abs(2 * L2 - 1)) * S2, X = C * (1 - Math.abs((h / 60) % 2 - 1)), m0 = L2 - C / 2;
  const [r1, g1, b1] = h < 60 ? [C, X, 0] : h < 120 ? [X, C, 0] : h < 180 ? [0, C, X] : h < 240 ? [0, X, C] : h < 300 ? [X, 0, C] : [C, 0, X];
  return rgbToHex((r1 + m0) * 255, (g1 + m0) * 255, (b1 + m0) * 255);
}
function dominantColors(cv){
  // centre-weighted colour histogram: the animal is usually in the middle, the floor at the edges
  const n = 48, t = document.createElement('canvas');
  t.width = n; t.height = n;
  const w = cv.width, h = cv.height, side = Math.min(w, h) * .8;
  const ctx = t.getContext('2d');
  ctx.drawImage(cv, (w - side) / 2, (h - side) / 2, side, side, 0, 0, n, n);
  const d = ctx.getImageData(0, 0, n, n).data, buckets = {}, sig = n * .22;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
    const i = (y * n + x) * 4, r = d[i], g = d[i + 1], bl = d[i + 2];
    const L = .2126 * r + .7152 * g + .0722 * bl;
    if (L < 28) continue;                                  // eyes, nose, shadows
    const dx = x - n / 2 + .5, dy = y - n * .46;
    const mx = Math.max(r, g, bl), mn = Math.min(r, g, bl);
    const wt = Math.exp(-(dx * dx + dy * dy) / (2 * sig * sig)) * (.35 + Math.min(1, (mx - mn) / Math.max(mx, 1) * 3));
    const k = (r >> 5) + ',' + (g >> 5) + ',' + (bl >> 5);
    const b = buckets[k] || (buckets[k] = { n:0, r:0, g:0, b:0 });
    b.n += wt; b.r += r * wt; b.g += g * wt; b.b += bl * wt;
  }
  const list = Object.values(buckets).sort((a, b) => b.n - a.n).map(b => rgbToHex(b.r / b.n, b.g / b.n, b.b / b.n));
  const main = list[0] || '#C9A27A';
  const dist = (a, b) => { const A = hexToRgb(a), B2 = hexToRgb(b); return Math.hypot(A[0] - B2[0], A[1] - B2[1], A[2] - B2[2]); };
  const sub = list.slice(1, 6).find(c => dist(c, main) > 70) || null;
  return { main:cutify(main), sub:sub && cutify(sub) };
}
function sampleAt(img, fx, fy){
  const c = document.createElement('canvas'), S2 = 120;
  c.width = S2; c.height = S2;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, S2, S2);
  const x = Math.round(clamp(fx, 0, 1) * (S2 - 1)), y = Math.round(clamp(fy, 0, 1) * (S2 - 1));
  const x0 = clamp(x - 2, 0, S2 - 5), y0 = clamp(y - 2, 0, S2 - 5);
  const d = g.getImageData(x0, y0, 5, 5).data;
  let r = 0, gg = 0, b = 0;
  for (let i = 0; i < d.length; i += 4){ r += d[i]; gg += d[i + 1]; b += d[i + 2]; }
  const k = d.length / 4;
  return cutify(rgbToHex(r / k, gg / k, b / k));
}
async function prepImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', .86));
    const crop = (size, q) => {
      const c2 = document.createElement('canvas'); c2.width = size; c2.height = size;
      const side = Math.min(w, h);
      c2.getContext('2d').drawImage(cv, (w - side) / 2, (h - side) / 2, side, side, 0, 0, size, size);
      return c2.toDataURL('image/jpeg', q);
    };
    return { blob, thumb:crop(160, .74), preview:crop(440, .8), colors:dominantColors(cv) };
  } finally { URL.revokeObjectURL(url); }
}

- If no dog or cat is visible, reply {"species":"other"}.`;
}

function parseAI(r){
  if (!r || typeof r !== 'object' || Array.isArray(r)) return null;
  const species = r.species === 'cat' ? 'cat' : r.species === 'dog' ? 'dog' : 'other';
  if (species === 'other') return { species };
  const seen = new Set();
  let cands = (Array.isArray(r.candidates) ? r.candidates : [])
    .map(c => ({ id:String(c && c.id || ''), conf:clamp(Number(c && c.confidence) || 0, 0, 1) }))
    .filter(c => BREED_BY_ID[c.id] && BREED_BY_ID[c.id].sp === species && !seen.has(c.id) && seen.add(c.id))
    .slice(0, 3);
  if (!cands.length) cands = [{ id:species === 'cat' ? 'mix_cat' : 'mix_dog', conf:0 }];
  const lk = r.look && typeof r.look === 'object' ? r.look : {};
  const look = normalizeLook(Object.assign({}, lk, { species, breedId:cands[0].id }));
  return {
    species, cands, look,
    colorName:typeof r.colorName === 'string' ? cleanText(r.colorName.trim(), 14) : '',
    comment:typeof r.comment === 'string' ? cleanText(r.comment.trim(), 60) : '',
  };
}

function colorFamily(hex){
  const [r, g, b] = hexToRgb(hex), L = lum(hex), mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  if (L > .72) return 'white';
  if (L < .05) return 'black';
  if (mx - mn < 26) return 'gray';
  if (r >= g && g >= b){ if (L > .5) return 'cream'; if (L > .2) return 'orange'; return 'brown'; }
  return 'gray';
}
function nameIdea(look, not){
  const list = NAME_IDEAS[colorFamily(normalizeLook(look).colors.main)] || NAME_IDEAS.cream;
  const opts = list.filter(n => n !== not);
  return pick(opts.length ? opts : list);
}

    const typed = ($('#edName').value || '').trim();
    const name = cleanText(typed || $('#edName').placeholder || 'うちのこ', 10).trim() || 'うちのこ';
    const pet = { name, species:look.species, breedId:look.breedId, look, photo:d.photo || null, colorName:d.colorName || '', wear:{ head:null, face:null, neck:null } };
    let greet;
    if (this.mode === 'edit' && S){
      pet.wear = wearFrom(S.pet);
      S.pet = pet;
      greet = 'どうかな？';
    } else {
      S = newState(pet);
      greet = 'はじめまして！';
    }
    this.busy = false;
    Persist.schedule();
    Game.start(greet);
  },
};

/* ===== boot ===== */
(function boot(){
  updateClock();
  S = Persist.loadLocal();
  getImageSampler();
  if (S){
    const away = now() - (S.last || now());
    Game.start(away > 60 * 60e3 ? 'おかえり！' : null, away);
  } else {
    Onboard.openNew(false);
  }
  Persist.keep();
  Persist.connect();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
