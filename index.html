<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="写真の犬や猫をそっくりなペットにして、ごはん・おやつ・なでなででのんびり育てるアプリ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="うちのこ日和">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1922" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{box-sizing:border-box;-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
.stage,.pet,.frame img,.profile img{-webkit-touch-callout:none}
button,.act,.tile,.chip,.sw,label{touch-action:manipulation}
</style>
<title>うちのこ日和</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one phone-width column — a sunlit pet room is the hero, soft stat pills under it, a toy-block action dock at the thumb */
:root{
  --ground:#EDF3F0;
  --surface:#FFFFFF;
  --surface-2:#F3F7F5;
  --ink:#3A3147;
  --ink-soft:#776E86;
  --line:#DCE4E1;
  --berry:#EC6C8A;
  --mint:#4FAE9A;
  --honey:#EFB443;
  --sky:#6FABE3;
  --lilac:#9F8BD6;
  --scrim:rgba(34,28,46,.42);
  --lift:0 6px 0 rgba(58,49,71,.07);
  --f-display:"Mochiy Pop One","Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Rounded Mplus 1c","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1B1922;--surface:#27242F;--surface-2:#211E29;--ink:#EFEBF6;--ink-soft:#A9A1B9;--line:#3A3546;
    --berry:#FF8BA6;--mint:#6CCBB6;--honey:#F5C562;--sky:#8EC1F2;--lilac:#B8A6EC;--scrim:rgba(8,6,14,.6);--lift:0 6px 0 rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#1B1922;--surface:#27242F;--surface-2:#211E29;--ink:#EFEBF6;--ink-soft:#A9A1B9;--line:#3A3546;
  --berry:#FF8BA6;--mint:#6CCBB6;--honey:#F5C562;--sky:#8EC1F2;--lilac:#B8A6EC;--scrim:rgba(8,6,14,.6);--lift:0 6px 0 rgba(0,0,0,.28);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

.app{box-sizing:border-box;max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:12px 16px}

/* header */
.top{display:flex;align-items:center;gap:10px}
.who{flex:1;min-width:0}
.who h1{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.25;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who p{margin:0;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvchip{display:flex;align-items:center;gap:5px;background:var(--surface);border-radius:999px;padding:6px 12px 6px 9px;font-weight:900;font-size:13px;box-shadow:var(--lift);font-variant-numeric:tabular-nums;white-space:nowrap}
.lvchip svg{width:18px;height:18px}
.iconbtn{flex:none;width:42px;height:42px;border-radius:14px;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:var(--lift);cursor:pointer}
.iconbtn{position:relative}
.iconbtn svg{width:22px;height:22px}
.badge{position:absolute;right:-4px;top:-4px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:var(--berry);color:#FFFFFF;font-size:11px;font-weight:900;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--ground);font-variant-numeric:tabular-nums}
.badge.done{background:var(--mint)}
.lvpill{margin-left:6px;background:color-mix(in srgb,var(--berry) 16%,var(--surface));color:var(--berry);border-radius:999px;padding:1px 8px;font-size:12px;font-variant-numeric:tabular-nums}

/* stage */
.stage{position:relative;flex:1 1 auto;min-height:340px;max-height:560px;border-radius:28px;overflow:hidden;isolation:isolate;user-select:none;-webkit-user-select:none;
  --wall:#E1EFE9;--dot:rgba(255,255,255,.6);--sky1:#9ED2F4;--sky2:#DDF2FF;--floor1:#EACFA6;--floor2:#DDB98C}
.stage[data-tod="morning"]{--sky1:#FFC4A3;--sky2:#CFE9FF}
.stage[data-tod="evening"]{--sky1:#F3906A;--sky2:#F9D29C}
.stage[data-tod="night"]{--sky1:#141A3A;--sky2:#323A74}
.tint{position:absolute;inset:0 0 40% 0;pointer-events:none;transition:background-color 1s}
.stage[data-tod="morning"] .tint{background:rgba(255,190,150,.16)}
.stage[data-tod="evening"] .tint{background:rgba(255,140,80,.18)}
.stage[data-tod="night"] .tint{background:rgba(40,44,100,.42)}
.stage[data-walldark="1"][data-tod="night"] .tint{background:rgba(20,22,60,.25)}
.view{position:absolute;inset:0;width:100%;height:100%;z-index:1;--vw1:#8FA8C6;--vw2:#A9C2DA;--vwin:#FFF3C4;--vsea:#5FA8D8;transition:filter 1s}
.stage[data-tod="night"] .view{filter:brightness(.5) saturate(.8)}
.stage:not([data-tod="night"]) .view{--vwin:rgba(255,255,255,.55)}
.weather{position:absolute;inset:-20% 0 0 0;z-index:1;pointer-events:none}
.weather.w-snow{background:radial-gradient(#FFFFFF 1.6px,transparent 2.2px) 0 0/18px 22px,radial-gradient(#FFFFFF 1.2px,transparent 1.8px) 9px 11px/24px 26px;animation:fall 6s linear infinite}
.weather.w-petals{background:radial-gradient(ellipse 3px 2px,#F9C6D3 90%,transparent) 0 0/26px 30px,radial-gradient(ellipse 2.4px 1.6px,#F4B4C6 90%,transparent) 13px 15px/34px 36px;animation:fall 9s linear infinite}
.weather.w-rain{background:repeating-linear-gradient(105deg,transparent 0 9px,rgba(255,255,255,.55) 9px 10px,transparent 10px 22px);background-size:100% 40px;animation:rain .5s linear infinite;opacity:.8}
@keyframes fall{to{background-position:0 120px,9px 131px}}
@keyframes rain{to{background-position:0 40px}}
.evdeco{position:absolute;inset:0;pointer-events:none;z-index:1}
.evdeco .gl{position:absolute;left:1%;right:1%;top:1.5%;height:7%}
.evdeco .garland{width:100%;height:100%;display:block;overflow:visible}
.evdeco .evitem{position:absolute;left:63%;top:61.5%;width:16%;transform:translateY(-100%)}
.evdeco .evitem svg,.evhang svg{display:block;width:100%;height:auto}
.evhang{position:absolute;left:30%;top:8%;width:7%;z-index:2;pointer-events:none;animation:sway 3s ease-in-out infinite;transform-origin:50% 0}
@keyframes sway{50%{transform:rotate(6deg)}}
.wall{position:absolute;inset:0 0 40% 0;background:radial-gradient(var(--dot) 2px,transparent 2.6px) 0 0/22px 22px,var(--wall);transition:background-color 1s}
.floor{position:absolute;inset:60% 0 0 0;background:repeating-linear-gradient(90deg,rgba(120,80,40,.10) 0 2px,transparent 2px 64px),linear-gradient(var(--floor1),var(--floor2))}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:#FFFFFF;opacity:.75}
.rug{position:absolute;left:50%;top:80%;width:76%;aspect-ratio:3/1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(ellipse closest-side,#CFDDF5 0 58%,#FFFFFF 58% 63%,#B9CBEF 63% 100%)}
.stage[data-tod="night"] .rug{filter:brightness(.72)}
.win{position:absolute;z-index:1;left:7%;top:8%;width:31%;aspect-ratio:4/5;box-sizing:border-box;border:7px solid #FFFFFF;border-radius:18px 18px 8px 8px;background:linear-gradient(var(--sky1),var(--sky2));overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.win::before,.win::after{content:"";position:absolute;background:#FFFFFF;z-index:2}
.win::before{left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%)}
.win::after{top:50%;left:0;right:0;height:6px}
.orb{position:absolute;right:12%;top:12%;width:28%;aspect-ratio:1;border-radius:50%;background:#FFE6A1;box-shadow:0 0 0 6px rgba(255,230,161,.35)}
.stage[data-tod="night"] .orb{background:transparent;box-shadow:inset 7px -3px 0 0 #F6F0C8}
.cloud{position:absolute;left:-30%;top:58%;width:44%;height:14%;border-radius:99px;background:#FFFFFF;opacity:.9;animation:drift 38s linear infinite}
.cloud::before{content:"";position:absolute;left:22%;top:-70%;width:46%;height:150%;border-radius:50%;background:inherit}
.stars{position:absolute;inset:0;opacity:0;background:radial-gradient(#FFF 1px,transparent 1.6px) 4px 6px/26px 22px,radial-gradient(#FFF 1px,transparent 1.6px) 15px 14px/31px 27px}
.stage[data-tod="night"] .stars{opacity:.8}
.stage[data-tod="night"] .cloud{opacity:.15}
@keyframes drift{to{transform:translateX(330%)}}
.clock{position:absolute;left:47%;top:11%;width:13%;aspect-ratio:1;border-radius:50%;background:#FFFFFF;box-shadow:inset 0 0 0 4px #F2B8C6,0 3px 0 rgba(0,0,0,.06)}
.clock i{position:absolute;left:50%;bottom:50%;width:3px;border-radius:3px;background:#3A3147;transform-origin:50% 100%;margin-left:-1.5px}
.clock .h{height:24%}.clock .m{height:34%;width:2px;margin-left:-1px}
.clock::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#EC6C8A}
.frame{position:absolute;right:8%;top:9%;width:22%;aspect-ratio:1;box-sizing:border-box;padding:5px;background:#FFFFFF;border-radius:6px;transform:rotate(4deg);box-shadow:0 4px 0 rgba(0,0,0,.07)}
.frame img{display:block;width:100%;height:100%;object-fit:cover;border-radius:3px}
.frame::before{content:"";position:absolute;left:50%;top:-12px;width:2px;height:12px;background:#B9A79A;transform:translateX(-50%)}
.plant{position:absolute;left:2%;top:60%;width:15%;transform:translateY(-92%);z-index:2}
.lamp{position:absolute;right:3%;top:60%;width:12%;transform:translateY(-94%);z-index:2}
.lamp .glow{opacity:0;transition:opacity 1s}
.stage[data-tod="night"] .lamp .glow{opacity:1}
.shade{position:absolute;inset:0;z-index:300;pointer-events:none;opacity:0;transition:opacity 1.2s;background:radial-gradient(circle at 92% 46%,rgba(255,206,130,.32),transparent 38%),rgba(22,24,64,.26)}
.stage[data-tod="night"] .shade{opacity:1}
.bowl{position:absolute;left:24%;top:93%;width:21%;transform:translate(-50%,-100%);z-index:200}
.bowl .food{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.bowl.filled .food{opacity:1;transform:none}
.cushion{position:absolute;left:76%;top:84%;width:40%;transform:translate(-50%,-62%);z-index:3}

/* pet */
.pet{position:absolute;left:50%;top:78%;width:46%;max-width:250px;aspect-ratio:1;--s:1;transform:translate(-50%,-93%) scale(var(--s));transform-origin:50% 93%;touch-action:none;cursor:grab;transition:transform .4s ease}
.pet .pet-svg{display:block;width:100%;height:100%;overflow:visible}
.pet-svg .pv-all{transform-box:view-box;transform-origin:120px 224px;animation:breathe 3.4s ease-in-out infinite}
.pet-svg .pv-tail{transform-box:view-box;transform-origin:152px 198px;animation:wag 1.8s ease-in-out infinite}
.pet-svg .pv-head{transform-box:view-box;transform-origin:120px 146px;transition:transform .5s ease}
.pet-svg .pv-body{transform-box:view-box;transform-origin:120px 222px;transition:transform .5s ease}
.pet-svg .pv-legs{transition:opacity .4s}
.pet-svg .pv-neck{transform-box:view-box;transform-origin:120px 146px;transition:transform .5s ease}
.pet-svg .pv-eyes-open{animation:blink 5.4s infinite;transform-box:view-box;transform-origin:120px 98px}
.pet-svg .pv-eyes-happy,.pet-svg .pv-eyes-closed,.pet-svg .pv-brow-sad,.pet-svg .pv-mouth-o{display:none}
.pet-svg .pv-cheek{opacity:.45;transition:opacity .3s}
.ex-happy .pv-eyes-open,.ex-eat .pv-eyes-open,.ex-sleep .pv-eyes-open{display:none}
.ex-happy .pv-eyes-happy,.ex-eat .pv-eyes-happy{display:inline}
.ex-sleep .pv-eyes-closed{display:inline}
.ex-happy .pv-mouth-w,.ex-eat .pv-mouth-w{display:none}
.ex-happy .pv-mouth-o,.ex-eat .pv-mouth-o{display:inline}
.ex-happy .pv-cheek{opacity:.8}
.ex-sad .pv-brow-sad{display:inline}
.ex-eat .pv-head{animation:chomp .32s ease-in-out infinite alternate}
.wag-fast .pv-tail{animation-duration:.38s}
.tilt .pv-head{animation:tilt 1s ease-in-out}
.pose-sleep .pv-legs{opacity:0}
.pose-sleep .pv-body{transform:scaleY(.8)}
.pose-sleep .pv-head{transform:translate(0,22px) rotate(-7deg)}
.pose-sleep .pv-neck{transform:translate(0,21px) rotate(-7deg)}
.ex-eat .pv-neck{animation:chomp .32s ease-in-out infinite alternate}
.pose-sleep .pv-tail{animation:none;transform:translate(-8px,12px) rotate(30deg)}
.pose-sleep .pv-all{animation-duration:4.6s}
.pet.walking .pv-all{animation:hop .34s ease-in-out infinite}
.pet.walking .pet-svg{transform:rotate(4deg)}
.pet.walking.dir-l .pet-svg{transform:rotate(-4deg)}
.pet.jump .pv-all{animation:jump .5s ease-out}
@keyframes breathe{50%{transform:scaleY(1.018)}}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes chomp{to{transform:translateY(5px) rotate(1deg)}}
@keyframes tilt{35%,65%{transform:rotate(-10deg)}}
@keyframes hop{50%{transform:translateY(-9px)}}
@keyframes jump{40%{transform:translateY(-34px) scaleY(1.04)}70%{transform:translateY(0) scaleY(.94)}}
.pet-svg .pv-legL,.pet-svg .pv-legR{transform-box:view-box}
.pet-svg .pv-legL{transform-origin:108px 182px}
.pet-svg .pv-legR{transform-origin:131px 182px}
.tr-sit .pv-all{animation:trSit 1.1s ease}
@keyframes trSit{30%,70%{transform:scaleY(.9) translateY(4px)}}
.tr-paw .pv-legR{animation:trPaw 1.6s ease}
@keyframes trPaw{20%,75%{transform:translate(4px,-30px) rotate(-38deg)}}
.tr-high .pv-legR{animation:trHigh 1.6s ease}
@keyframes trHigh{25%,70%{transform:translate(8px,-50px) rotate(-75deg)}}
.tr-high .pv-all{animation:jump .5s ease-out .25s}
.tr-down .pv-legs{opacity:0}
.tr-down .pv-body{transform:scaleY(.8)}
.tr-down .pv-head,.tr-down .pv-neck{transform:translate(0,22px)}
.tr-spin .pet-svg{animation:trSpin 1s ease-in-out}
@keyframes trSpin{25%{transform:scaleX(0) translateY(-8px)}50%{transform:scaleX(-1) translateY(-12px)}75%{transform:scaleX(0) translateY(-8px)}}
.tr-bigjump .pv-all{animation:trBig .9s ease-out}
@keyframes trBig{35%{transform:translateY(-70px) rotate(-6deg)}60%{transform:translateY(-66px) rotate(6deg)}85%{transform:translateY(0) scaleY(.9)}}
.tr-roll .pv-all{transform-origin:120px 150px;animation:trRoll 1.3s ease-in-out}
@keyframes trRoll{50%{transform:translateX(30px) rotate(180deg)}100%{transform:translateX(0) rotate(360deg)}}
.tr-bow .pv-head,.tr-bow .pv-neck{animation:trBow 1.4s ease}
@keyframes trBow{30%,65%{transform:translate(0,16px) rotate(4deg)}}
.tr-dance .pv-all{animation:trDance 1.8s ease-in-out}
@keyframes trDance{10%,50%{transform:rotate(-10deg) translateY(-8px)}30%,70%{transform:rotate(10deg) translateY(-8px)}90%{transform:none}}
.tr-dance .pv-legR{animation:trPaw .9s ease 2}
.tr-bang .pv-all{animation:trBang 2.2s ease}
@keyframes trBang{15%{transform:rotate(-8deg)}35%,75%{transform:rotate(80deg) translate(10px,0)}100%{transform:none}}
.tr-stretch .pv-all{animation:trStretch 1.6s ease}
@keyframes trStretch{30%,70%{transform:scaleX(1.14) scaleY(.86)}}
.tr-punch .pv-legR{animation:trPunch .35s ease 4 alternate}
@keyframes trPunch{to{transform:translate(8px,-24px) rotate(-55deg)}}

.bubble{position:absolute;left:50%;bottom:92%;z-index:2;transform:translateX(-50%) scale(.6);transform-origin:50% 100%;opacity:0;pointer-events:none;background:#FFFFFF;color:#3A3147;font-weight:700;font-size:14px;line-height:1.4;padding:7px 13px;border-radius:16px;white-space:nowrap;box-shadow:0 3px 0 rgba(58,49,71,.12);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.bubble::after{content:"";position:absolute;left:50%;top:100%;border:7px solid transparent;border-top-color:#FFFFFF;transform:translateX(-50%)}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}

/* fx */
.fx{position:absolute;pointer-events:none;z-index:400}
.fx.heart{width:24px;height:24px;margin:-12px 0 0 -12px;animation:rise 1.2s ease-out forwards}
.fx.z{font-family:var(--f-display);color:#FFFFFF;font-size:18px;text-shadow:0 2px 0 rgba(40,40,90,.35);animation:zz 2.4s ease-out forwards}
.fx.crumb{width:7px;height:7px;border-radius:50%;background:#C98A48;animation:crumb .7s ease-out forwards}
.fx.spark{width:10px;height:10px;margin:-5px;border-radius:2px;animation:spark 1.1s ease-out forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1;transform:translate(0,-8px) scale(1.1)}100%{transform:translate(var(--dx,0px),-70px) scale(.9);opacity:0}}
@keyframes zz{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(26px,-60px) scale(1.2);opacity:0}}
@keyframes crumb{to{transform:translate(var(--dx,0px),22px);opacity:0}}
@keyframes spark{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.toy{position:absolute;width:9%;aspect-ratio:1;transform:translate(-50%,-100%);pointer-events:none}
.toy svg{display:block;width:100%;height:100%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.treatpop{position:absolute;width:13%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:420;pointer-events:none;animation:bob .7s ease-in-out infinite alternate;transition:top .45s ease-in,left .45s ease-in,opacity .3s}
.treatpop svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
@keyframes bob{to{margin-top:-6px}}
.toast{position:absolute;left:50%;top:12px;z-index:500;opacity:0;max-width:86%;transform:translate(-50%,-160%);background:#FFFFFF;color:#3A3147;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;box-shadow:0 4px 0 rgba(58,49,71,.12);transition:transform .35s cubic-bezier(.3,1.4,.5,1);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.hint{position:absolute;left:50%;bottom:10px;z-index:450;transform:translateX(-50%);background:rgba(255,255,255,.88);color:#3A3147;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .5s}

.levelup{position:fixed;inset:0;z-index:70;display:grid;place-items:center;overflow:auto;background:var(--scrim);padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));animation:fadein .25s ease}
.levelup.closing{opacity:0;transition:opacity .2s}
.levelup .fx{position:fixed;z-index:0}
@keyframes fadein{from{opacity:0}}
.levelup .card{position:relative;z-index:1;box-sizing:border-box;background:var(--surface);color:var(--ink);border-radius:28px;padding:22px 20px 18px;text-align:center;max-width:320px;width:100%;box-shadow:0 8px 0 rgba(0,0,0,.08);animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.levelup h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:4px 0 6px;color:var(--berry);text-wrap:balance}
.levelup p{margin:0 0 12px;font-size:14px;color:var(--ink-soft)}
.levelup ul{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.levelup li{background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.levelup .mpet{width:120px;margin:0 auto}
.levelup .mpet .pet-svg{display:block;width:100%;height:auto}
.levelup .quote{color:var(--ink);font-weight:700}
.levelup .btnrow{justify-content:center;flex-wrap:nowrap}
.levelup .btnrow .btn{flex:1 1 0;min-width:0}
.levelup .giftline{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.levelup .gainline{color:var(--berry);font-weight:900;font-size:16px;margin-top:-4px}
.mini{width:24px;height:24px;flex:none;display:block}
.mini.dim{opacity:.35;filter:grayscale(1)}
.souvwrap{position:relative;width:170px;margin:0 auto}
.souvwrap .mpet{width:120px;margin:0}
.souvitem{position:absolute;right:0;bottom:6px;width:64px;height:64px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 3px var(--surface-2),0 4px 0 rgba(0,0,0,.06);display:grid;place-items:center;animation:pop .5s .2s both cubic-bezier(.3,1.6,.5,1)}
.souvitem svg{width:46px;height:46px}
.newpill,.evpill,.okpill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:900;line-height:1.5}
.newpill{position:absolute;top:-6px;right:-6px;background:var(--berry);color:#FFFFFF}
.evpill{background:color-mix(in srgb,var(--honey) 30%,var(--surface));color:var(--ink)}
.okpill{background:color-mix(in srgb,var(--mint) 22%,var(--surface));color:color-mix(in srgb,var(--mint) 70%,var(--ink))}
.stampbig{width:72px;height:72px;margin:6px auto 8px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--berry) 12%,var(--surface));box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--berry) 40%,var(--surface));transform:rotate(-12deg);animation:pop .5s .3s both cubic-bezier(.3,1.6,.5,1)}
.stampbig .mini{width:44px;height:44px}
@keyframes pop{from{transform:scale(.7);opacity:0}}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter{background:var(--surface);border-radius:18px;padding:10px 12px 11px;box-shadow:var(--lift);min-width:0}
.meter .row{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900;line-height:1.3}
.meter .row svg{width:18px;height:18px;flex:none}
.meter .state{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--surface-2);margin-top:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;width:50%;border-radius:inherit;background:var(--c);transition:width .7s cubic-bezier(.3,1.2,.5,1)}
.meter.low .state{color:#D9822B}
.love{grid-column:1/-1}
.love .bar{height:8px}

/* dock */
.dock{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding-bottom:6px}
.act{--c:var(--mint);border:0;border-radius:20px;padding:10px 2px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:900;font-size:13px;line-height:1.2;
  background:color-mix(in srgb,var(--c) 22%,var(--surface));box-shadow:0 5px 0 color-mix(in srgb,var(--c) 52%,var(--surface));transition:transform .08s,box-shadow .08s,opacity .2s}
.act svg{width:32px;height:32px}
.act:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 52%,var(--surface))}
.act[aria-disabled="true"]{opacity:.45}
.act:focus-visible{outline-color:var(--c)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{box-sizing:border-box;width:100%;max-width:480px;max-height:88%;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding-inline:16px;padding-block:18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .sheet{transform:none}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h2{flex:1;margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.3}
.closebtn{width:36px;height:36px;border-radius:12px;border:0;background:var(--surface-2);cursor:pointer;display:grid;place-items:center}
.closebtn svg{width:18px;height:18px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border:0;border-radius:18px;background:var(--surface-2);padding:10px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:12px;font-weight:700;line-height:1.3;text-align:center;box-shadow:inset 0 0 0 2px transparent;min-width:0}
.tile svg{width:48px;height:48px}
.tile .pet-svg{width:78px;height:78px}
.tile[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--mint);background:color-mix(in srgb,var(--mint) 12%,var(--surface))}
.tile[aria-disabled="true"]{opacity:.55;cursor:default}
.tile small{display:block;font-size:11px;color:var(--ink-soft);font-weight:500}
.lockpill{font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--surface);border-radius:99px;padding:1px 8px}
.note{font-size:12px;color:var(--ink-soft);margin:12px 0 0}
.reqs{display:flex;flex-direction:column;gap:10px}
.req{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:18px;padding:12px}
.req-ic{width:40px;height:40px;flex:none;border-radius:12px;background:var(--surface);display:grid;place-items:center}
.req-body{flex:1;min-width:0;font-size:14px;line-height:1.4}
.req-body .bar{margin-top:6px;height:8px}
.req-body .bar i{background:var(--berry)}
.req-st{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.req-st .cnt{font-weight:900;font-variant-numeric:tabular-nums}
.req-st small{font-size:11px;color:var(--berry);font-weight:700}
.req.done{opacity:.8}
.req.done .bar i{background:var(--mint)}
.reqfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);margin:14px 2px}
.reqfoot b{color:var(--ink)}
.tile.trick .tk-star .mini{width:40px;height:40px}
.tile.trick.learned{background:color-mix(in srgb,var(--honey) 16%,var(--surface))}
.tk-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:80px}
.tk-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tk-dots i.on{background:var(--mint)}
.rchips{margin-bottom:12px}
.rchips .chip{padding:6px 12px;font-size:13px}
.rsw{display:block;width:100%;aspect-ratio:4/3;border-radius:12px;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.08);position:relative;overflow:hidden}
.rsw-floor{background:linear-gradient(#F4EDE2,#E9DCC6)}
.rsw-rug{position:absolute;left:12%;right:12%;top:30%;bottom:22%;border-radius:50%}
.rsw-bed{position:absolute;left:10%;top:22%;width:80%;height:auto}
.rsw-win{--vw1:#8FA8C6;--vw2:#A9C2DA;--vwin:rgba(255,255,255,.55);--vsea:#5FA8D8;background:linear-gradient(#9ED2F4,#DDF2FF);box-shadow:inset 0 0 0 5px #FFFFFF,inset 0 0 0 6px rgba(0,0,0,.08)}
.rsw-win svg{position:absolute;inset:0;width:100%;height:100%}
.seasonrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap}
.mini-seg{margin:0;min-width:140px}
.mini-seg button{padding:6px 10px;font-size:13px}
.diary{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.diary li{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:16px;padding:10px 12px}
.d-date{flex:none;width:44px;text-align:center;font-weight:900;font-size:15px;line-height:1.1;font-variant-numeric:tabular-nums}
.d-date small{display:block;font-size:10px;color:var(--ink-soft);font-weight:700}
.d-ic{flex:none;width:36px;height:36px;border-radius:12px;background:var(--surface);display:grid;place-items:center}
.d-ic .mini{width:26px;height:26px}
.d-txt{min-width:0;font-size:14px;line-height:1.4}
.d-txt small{display:block;font-size:12px;color:var(--ink-soft)}
.empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:24px 8px}
.svtiles .tile{cursor:default}
.tile.sv svg{width:44px;height:44px}
.tile.sv small{font-size:11px;color:var(--ink-soft);font-weight:700}
.tile.sv.unknown svg{filter:brightness(0) opacity(.18)}
.tile.sv.unknown .tname{color:var(--ink-soft)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:16px}
.cal-head .closebtn{font-size:22px;font-weight:900;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal>b{font-size:11px;color:var(--ink-soft);padding-bottom:2px}
.cal span{position:relative;aspect-ratio:1;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.cal span:empty{background:none}
.cal span i{font-style:normal}
.cal span.st{background:color-mix(in srgb,var(--berry) 12%,var(--surface))}
.cal span.st .mini{position:absolute;width:70%;height:70%;opacity:.9;transform:rotate(-12deg)}
.cal span.st i{position:absolute;left:4px;top:2px;font-size:9px;color:var(--ink)}
.cal span.today{box-shadow:inset 0 0 0 2px var(--mint)}
.cal-stats{margin:12px 0 0}
.codebox{box-sizing:border-box;width:100%;border:0;border-radius:14px;padding:10px 12px;font:500 11px/1.45 ui-monospace,Menlo,monospace;background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);resize:vertical;word-break:break-all}
.codebox:focus{outline:none;box-shadow:inset 0 0 0 2.5px var(--mint)}
.movecard{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;box-shadow:none;background:var(--surface-2);padding:12px}
.movecard .codebox{background:var(--surface)}
.movecard h3{margin:0}
.movecard .note{margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px;width:auto;white-space:nowrap;font-size:14px;padding-inline:10px}
.filebtn{position:relative;overflow:hidden;cursor:pointer;box-sizing:border-box}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.filebtn:focus-within{outline:3px solid var(--mint);outline-offset:2px}
.sheet-sub{margin:-6px 0 12px;font-size:12px;color:var(--ink-soft)}
.tile .tname{display:block;min-height:2.6em}
.tile.treat svg{width:44px;height:44px}
.tile .gain{font-size:11px;color:var(--ink-soft);font-weight:700;line-height:1.3}
.tile .gain b{display:block;color:var(--berry);font-size:13px}
.seg small{display:block;font-size:10px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.nextup{font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--surface-2);border-radius:12px;padding:7px 12px;margin:0 0 14px;line-height:1.5}
.nextup .nx-head{display:block;font-size:11px;letter-spacing:.06em}
.nextup .nx-body{display:flex;justify-content:center;align-items:baseline;gap:6px;color:var(--ink);font-size:12px}
.nextup .nx-body b{flex:none;color:var(--berry);font-size:13px;font-variant-numeric:tabular-nums}
.nextup .nx-item{min-width:0;word-break:keep-all;overflow-wrap:anywhere}


/* profile */
.profile{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.profile .ph{width:96px;height:96px;flex:none;border-radius:22px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;position:relative}
.profile .ph img{position:absolute;right:4px;bottom:4px;width:38px;height:38px;object-fit:cover;border-radius:10px;border:3px solid var(--surface)}
.profile .ph .pet-svg{width:92px;height:92px}
.profile h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.3;word-break:break-all}
.profile p{margin:2px 0 0;font-size:13px;color:var(--ink-soft)}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.counts div{background:var(--surface-2);border-radius:14px;padding:8px 4px;text-align:center;font-size:11px;color:var(--ink-soft);font-weight:700}
.counts b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
.btn{border:0;border-radius:16px;padding:13px 16px;font-weight:900;font-size:15px;cursor:pointer;background:var(--surface-2);color:var(--ink);width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--mint);color:#FFFFFF;box-shadow:0 5px 0 color-mix(in srgb,var(--mint) 60%,#000)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--mint) 60%,#000)}
.btn.warn{background:color-mix(in srgb,var(--berry) 16%,var(--surface));color:var(--berry)}
.btn[disabled]{opacity:.5;cursor:default}
.btnstack{display:flex;flex-direction:column;gap:10px}
.confirm{background:var(--surface-2);border-radius:18px;padding:14px;font-size:14px}
.confirm p{margin:0 0 10px}
.confirm .row{display:flex;gap:8px}

/* onboarding */
.onboard{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--ground);padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.ob{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ob-step{display:flex;flex-direction:column;gap:16px}
.brand{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.2;margin:8px 0 0;text-wrap:balance}
.brand span{color:var(--berry)}
.lead{margin:0;font-size:15px;color:var(--ink-soft);text-wrap:pretty}
.miniroom{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:16/10;background:linear-gradient(#E1EFE9 0 58%,#FFFFFF 58% 60%,#EACFA6 60%)}
.miniroom::before{content:"";position:absolute;inset:0 0 42% 0;background:radial-gradient(rgba(255,255,255,.6) 2px,transparent 2.6px) 0 0/22px 22px}
.miniroom .pet-svg{display:block;width:100%;height:auto}
.breedgrid .pet-svg g,.tiles .pet-svg g{animation:none!important}
.upload{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:20px;padding:16px;font-weight:900;font-size:17px;background:var(--mint);color:#FFFFFF;cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--mint) 60%,#000)}
.upload:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--mint) 60%,#000)}
.upload:focus-within{outline:3px solid var(--honey);outline-offset:2px}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.upload svg{width:26px;height:26px}
.linkbtn{border:0;background:none;color:var(--ink-soft);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px;align-self:center}
.oberr{background:color-mix(in srgb,var(--honey) 22%,var(--surface));border-radius:16px;padding:10px 14px;font-size:14px;font-weight:700}
.scan{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:24px;text-align:center}
.scanphoto{position:relative;width:220px;height:220px;max-width:70vw;max-height:70vw;border-radius:50%;overflow:hidden;box-shadow:0 0 0 8px var(--surface),0 10px 0 8px rgba(0,0,0,.05)}
.scanphoto img{width:100%;height:100%;object-fit:cover;display:block}
.scanphoto::after{content:"";position:absolute;left:0;right:0;height:30%;background:linear-gradient(transparent,rgba(255,255,255,.65),transparent);animation:scanline 1.8s ease-in-out infinite alternate}
@keyframes scanline{from{top:-30%}to{top:100%}}
.scanmsg{font-weight:900;font-size:17px;margin:0;min-height:1.6em}
.paws{display:flex;gap:8px}
.paws svg{width:22px;height:22px;opacity:.25;animation:paw 1.6s infinite}
.paws svg:nth-child(2){animation-delay:.2s}.paws svg:nth-child(3){animation-delay:.4s}.paws svg:nth-child(4){animation-delay:.6s}
@keyframes paw{30%{opacity:1;transform:translateY(-4px)}}

.card{background:var(--surface);border-radius:22px;padding:14px;box-shadow:var(--lift)}
.card h3{margin:0 0 10px;font-size:14px;font-weight:900}
.say{display:flex;gap:10px;align-items:flex-start}
.say img{width:52px;height:52px;border-radius:14px;object-fit:cover;flex:none}
.say p{margin:0;font-size:15px;font-weight:700;line-height:1.5}
.say small{display:block;font-weight:500;color:var(--ink-soft);font-size:13px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:999px;padding:8px 14px;background:var(--surface-2);font-weight:700;font-size:14px;cursor:pointer;box-shadow:inset 0 0 0 2px transparent}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--mint) 16%,var(--surface));box-shadow:inset 0 0 0 2.5px var(--mint)}
.chip small{font-weight:500;color:var(--ink-soft);margin-left:4px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:0;border-radius:10px;padding:8px;background:transparent;font-weight:900;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 2px 0 rgba(0,0,0,.06)}
.breedgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-height:340px;overflow:auto;padding:2px}
.swrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swrow+.swlabel{margin-top:12px}
.swlabel{font-size:13px;font-weight:900;margin:0 0 8px}
.picker{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.pickphoto{position:relative;flex:none;width:112px;height:112px;border-radius:16px;overflow:hidden;cursor:crosshair;box-shadow:inset 0 0 0 2px var(--line)}
.pickphoto img{display:block;width:100%;height:100%;object-fit:cover}
.pickphoto i{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;box-shadow:0 0 0 3px #FFFFFF,0 0 0 4.5px rgba(0,0,0,.35);pointer-events:none}
.picktargets{display:flex;flex-direction:column;gap:8px;min-width:0}
.picktargets .chip{padding:6px 12px;font-size:13px}
.sw{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12)}
.sw[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12),0 0 0 3px var(--surface),0 0 0 5.5px var(--mint)}
.swcustom{position:relative;width:34px;height:34px;border-radius:50%;overflow:hidden;background:conic-gradient(#F27B7B,#F5C562,#8CC26A,#6FABE3,#B8A6EC,#F27B7B);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12)}
.swcustom input{position:absolute;inset:-6px;width:46px;height:46px;opacity:0;cursor:pointer}
.namebox{display:flex;gap:8px}
.namebox input{flex:1;min-width:0;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-weight:700;font-size:16px;background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.namebox input:focus{outline:none;box-shadow:inset 0 0 0 2.5px var(--mint)}
.namebox button{border:0;border-radius:14px;padding:0 14px;background:var(--surface-2);font-weight:700;cursor:pointer;white-space:nowrap}
.sticky-cta{position:sticky;bottom:0;padding-top:8px;background:linear-gradient(transparent,var(--ground) 30%)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="who"><h1 id="petName">うちのこ</h1><p id="petBreed">&nbsp;</p></div>
    <button class="iconbtn" id="reqBtn" type="button" aria-label="きょうのおねがい">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M9 4.5h6v2.5H9z" fill="currentColor"/><path d="M12 17.2s-3.4-2-4-3.8c-.5-1.3.3-2.6 1.6-2.6 1 0 1.8.6 2.4 1.3.6-.7 1.4-1.3 2.4-1.3 1.3 0 2.1 1.3 1.6 2.6-.6 1.8-4 3.8-4 3.8z" fill="var(--berry)"/></svg>
      <span class="badge" id="reqBadge">3</span>

/* ===== color utils ===== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function isHex(v){ return typeof v === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v.trim()); }
function hexToRgb(h){ h = h.trim().replace('#',''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbToHex(r, g, b){ return '#' + [r, g, b].map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t){ const A = hexToRgb(a), C = hexToRgb(b); return rgbToHex(A[0] + (C[0] - A[0]) * t, A[1] + (C[1] - A[1]) * t, A[2] + (C[2] - A[2]) * t); }
function lum(h){ const [r, g, b] = hexToRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; }
const lighten = (c, t) => mix(c, '#ffffff', t);
const normHex = h => { const [r, g, b] = hexToRgb(h); return rgbToHex(r, g, b); };

/* ===== look normalisation ===== */
const ENUMS = {
  ear: ['pointy','big','small','floppy','long','semi','fold'],
  coat: ['smooth','fluffy','curly','long'],
  muzzle: ['short','medium','long'],
  tail: ['curl','plume','straight','stub','long','fluffy'],
  face: ['muzzle','lower','mask','hachiware','blaze'],
  legs: ['normal','short'],
};
function normalizeLook(raw){
  raw = raw || {};
  const sp = raw.species === 'cat' ? 'cat' : 'dog';
  let preset = BREED_BY_ID[raw.breedId];
  if (!preset || preset.sp !== sp) preset = BREED_BY_ID[sp === 'cat' ? 'mix_cat' : 'mix_dog'];
  const P = preset.look;
  const L = { species: sp, breedId: (BREED_BY_ID[raw.breedId] ? raw.breedId : preset.id) };
  for (const k in ENUMS) L[k] = ENUMS[k].includes(raw[k]) ? raw[k] : P[k];
  const useRaw = raw.colors && isHex(raw.colors.main);
  const src = useRaw ? raw.colors : P.colors;
  const srcM = useRaw ? (raw.marks || {}) : (P.marks || {});
  const hx = (v, d) => isHex(v) ? normHex(v) : d;
  const c = {};
  c.main = hx(src.main, '#C9A27A');
  c.body = hx(src.body, c.main);
  c.ear = hx(src.ear, c.main);
  c.tail = hx(src.tail, c.body);
  c.face = hx(src.face, c.main);
  c.chest = hx(src.chest, c.face === c.main ? c.body : c.face);
  c.paws = hx(src.paws, c.body);
  c.tailTip = hx(src.tailTip, null);
  c.eye = hx(src.eye, sp === 'cat' ? '#E3B04A' : '#2B1E1A');
  c.nose = hx(src.nose, sp === 'cat' ? (lum(c.main) < .06 ? '#5A4650' : '#F0A0AA') : '#2E2328');
  const m = {};
  for (const k of ['stripes','spots','patchL','patchR','brows','mask','saddle']) m[k] = hx(srcM[k], null);
  m.bodyPatch = !!srcM.bodyPatch && !!(m.patchL || m.patchR);
  L.colors = c; L.marks = m;
  return L;
}

/* ===== geometry helpers ===== */
const f1 = n => Math.round(n * 10) / 10;
function ellD(cx, cy, rx, ry){ return `M${f1(cx - rx)} ${f1(cy)}a${rx} ${ry} 0 1 0 ${f1(2 * rx)} 0a${rx} ${ry} 0 1 0 ${f1(-2 * rx)} 0Z`; }
function blob(cx, cy, rx, ry, n, amp){
  let d = '';
  const k = 1 + amp * 2.2;
  for (let i = 0; i < n; i++){
    const a0 = -Math.PI / 2 + i / n * 2 * Math.PI, a1 = -Math.PI / 2 + (i + 1) / n * 2 * Math.PI, am = (a0 + a1) / 2;

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const now = () => Date.now();
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
const STORE_KEY = 'uchinoko-biyori:v1';
const BOWL = { x:24, y:93 }, BED = { x:76, y:84 };
let S = null;

const CL = window.claude && typeof window.claude.use === 'function' ? window.claude : null;
const useCap = name => CL ? CL.use(name).catch(() => null) : Promise.resolve(null);

/* ----- state ----- */
function newState(pet){
  const t = now();
  return { v:1, pet, stats:{ full:72, mood:78, love:0 }, counts:{ meals:0, treats:0, pets:0, plays:0 }, recentTreats:[], last:t, created:t, updated:t };
}
function decay(t = now()){
  if (!S) return;
  const hrs = Math.max(0, (t - (S.last || t)) / 3.6e6);
  const s = S.stats;
  s.full = clamp(s.full - hrs * 8, 0, 100);
  s.mood = clamp(s.mood - hrs * 5 - (s.full < 25 ? hrs * 4 : 0), 0, 100);
  S.last = t;
}
function levelInfo(love){
  let lv = 1, acc = 0, need = 20;
  while (lv < MAX_LV && love >= acc + need){ acc += need; lv++; need = 20 + (lv - 1) * 5; }
  const max = lv >= MAX_LV;
  return { lv, into:max ? need : love - acc, need, max };
}
function petWear(){
  if (!S.pet.wear){ S.pet.wear = wearFrom(S.pet); delete S.pet.acc; }
  for (const k of ['head','face','neck']){
    const v = S.pet.wear[k];
    if (v && WEAR_RENAMED[v]) S.pet.wear[k] = WEAR_RENAMED[v];
    else if (v && !WEAR_BY_ID[v]) S.pet.wear[k] = null;
  }
  return S.pet.wear;
}
function nextupHtml(nx){
  return `<p class="nextup"><span class="nx-head">つぎのごほうび</span><span class="nx-body"><b>Lv.${nx.lv}</b> <span class="nx-item">${esc(nx.ja)}</span></span></p>`;
}
function nextReward(lv){
  const items = [];
  (TREATS[S.pet.species] || []).forEach(t => { if (t.lv > lv) items.push({ lv:t.lv, ja:'おやつ「' + t.ja + '」' }); });
  WEAR.forEach(w => { if (w.lv > lv) items.push({ lv:w.lv, ja:'きせかえ「' + w.ja + '」' }); });
  DECOR_CATS.forEach(([k]) => DECOR[k].forEach(d => { if (d.lv > lv) items.push({ lv:d.lv, ja:'もようがえ「' + d.ja + '」' }); }));
  (TRICKS[S.pet.species] || []).forEach(t => { if (t.lv > lv) items.push({ lv:t.lv, ja:'げい「' + t.ja + '」' }); });
  items.sort((a, b) => a.lv - b.lv);
  return items[0] || null;
}

/* ----- saving: private per-person doc in db, mirrored to this browser ----- */
const Persist = {
  ref:null, mode:'local', timer:null, writing:false, again:false,
  loadLocal(){ try { const t = localStorage.getItem(STORE_KEY); const v = t ? JSON.parse(t) : null; return v && v.pet ? v : null; } catch(e){ return null; } },
  saveLocal(){ try { if (S) localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){} },
  schedule(){
    if (!S) return;
    S.updated = now();
    this.saveLocal();
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 1200);
  },
  async flush(){
    if (!this.ref || !S) return;
    if (this.writing){ this.again = true; return; }
    this.writing = true;
    try { await this.ref.set(JSON.parse(JSON.stringify(S))); this.mode = 'cloud'; }
    catch(e){
      const code = e && e.code;
      if (code === 'unavailable'){ setTimeout(() => this.flush(), 1500 + Math.random() * 1500); }
      else { this.ref = null; this.mode = 'local'; }
    }
    this.writing = false;
    if (this.again){ this.again = false; this.flush(); }
  },
  async connect(){
    const [db, user] = await Promise.all([useCap('db'), useCap('user')]);
    if (!db || !user) return;
    let uid = null;
    try { uid = await user.id(); } catch(e){}
    if (!uid) return;
    try {
      const ref = db.doc('data/users/' + uid + '/pet');
      const snap = await ref.get();
      this.ref = ref; this.mode = 'cloud';
      const remote = snap.exists ? snap.data() : null;
      if (remote && remote.pet && (!S || (remote.updated || 0) > (S.updated || 0))){
        S = JSON.parse(JSON.stringify(remote));
        this.saveLocal();
        Game.onStateReplaced();
      } else if (S && (!remote || (S.updated || 0) > (remote.updated || 0))){
        this.flush();
      }
    } catch(e){ this.ref = null; this.mode = 'local'; }
  },
};

/* ----- small fx ----- */
const stage = $('#stage');
function stageXY(clientX, clientY){
  const r = stage.getBoundingClientRect();
  return { x:clientX - r.left, y:clientY - r.top };
}
function fx(cls, x, y, html, style){
  const el = document.createElement('div');
  el.className = 'fx ' + cls;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  if (style) for (const k in style) el.style.setProperty(k, style[k]);
  if (html) el.innerHTML = html;
  stage.appendChild(el);
  setTimeout(() => el.remove(), 2600);
  return el;
}

/* ----- time of day ----- */
function tod(){
  const h = new Date().getHours();
  if (h >= 5 && h < 9) return 'morning';
  if (h >= 9 && h < 16) return 'day';
  if (h >= 16 && h < 19) return 'evening';
  return 'night';
}
function updateClock(){
  const d = new Date(), h = d.getHours() % 12, m = d.getMinutes();
  $('#clockH').style.transform = `rotate(${h * 30 + m * .5}deg)`;
  $('#clockM').style.transform = `rotate(${m * 6}deg)`;
  stage.dataset.tod = tod();
}

/* ----- the pet on stage ----- */
const Pet = {
  el: $('#pet'), x:50, y:80, busy:false, sleeping:false, expr:null, tok:0, sayT:null, wakeUntil:0,
  scaleAt(y){ return .84 + clamp((y - 66) / 24, 0, 1) * .22; },
  apply(){
    this.el.style.left = this.x + '%';
    this.el.style.top = this.y + '%';
    this.el.style.zIndex = String(10 + Math.round(this.y));
    this.el.style.setProperty('--s', this.scaleAt(this.y).toFixed(3));
  },
  mount(){
    $('#petArt').innerHTML = renderPet(S.pet.look, { wear:petWear() });
    this.apply();
    this.setExpr(this.expr);
  },
  headPoint(){
    const r = this.el.getBoundingClientRect(), s = stage.getBoundingClientRect();
    return { x:r.left - s.left + r.width / 2, y:r.top - s.top + r.height * .38 };
  },
  mouthPoint(){
    const r = this.el.getBoundingClientRect(), s = stage.getBoundingClientRect();
    return { x:r.left - s.left + r.width / 2, y:r.top - s.top + r.height * .52 };
  },
  baseExpr(){
    if (this.sleeping) return 'sleep';
    if (S && (S.stats.full < 25 || S.stats.mood < 28)) return 'sad';
    return null;
  },
  setExpr(e){
    this.expr = e;
    const cur = e || this.baseExpr();
    this.el.classList.remove('ex-happy', 'ex-eat', 'ex-sleep', 'ex-sad');
    if (cur) this.el.classList.add('ex-' + cur);
  },
  flash(e, ms){ this.setExpr(e); clearTimeout(this.flashT); this.flashT = setTimeout(() => this.setExpr(null), ms); },
  say(text, ms = 2400){

    b.textContent = text; b.classList.add('show');
    clearTimeout(this.sayT); this.sayT = setTimeout(() => b.classList.remove('show'), ms);
  },
  moveTo(x, y, speed = 1){
    const d = Math.hypot(x - this.x, (y - this.y) * 1.6);
    const ms = Math.max(260, d * 36 / speed);
    const tok = ++this.tok;
    this.el.style.transition = `left ${ms}ms linear, top ${ms}ms linear, transform ${ms}ms linear`;
    this.el.classList.add('walking');
    this.el.classList.toggle('dir-l', x < this.x);
    this.x = x; this.y = y; this.apply();
    return sleep(ms).then(() => { if (tok === this.tok) this.el.classList.remove('walking'); });
  },
  jump(){ this.el.classList.remove('jump'); void this.el.offsetWidth; this.el.classList.add('jump'); setTimeout(() => this.el.classList.remove('jump'), 520); },
  tilt(){ this.el.classList.remove('tilt'); void this.el.offsetWidth; this.el.classList.add('tilt'); setTimeout(() => this.el.classList.remove('tilt'), 1000); },

  },
  wake(stay = 25000){
    this.wakeUntil = now() + stay;
    if (!this.sleeping) return false;
    this.sleeping = false;

};

/* ----- idle life ----- */
let idleT = null, lastChat = 0, dragging = false;
function idleTick(delay){
  clearTimeout(idleT);
  idleT = setTimeout(idleStep, delay != null ? delay : 3200 + Math.random() * 5200);
}
async function idleStep(){
  if (!S || Pet.busy || dragging || document.hidden) return idleTick();
  const night = stage.dataset.tod === 'night';
  if (Pet.sleeping){
    if (!night && Math.random() < .35){ Pet.wake(); Pet.say(pick(['ふぁ〜あ','よくねた〜'])); }
    return idleTick();
  }
  if (now() > Pet.wakeUntil && (night ? Math.random() < .55 : Math.random() < .05)){
    await Pet.moveTo(BED.x, BED.y - 1, .8);
    if (!Pet.busy) Pet.sleep();
    return idleTick(night ? 20000 : 14000 + Math.random() * 10000);
  }
  const r = Math.random();
  if (r < .5){
    const tx = 22 + Math.random() * 56, ty = 70 + Math.random() * 18;
    await Pet.moveTo(tx, ty, .7 + Math.random() * .4);
  } else if (r < .66){
    Pet.tilt();
  } else if (r < .78 && S.stats.mood > 60){
    Pet.jump(); Pet.flash('happy', 1000); Pet.wag(1200);
  } else if (now() - lastChat > 30000){
    lastChat = now();
    Pet.say(ambientLine());
  }
  idleTick();
}
function ambientLine(){
  const s = S.stats, cat = S.pet.species === 'cat', t = stage.dataset.tod;
  if (s.full < 25) return pick(['おなかすいたな…','ごはん、まだかな','ぐぅ〜']);
  if (s.mood < 30) return pick(['かまってほしいな','なでてほしいな…','あそぼ？']);
  const h = Features.hint(); if (h) return h;
  if (t === 'morning') return pick(['おはよう！','いい朝だね', cat ? 'にゃ〜ん' : 'わん！']);
  if (t === 'night') return pick(['ねむねむ…','そろそろ寝よっか','おやすみの時間？']);
  if (t === 'evening') return pick(['ゆうやけ、きれいだね','おかえり！','おつかれさま']);
  return pick(cat ? ['にゃ〜','ゴロゴロ…','ひなたぼっこしたいな','♪'] : ['わん！','しっぽぶんぶん','おさんぽ行きたいな','♪']);
}

/* ----- care actions ----- */
function commit(){ Persist.schedule(); renderStats(); }
function gainLove(n){
  const before = levelInfo(S.stats.love).lv;
  S.stats.love = Math.round((S.stats.love + n) * 10) / 10;
  const after = levelInfo(S.stats.love).lv;
  if (after > before){
    for (let lv = before + 1; lv <= after; lv++){
      const t = TITLES.find(([l]) => l === lv);
      if (lv <= 5 || lv % 5 === 0 || t) addAlbum('lv', `なかよしLv ${lv}`, t ? `あたらしい関係「${t[1]}」` : `${S.pet.name}と さらになかよくなった`, 'lv');
    }
    setTimeout(() => celebrate(after, before), 900);
  }
}

  if (!S || Pet.busy) return false;

}

/* ----- stroking & tapping ----- */
const strokeBudget = { left:12, t:now() };
let drag = null, strokeT = null;
function strokeGain(){
  const mins = (now() - strokeBudget.t) / 60000;
  strokeBudget.left = Math.min(12, strokeBudget.left + mins / 3);
  strokeBudget.t = now();
  if (strokeBudget.left >= 1){ strokeBudget.left -= 1; return 1; }
  return 0;
}
function onStroke(e){
  if (!S) return;
  decay();
  const p = stageXY(e.clientX, e.clientY);
  heartAt(p.x, p.y - 10);
  S.stats.mood = clamp(S.stats.mood + 1.5, 0, 100);
  const g = strokeGain();
  if (g) gainLove(g * .6);
  track('pet');
  if (!Pet.sleeping && !Pet.busy){ Pet.setExpr('happy'); Pet.wag(1600); }
  $('#hint').hidden = true;
  renderStats();
  clearTimeout(strokeT);
  strokeT = setTimeout(() => {
    if (!Pet.busy && !Pet.sleeping){
      Pet.setExpr(null);
      Pet.say(pick(S.pet.species === 'cat' ? ['ゴロゴロ…','きもちいい〜','もっとなでて'] : ['うれしい！','きもちいい〜','もっとなでて！']));
    }
    S.counts.pets++;
    commit();
  }, 700);
}
function onTap(){
  if (!S) return;
  if (Pet.sleeping){
    Pet.wake(); Pet.say('ふぁ〜あ…おはよう'); Pet.tilt();
    idleTick(5000);
    return;
  }
  if (Pet.busy) return;
  Pet.jump(); Pet.tilt(); Pet.wag(1200);
  Pet.say(pick(S.pet.species === 'cat' ? ['にゃ？','にゃーん','なあに？'] : ['ワン！','わふっ','なあに？']), 1600);
  idleTick(4000);
}
Pet.el.addEventListener('pointerdown', e => {
  if (!S) return;
  drag = { x:e.clientX, y:e.clientY, dist:0, acc:0 };
  dragging = true;
  try { Pet.el.setPointerCapture(e.pointerId); } catch(_){}
});
Pet.el.addEventListener('pointermove', e => {
  if (!drag) return;
  const d = Math.hypot(e.clientX - drag.x, e.clientY - drag.y);
  drag.x = e.clientX; drag.y = e.clientY; drag.dist += d; drag.acc += d;
  if (drag.acc > 55){ drag.acc = 0; onStroke(e); }
});
const endDrag = () => {
  if (!drag) return;
  const tap = drag.dist < 12;
  drag = null; dragging = false;
  if (tap) onTap();
};
Pet.el.addEventListener('pointerup', endDrag);
Pet.el.addEventListener('pointercancel', () => { drag = null; dragging = false; });
Pet.el.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    const r = Pet.el.getBoundingClientRect();
    onStroke({ clientX:r.left + r.width / 2, clientY:r.top + r.height * .35 });
  }
});

/* ----- level up ----- */
function unlocksBetween(from, to){
  const list = [];
  (TREATS[S.pet.species] || []).forEach(t => { if (t.lv > from && t.lv <= to) list.push('おやつ「' + t.ja + '」'); });
  WEAR.forEach(w => { if (w.lv > from && w.lv <= to) list.push('きせかえ「' + w.ja + '」'); });
  DECOR_CATS.forEach(([k]) => DECOR[k].forEach(d => { if (d.lv > from && d.lv <= to && d.lv > 1) list.push('もようがえ「' + d.ja + '」'); }));
  (TRICKS[S.pet.species] || []).forEach(t => { if (t.lv > from && t.lv <= to && t.lv > 1) list.push('げい「' + t.ja + '」'); });
  return list;
}
function celebrate(lv, before){
  const items = unlocksBetween(before == null ? lv - 1 : before, lv);
  const newTitle = TITLES.some(([l]) => l === lv || (before != null && l > before && l <= lv));
  const nx = lv < MAX_LV ? nextReward(lv) : null;
  Modal.show({
    label:'なかよしレベルアップ', confetti:true,
    html:() => `<div class="mpet ex-happy wag-fast">${renderPet(S.pet.look, { wear:petWear() })}</div>
    <h3>${lv >= MAX_LV ? 'なかよしMAX！' : 'なかよしLv ' + lv}</h3><p>${esc(S.pet.name)}とさらになかよくなりました${newTitle ? `<br>あたらしい関係「${esc(titleFor(lv))}」` : ''}</p>
    ${items.length ? `<ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : ''}
    ${nx ? nextupHtml(nx) : ''}
    <button class="btn primary" type="button" data-close>やったね</button>`,
  });
}

/* ----- move code: carry a pet to another place ----- */
const MOVE_PREFIX = 'UCHINOKO2:';
function encodeMoveCode(){
  const bytes = new TextEncoder().encode(JSON.stringify(S));
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  const b64 = btoa(bin);
  return MOVE_PREFIX + b64.length + ':' + b64;
}
/* returns { st } on success, or { reason:'empty'|'noprefix'|'short'|'broken', got, need } */
function readMoveCode(text){
  const raw = String(text || '');
  const t = raw.replace(/[\s​-‍﻿]+/g, '');
  if (!t) return { reason:'empty', got:0 };
  const m = t.match(/UCHINOKO([12]):(?:(\d+):)?([A-Za-z0-9+/=]*)/);
  if (!m) return { reason:'noprefix', got:t.length };
  let b64 = m[3];
  const need = m[2] ? Number(m[2]) : 0;
  if (need && b64.length < need) return { reason:'short', got:b64.length, need };
  if (need) b64 = b64.slice(0, need);
  const st = decodeMovePayload(b64);
  return st ? { st } : { reason:'broken', got:b64.length, need };
}
function decodeMoveCode(text){ return readMoveCode(text).st || null; }
function moveErrorText(r){
  const n = v => Number(v || 0).toLocaleString('ja-JP');
  if (r.reason === 'empty') return 'コードが空っぽです。コピーしたコードを貼りつけてから押してね。';
  if (r.reason === 'noprefix') return `「UCHINOKO」ではじまるコードが見つかりませんでした（貼りつけた文字数：${n(r.got)}）。コピーがうまくいっていないかもしれません。「ファイルで保存」の方法もためしてみてね。`;
  if (r.reason === 'short') return `コードが途中で切れています（${n(r.need)}文字のうち${n(r.got)}文字）。もう一度まるごとコピーするか、「ファイルで保存」の方法をためしてみてね。`;
  return `コードを読みとれませんでした（${n(r.got)}文字）。もう一度コピーし直してみてね。`;
}
function decodeMovePayload(b64){

    const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
    const o = JSON.parse(new TextDecoder().decode(bytes));
    if (!o || typeof o !== 'object' || !o.pet || !o.stats) return null;
    const num = (v, d, lo, hi) => { v = Number(v); return Number.isFinite(v) ? clamp(v, lo, hi) : d; };
    const p = o.pet, look = normalizeLook(p.look || p);
    const photo = typeof p.photo === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p.photo) && p.photo.length < 400000 ? p.photo : null;
    const wear = wearFrom(p);
    for (const k of ['head','face','neck']){ const v = wear[k]; if (v && WEAR_RENAMED[v]) wear[k] = WEAR_RENAMED[v]; else if (v && !WEAR_BY_ID[v]) wear[k] = null; }
    const c = o.counts || {};
    const t0 = now();
    const st = {
      v:1,
      pet:{ name:String(p.name || 'うちのこ').slice(0, 10), species:look.species, breedId:look.breedId, look, photo,
            colorName:typeof p.colorName === 'string' ? p.colorName.slice(0, 14) : '', wear },
      stats:{ full:num(o.stats.full, 70, 0, 100), mood:num(o.stats.mood, 70, 0, 100), love:num(o.stats.love, 0, 0, 1e7) },
      counts:{ meals:num(c.meals, 0, 0, 1e9), treats:num(c.treats, 0, 0, 1e9), pets:num(c.pets, 0, 0, 1e9), plays:num(c.plays, 0, 0, 1e9) },
      recentTreats:[], last:t0, created:num(o.created, t0, 0, t0), updated:t0,

    return carryExtras(o, st);
  } catch(e){ return null; }
}
const MOVE_FILE = 'uchinoko-hikkoshi.txt';
/* copy: async clipboard, then the older copy command, then leave the text selected */
async function copyText(el){
  try { if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(el.value); return 'copied'; } } catch(e){}
  try {
    el.removeAttribute('readonly'); el.focus(); el.setSelectionRange(0, el.value.length);
    if (document.execCommand && document.execCommand('copy')) return 'copied';
  } catch(e){}
  try { el.focus(); el.setSelectionRange(0, el.value.length); } catch(e){}
  return 'selected';
}
/* save the code as a small text file: Claude's download prompt, the share sheet, or a plain download */
async function saveMoveFile(code){
  if (!HOME){
    const dl = await useCap('downloads');
    if (!dl) return 'unavailable';
    try { await dl.save({ filename:MOVE_FILE, data:code }); return 'saved'; }
    catch(e){ return e && e.code === 'declined' ? 'declined' : 'unavailable'; }
  }
  try {
    const file = new File([code], MOVE_FILE, { type:'text/plain' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:'うちのこ日和 引っこしコード' }); return 'saved'; }
  } catch(e){ if (e && e.name === 'AbortError') return 'declined'; }
  try {
    const url = URL.createObjectURL(new Blob([code], { type:'text/plain' }));
    const a = document.createElement('a'); a.href = url; a.download = MOVE_FILE; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return 'saved';
  } catch(e){ return 'unavailable'; }
}
function readTextFile(file){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result || '')); r.onerror = rej; r.readAsText(file); });
}

/* ===== shared helpers ===== */
function dayKey(t){
  const d = t == null ? new Date() : (t instanceof Date ? t : new Date(t));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const fmtMD = t => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate(); };
const daysBetween = (a, b) => Math.floor((new Date(dayKey(b)) - new Date(dayKey(a))) / 864e5);
const findDecor = (cat, id) => DECOR[cat].find(d => d.id === id) || DECOR[cat][0];
const lvNow = () => levelInfo(S.stats.love).lv;
const isCat = () => S && S.pet.species === 'cat';

/* ===== state upgrade (old saves gain the new fields) ===== */
function ensureState(st){
  if (!st) return st;
  const obj = v => v && typeof v === 'object' && !Array.isArray(v);
  st.room = Object.assign({}, ROOM_DEFAULT, obj(st.room) ? st.room : {});
  for (const [cat] of DECOR_CATS) if (!DECOR[cat].some(d => d.id === st.room[cat])) st.room[cat] = ROOM_DEFAULT[cat];
  st.room.season = st.room.season !== false;
  st.tricks = obj(st.tricks) ? st.tricks : {};
  st.daily = obj(st.daily) && Array.isArray(st.daily.list) ? st.daily : null;
  st.stamps = Array.isArray(st.stamps) ? st.stamps.filter(x => typeof x === 'string').slice(-1000) : [];
  st.streak = obj(st.streak) ? st.streak : { last:null, n:0, best:0 };
  st.souv = obj(st.souv) ? st.souv : {};
  st.souv.have = obj(st.souv.have) ? st.souv.have : {};
  st.events = obj(st.events) ? st.events : {};
  st.events.got = Array.isArray(st.events.got) ? st.events.got.filter(id => WEAR_BY_ID[id]) : [];
  st.events.seen = obj(st.events.seen) ? st.events.seen : {};
  st.album = Array.isArray(st.album) ? st.album.filter(a => a && typeof a.t === 'number' && typeof a.ti === 'string').slice(0, 300) : [];
  st.album.forEach(a => { if (a.k === 'trick' || /^芸/.test(a.ti)) a.ti = a.ti.replace(/芸/g, 'げい'); });
  st.milestones = obj(st.milestones) ? st.milestones : {};
  st.trickDay = obj(st.trickDay) ? st.trickDay : { day:null, love:0 };
  if (!obj(st.firsts) || !st.firsts._init){
    const c = st.counts || {};
    st.firsts = { _init:true, meal:c.meals > 0, treat:c.treats > 0, play:c.plays > 0, pet:c.pets > 0, room:false, wear:{} };
    const w = st.pet && st.pet.wear;
    if (w) for (const k of ['head','face','neck']) if (w[k]) st.firsts.wear[w[k]] = true;
  }
  st.firsts.wear = obj(st.firsts.wear) ? st.firsts.wear : {};
  return st;
}
/* the subset of a move code that is safe to carry over */
function carryExtras(o, st){
  const src = ensureState(JSON.parse(JSON.stringify({
    room:o.room, tricks:o.tricks, daily:null, stamps:o.stamps, streak:o.streak, souv:o.souv, events:o.events,
    album:o.album, milestones:o.milestones, firsts:o.firsts, counts:st.counts, pet:st.pet,
  })));
  const tricks = {};
  for (const [k, v] of Object.entries(src.tricks)) if (v && typeof v === 'object') tricks[k] = { p:clamp(Number(v.p) || 0, 0, 99), ok:!!v.ok };
  const have = {};
  for (const [k, v] of Object.entries(src.souv.have)) if (SOUV_BY_ID[k]) have[k] = clamp(Number(v) || 0, 0, 1e6);
  st.room = src.room;
  st.tricks = tricks;
  st.stamps = src.stamps.filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x));
  st.streak = { last:typeof src.streak.last === 'string' ? src.streak.last : null, n:clamp(Number(src.streak.n) || 0, 0, 1e5), best:clamp(Number(src.streak.best) || 0, 0, 1e5) };
  st.souv = { have, day:null, n:0 };
  st.events = { got:src.events.got, seen:Object.fromEntries(Object.entries(src.events.seen).filter(([k]) => /^[a-z]+:\d{4}$/.test(k)).map(([k, v]) => [k, Number(v) || 1])) };
  st.album = src.album.map(a => ({ t:a.t, k:String(a.k || '').slice(0, 20), ti:a.ti.slice(0, 40), su:String(a.su || '').slice(0, 80), ic:String(a.ic || '').slice(0, 40) }));
  st.milestones = Object.fromEntries(Object.entries(src.milestones).filter(([k]) => /^[a-z0-9:_-]{1,30}$/.test(k)).map(([k, v]) => [k, !!v]));
  st.firsts = src.firsts;
  return ensureState(st);
}

/* ===== popups, one at a time ===== */
const Modal = {
  q:[], busy:false,
  show(spec){ return new Promise(res => { this.q.push({ spec, res }); this.next(); }); },
  next(){
    if (this.busy || !this.q.length) return;
    const { spec, res } = this.q.shift();
    this.busy = true;
    const back = document.activeElement;
    const box = document.createElement('div');
    box.className = 'levelup';
    box.innerHTML = `<div class="card ${spec.cls || ''}" role="dialog" aria-modal="true" aria-label="${esc(spec.label || 'おしらせ')}">${typeof spec.html === 'function' ? spec.html() : spec.html}</div>`;
    document.body.appendChild(box);
    let done = false;
    const onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); close(null); } };
    const close = val => {
      if (done) return; done = true;
      document.removeEventListener('keydown', onKey, true);
      box.classList.add('closing');
      setTimeout(() => { box.remove(); this.busy = false; res(val); this.next(); }, 200);
      if (back && back.focus) try { back.focus(); } catch(e){}
    };
    box.addEventListener('click', e => { if (e.target === box) close(null); });
    document.addEventListener('keydown', onKey, true);
    box.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => close(b.dataset.close || true)));
    if (spec.ready) spec.ready(box, close);
    if (spec.confetti) confettiIn(box);
    const f = box.querySelector('.btn.primary') || box.querySelector('button');
    if (f) f.focus();
  },
};
function confettiIn(box){
  const cols = ['#F0728E','#F5C562','#6FABE3','#7CC28F','#B8A6EC'];
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  for (let i = 0; i < 30; i++){
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 140;
    const el = document.createElement('div');
    el.className = 'fx spark';
    el.style.left = cx + 'px'; el.style.top = cy + 'px'; el.style.background = cols[i % cols.length];
    el.style.setProperty('--dx', (Math.cos(a) * d).toFixed(0) + 'px');
    el.style.setProperty('--dy', (Math.sin(a) * d).toFixed(0) + 'px');
    box.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }
}

/* ===== tracking: care actions feed requests and memories ===== */
function track(type, data = {}){
  if (!S) return;
  ensureDaily();
  for (const r of S.daily.list){
    if (r.done) continue;
    const hit = r.type === 'treatId' ? (type === 'treat' && data.id === r.id) : r.type === type;
    if (!hit) continue;
    r.got = Math.min(r.n, r.got + 1);
    if (r.got >= r.n){ r.done = true; reqComplete(r); }
  }
  if (type === 'meal') first('meal', 'はじめてのごはん', 'おいしそうに たべたね', 'meal');
  if (type === 'treat') first('treat', 'はじめてのおやつ', `「${data.ja}」をあげた`, 'treat:' + data.id);
  if (type === 'play') first('play', 'はじめてのあそび', isCat() ? '毛糸玉で じゃれたね' : 'ボールを おいかけたね', 'play');
  if (type === 'pet') first('pet', 'はじめてのなでなで', 'うれしそうだったね', 'pet');
  if (type === 'dress' && data.id && !S.firsts.wear[data.id]){
    S.firsts.wear[data.id] = true;
    const w = WEAR_BY_ID[data.id];
    if (w) addAlbum('wear', `はじめての${w.ja.replace(/（.*?）/, '')}`, `${w.ja}、にあってるね`, 'dress');

}

function reqText(r){
  switch (r.type){
    case 'meal': return `ごはんを${r.n}回たべたい`;
    case 'treat': return r.n > 1 ? `おやつを${r.n}こ ほしい` : 'おやつが ほしい';
    case 'treatId': { const t = allTreats().find(x => x.id === r.id); return `「${t ? t.ja : 'おやつ'}」が たべたい`; }
    case 'play': return isCat() ? `毛糸玉で${r.n}回 あそびたい` : `ボールで${r.n}回 あそびたい`;
    case 'pet': return `${r.n}回 なでなでしてほしい`;
    case 'trick': return `げいを${r.n}回 見せたい`;
    case 'dress': return 'きせかえ してほしい';
    case 'room': return 'もようがえ してみたい';
  }
  return '';
}
const REQ_ICON = { meal:'meal', treat:'treat', treatId:'treat', play:'play', pet:'pet', trick:'trick', dress:'dress', room:'room' };
function genDaily(day){
  const r = rng(hashStr(day + ':' + (S.created || 0)));
  const lv = lvNow();
  const unlocked = (TREATS[S.pet.species] || []).filter(t => t.lv <= lv);
  const pool = [
    () => ({ type:'meal', n:2 }),
    () => r() < .5 ? { type:'treat', n:1 + (r() < .4 ? 1 : 0) } : { type:'treatId', n:1, id:unlocked[Math.floor(r() * unlocked.length)].id },
    () => ({ type:'play', n:2 + (r() < .4 ? 1 : 0) }),
    () => ({ type:'pet', n:[10, 12, 15, 20][Math.floor(r() * 4)] }),
    () => ({ type:'trick', n:2 + (r() < .3 ? 1 : 0) }),
  ];
  if (lv >= 2) pool.push(() => ({ type:'dress', n:1 }));
  if (lv >= 4) pool.push(() => ({ type:'room', n:1 }));
  const list = [], used = new Set();
  let guard = 0;
  while (list.length < 3 && guard++ < 50){
    const i = Math.floor(r() * pool.length);
    if (used.has(i)) continue;
    used.add(i);
    list.push(Object.assign({ got:0, done:false }, pool[i]()));
  }
  return { day, list, all:false };
}
function ensureDaily(){
  const d = dayKey();
  if (!S.daily || S.daily.day !== d) S.daily = genDaily(d);
  return S.daily;
}
function reqLeft(){ ensureDaily(); return S.daily.list.filter(r => !r.done).length; }

}
function reqComplete(r){

/* ===== おるすばんのおみやげ ===== */
function maybeSouvenir(away){
  if (!S || !(away >= 3 * 3600e3)) return;
  const day = dayKey();
  if (S.souv.day !== day){ S.souv.day = day; S.souv.n = 0; }
  if (S.souv.n >= 3) return;
  S.souv.n++;
  const season = seasonOf();
  const pool = SOUVENIRS.filter(s => s.seasons === 'all' || s.seasons.split(' ').includes(season));
  const wt = s => ({ 1:10, 2:5, 3:2.2, 4:1, 5:.45 }[s.rare] || 1) * (S.souv.have[s.id] ? 1 : 1.6);
  let x = Math.random() * pool.reduce((a, s) => a + wt(s), 0), pickS = pool[0];
  for (const s of pool){ x -= wt(s); if (x <= 0){ pickS = s; break; } }
  const isNew = !S.souv.have[pickS.id];
  S.souv.have[pickS.id] = (S.souv.have[pickS.id] || 0) + 1;
  const bonus = away >= 12 * 3600e3 ? 4 : 2;
  if (isNew) addAlbum('souv', `おみやげ「${pickS.ja}」`, pickS.line, 'souv:' + pickS.id);
  Persist.schedule();
  Modal.show({
    label:'おるすばんのおみやげ',
    html:() => `<div class="souvwrap">${petCard()}<div class="souvitem"><svg viewBox="0 0 48 48" aria-hidden="true">${souvenirIcon(pickS.icon)}</svg>${isNew ? '<span class="newpill">NEW</span>' : ''}</div></div>
      <h3>おるすばん ありがとう！</h3>
      <p>${esc(S.pet.name)}が ${isCat() ? 'ねこのパトロール' : 'おさんぽ'}で<br><b>「${esc(pickS.ja)}」</b>を見つけてきたよ</p>
      <p class="quote">「${esc(pickS.line)}」</p>
      <p class="gainline">♥+${bonus}</p>
      <button class="btn primary" type="button" data-close>ありがとう</button>`,
  }).then(() => { gainLove(bonus); commit(); });
}

function checkMilestones(){
  if (!S || !S.created) return;
  const days = daysBetween(S.created, now());

  if (years >= 1 && d.getMonth() === c.getMonth() && d.getDate() === c.getDate() && !S.milestones['anniv' + years]){

function applyRoom(){
  if (!S) return;
  const R = S.room;
  const W = findDecor('wall', R.wall), F = findDecor('floor', R.floor), G = findDecor('rug', R.rug), B = findDecor('bed', R.bed), V = findDecor('view', R.view);
  $('.wall').style.background = wallBg(W);
  $('.floor').style.background = floorBg(F);
  const rug = $('.rug');
  rug.hidden = !!G.none;
  rug.style.background = rugBg(G);
  stage.style.setProperty('--bed', B.c); stage.style.setProperty('--bedI', B.i); stage.style.setProperty('--bedL', B.l);
  $('#viewArt').innerHTML = viewSvg(V.id);
  stage.dataset.walldark = W.id === 'starry' ? '1' : '';
  renderSeason();
}
function renderSeason(){
  const box = $('#evDeco'), hang = $('#evHang'), weather = $('#weather');
  const ev = S && S.room.season ? activeEvent() : null;
  const sd = ev ? SEASON_DECOR[ev.decor] : null;
  box.innerHTML = sd ? `${sd.g ? `<div class="gl">${garland(sd.g[0], sd.g[1])}</div>` : ''}<div class="evitem">${sd.item}</div>` : '';
  hang.innerHTML = sd && sd.hang ? sd.hang : (ev && ev.decor === 'tsuyu' ? SEASON_DECOR.tsuyu.item : '');
  if (ev && ev.decor === 'tsuyu'){ box.querySelector('.evitem') && box.querySelector('.evitem').remove(); }
  const w = S && S.room.season ? weatherOf() : null;
  weather.className = 'weather' + (w ? ' w-' + w : '');
  stage.dataset.event = ev ? ev.id : '';
}

let roomCat = 'wall';
function roomSwatch(cat, d){
  if (cat === 'wall') return `<span class="rsw" style="background:${wallBg(d)}"></span>`;
  if (cat === 'floor') return `<span class="rsw" style="background:${floorBg(d)}"></span>`;
  if (cat === 'rug') return `<span class="rsw rsw-floor"><i class="rsw-rug" style="background:${d.none ? 'transparent' : rugBg(d)};${d.none ? 'box-shadow:inset 0 0 0 2px rgba(0,0,0,.15);' : ''}"></i></span>`;
  if (cat === 'bed') return `<span class="rsw rsw-floor"><svg viewBox="0 0 200 90" class="rsw-bed"><ellipse cx="100" cy="52" rx="95" ry="34" style="fill:${d.c};stroke:${d.l}" stroke-width="5"/><ellipse cx="100" cy="47" rx="70" ry="22" style="fill:${d.i}"/></svg></span>`;
  return `<span class="rsw rsw-win"><svg viewBox="0 0 100 128" preserveAspectRatio="xMidYMax slice">${viewSvg(d.id)}</svg></span>`;
}
function roomTabHtml(){
  const lv = lvNow();
  const chips = DECOR_CATS.map(([k, ja]) => `<button class="chip" type="button" data-rc="${k}" aria-pressed="${k === roomCat}">${ja}</button>`).join('');
  const tiles = DECOR[roomCat].map(d => {
    const locked = lv < d.lv;
    return `<button class="tile rtile" type="button" data-rd="${d.id}" aria-pressed="${S.room[roomCat] === d.id}" ${locked ? 'aria-disabled="true"' : ''}>${roomSwatch(roomCat, d)}<span class="tname">${esc(d.ja)}</span>${locked ? `<span class="lockpill">Lv${d.lv}で解放</span>` : ''}</button>`;
  }).join('');
  const ev = activeEvent();
  return `<div class="chips rchips">${chips}</div><div class="tiles">${tiles}</div>
    <div class="seasonrow"><span>${ev ? `いまは<b>${esc(ev.ja)}</b>。` : ''}季節のかざりつけ</span><div class="seg mini-seg"><button type="button" data-season="1" aria-pressed="${S.room.season}">あり</button><button type="button" data-season="0" aria-pressed="${!S.room.season}">なし</button></div></div>`;
}
function wireRoomTab(root, rerender){
  root.querySelectorAll('[data-rc]').forEach(b => b.addEventListener('click', () => { roomCat = b.dataset.rc; rerender(); }));
  root.querySelectorAll('[data-rd]').forEach(b => b.addEventListener('click', () => {
    if (b.getAttribute('aria-disabled') === 'true') return;
    const d = findDecor(roomCat, b.dataset.rd);
    if (S.room[roomCat] === d.id) return;
    S.room[roomCat] = d.id;
    applyRoom();
    track('room', { ja:d.ja });
    if (!Pet.busy && !Pet.sleeping){ Pet.flash('happy', 1400); Pet.say(pick(['すてき！','いいかんじ！','わくわくする！'])); }
    commit();
    rerender();
  }));
  root.querySelectorAll('[data-season]').forEach(b => b.addEventListener('click', () => { S.room.season = b.dataset.season === '1'; applyRoom(); commit(); rerender(); }));
}

/* ===== tricks ===== */
const TRICK_MS = { sit:1100, paw:1600, down:1500, spin:1000, bigjump:900, high:1600, roll:1300, bow:1400, dance:1800, bang:2200, stretch:1600, punch:1500 };
function trickState(id){ return S.tricks[id] || (S.tricks[id] = { p:0, ok:false }); }
function openTricks(){
  if (Pet.busy || !S) return;
  const lv = lvNow(), list = TRICKS[S.pet.species] || TRICKS.dog;
  const learned = list.filter(t => S.tricks[t.id] && S.tricks[t.id].ok).length;
  const tiles = list.map(t => {
    const st = S.tricks[t.id] || { p:0, ok:false }, locked = lv < t.lv;
    const dots = Array.from({ length:t.need }, (_, i) => `<i class="${i < st.p ? 'on' : ''}"></i>`).join('');
    return `<button class="tile trick ${st.ok ? 'learned' : ''}" type="button" data-tk="${t.id}" ${locked ? 'aria-disabled="true"' : ''}>
      <span class="tk-star">${mini('trick', st.ok ? '' : 'dim')}</span><span class="tname">${esc(t.ja)}</span>
      ${locked ? `<span class="lockpill">Lv${t.lv}で解放</span>` : st.ok ? '<span class="okpill">できる！</span>' : `<span class="tk-dots" aria-label="れんしゅう ${st.p}/${t.need}">${dots}</span>`}</button>`;
  }).join('');
  openSheet('げい', `<p class="sheet-sub">おぼえた げい ${learned} / ${list.length}　れんしゅうして、できるようになったら いつでも見せてくれます。</p><div class="tiles">${tiles}</div><p class="note">ごきげんがいいと、れんしゅうが うまくいきやすいよ。</p>`, sh => {
    sh.querySelectorAll('[data-tk]').forEach(b => b.addEventListener('click', () => {
      if (b.getAttribute('aria-disabled') === 'true') return;
      doTrick(list.find(t => t.id === b.dataset.tk));
    }));
  });
}
async function doTrick(tk){
  closeSheet();
  if (Pet.busy || !S) return;
  decay();
  if (S.stats.full < 10){ Pet.wake(); Pet.flash('sad', 2000); Pet.say('おなかがすいて できないよ…'); return; }
  begin();
  await Pet.moveTo(50, 80, 1.2);
  Pet.say(tk.cue, 1100);
  await sleep(800);
  const st = trickState(tk.id);
  const pOk = Math.min(.93, .55 + st.p * .07 + (S.stats.mood >= 60 ? .1 : 0));
  const success = st.ok || Math.random() < pOk;
  const day = dayKey();
  if (S.trickDay.day !== day){ S.trickDay.day = day; S.trickDay.love = 0; }
  if (success){
    const cls = 'tr-' + tk.anim;
    if (tk.anim === 'bang') Pet.setExpr('sleep'); else Pet.setExpr('happy');
    Pet.el.classList.add(cls);
    await sleep(TRICK_MS[tk.anim] || 1200);
    Pet.el.classList.remove(cls);
    Pet.setExpr('happy'); Pet.wag(1500); hearts(3);
    S.stats.mood = clamp(S.stats.mood + 3, 0, 100);
    if (S.trickDay.love < 10){ S.trickDay.love += 1; gainLove(1); }
    if (!st.ok){
      st.p++;
      if (st.p >= tk.need){
        st.ok = true;
        addAlbum('trick', `げい「${tk.ja}」をおぼえた！`, `${tk.need}回のれんしゅうで できるようになったね`, 'trick');
        gainLove(5);
        Pet.say('できるように なったよ！');
        Modal.show({ label:'げいをおぼえた', confetti:true,
          html:`${petCard()}<h3>げい「${esc(tk.ja)}」を<br>おぼえた！</h3><p>これからは いつでも見せてくれます。<br>♥+5</p><button class="btn primary" type="button" data-close>すごいね！</button>` });
      } else Pet.say(`できた！（${st.p}/${tk.need}）`);
    } else Pet.say(pick(['どう？','じょうずでしょ！','えへへ','もっと見る？']));
  } else {
    Pet.tilt(); Pet.say(pick(['？？？','えっと…','むずかしいな…']), 1400);
    await sleep(1200);
    Pet.say('もういっかい やってみる！', 1600);
  }
  track('trick', { id:tk.id });
  await sleep(1000);
  Pet.setExpr(null);
  finish();
}
